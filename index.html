<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>就活</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="就活">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#020204">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --ink:#04040A;
  /* 一覧のカードは「半透明の塗り」で表現する。
     背景が固定のグラデーションなので、ブラーを掛けなくても見え方はほぼ同じで、
     33枚ぶんの背景ぼかしを毎フレーム計算する負荷だけを避けられる */
  /* iOS の通知タイルは暗い板ではなく、白を薄く透かした面。
     背景の色を拾うので、黒地でも沈まない */
  /* One UI のタイルは背景の色を強く拾う。白だけでなく寒色を混ぜて厚みを出す */
  --surface:linear-gradient(180deg, rgba(186,206,238,0.17) 0%, rgba(150,175,215,0.09) 100%), rgba(24,30,46,0.42);
  --surface-hi:linear-gradient(180deg, rgba(196,216,248,0.26) 0%, rgba(160,185,225,0.15) 100%), rgba(30,38,56,0.46);
  --hi:linear-gradient(180deg, rgba(186,206,238,0.16) 0%, rgba(150,175,215,0.05) 100%), rgba(20,26,40,0.8);
  /* Apple の Dock に合わせ、背景がはっきり透ける濃度にする */
  --chrome:linear-gradient(180deg, rgba(190,210,242,0.16) 0%, rgba(150,175,215,0.05) 100%), rgba(20,26,40,0.34);
  --line:rgba(255,255,255,0.14);
  --line-soft:rgba(255,255,255,0.06);
  --text:#FFFFFF; --muted:#A2A2B2; --dim:#656573;
  --blue:#0A84FF; --go:#30D158; --wait:#FF9F0A; --hot:#FF453A; --fail:#6E3E4B;

  /* 縁取りではなく、上端の反射と沈み込みの影だけで面を立たせる */
  /* One UI のタイルには縁取りも上端の光もない。柔らかい影だけで浮かせる */
  --glass-edge:
    0 2px 10px -4px rgba(0,0,0,0.4),
    0 10px 28px -14px rgba(0,0,0,0.5);
  --glass-drop-lg:
    0 20px 56px -10px rgba(0,0,0,0.8),
    inset 0 1.5px 0.5px rgba(255,255,255,0.75),
    inset 0 -1px 1px rgba(0,0,0,0.5);

  /* iOS 26 相当のスプリング。到達が速く、余韻が長い */
  /* まず全環境で動く曲線を入れておき、linear() が使える環境だけ差し替える。
     未対応環境で linear() を直に書くと、その transition ごと無効になる */
  --spring:cubic-bezier(0.32, 0.72, 0, 1);
  --spring-soft:cubic-bezier(0.16, 1, 0.3, 1);
  --ease:cubic-bezier(0.25, 0.1, 0.25, 1);
  --press:cubic-bezier(0.2, 0, 0, 1);
  --out:cubic-bezier(0.55, 0, 0.85, 0.35);

  /* iOS の角丸。外側ほど大きく、内側は「外側 − 余白」で決める（入れ子の法則） */
  --r-sheet:40px;   /* 画面下から出るシート */
  --r-tile:28px;    /* 一覧のカード */
  --r-card:24px;    /* 小さめのカード */
  --r-field:16px;   /* 入力欄・大きなボタン */
  --r-chip:999px;   /* カプセル形。ドック・区分・チップ・小ボタン */
  /* 入れ子の法則：内側の角丸 ＝ 外側の角丸 − 余白。
     これを外すと、外枠と中身の曲線が平行にならず不安定に見える */
  --r-in-tile:calc(var(--r-tile) - 15px);   /* タイル内の要素（余白15px） */
  --r-in-sheet:calc(var(--r-sheet) - 20px); /* シート内の要素（余白20px） */

  --disp:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}

@supports (transition-timing-function: linear(0, 1)){
  :root{
    --spring:linear(
      0,.0088 1.5%,.0345 3.1%,.1305 6.6%,.4223 14.3%,.5477 17.6%,.6539 20.9%,
      .7439 24.4%,.8189 28%,.8802 31.9%,.9295 36.1%,.9682 40.9%,.9887 45.2%,
      1.0011 50%,1.0058 55.6%,1.0033 63.5%,1 78.5%,1);
  }
}
/* Apple の角は円弧ではなく連続曲線。対応環境では本物の形にする */
@supports (corner-shape: squircle){
  .row,.stripitem,.pcard,.card,.spotbox,.setupBox,
  .gh,.big,.f,.tabbar,.seg,.pill,.chiprow button,
  .sideclose,#toast,#stale,#ptr,#side,.setupErr,.logo.mono{
    corner-shape:squircle;
  }
  /* カプセル形は連続曲線にすると潰れて見えるので、円弧のままにする */
  .tabbar,.seg,.pill,.chiprow button,.gh{corner-shape:round}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
*::-webkit-scrollbar{width:6px;height:6px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:999px}

html{background:var(--ink);-webkit-text-size-adjust:100%;scroll-padding-bottom:120px}
/* 背景は固定レイヤーとして敷く。background-attachment:fixed は
   iOS でスクロールのたびに再描画されるため使わない */
body::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(130% 92% at 0% -8%,   rgba(52,104,180,0.16) 0%, rgba(52,104,180,0.04) 44%, transparent 74%),
    radial-gradient(120% 84% at 100% 16%, rgba(48,120,170,0.1) 0%, rgba(48,120,170,0.03) 46%, transparent 76%),
    radial-gradient(165% 105% at 50% 110%, rgba(40,70,130,0.14) 0%, rgba(40,70,130,0.035) 50%, transparent 80%);
}
body::after{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.03;
  /* 一度描いたら変わらない層として固定する */
  transform:translateZ(0);
  background-image:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'>\
<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter>\
<rect width='120' height='120' filter='url(%23n)'/></svg>");
}
body{
  overscroll-behavior-y:none;margin:0;background:transparent;color:var(--text);
  font-family:var(--body);font-variant-numeric:tabular-nums;
  padding:calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
          calc(140px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  max-width:480px;margin:0 auto;
}
button,select,input{font-family:var(--body)}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:200;background:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  transition:opacity .34s var(--ease),visibility .34s}
#splash.gone{opacity:0;visibility:hidden;pointer-events:none}
#splash .mark{font-size:28px;font-weight:700;letter-spacing:.26em;color:var(--text);
  padding-left:.26em;animation:popIn .5s var(--spring)}
#splash .rule{width:54px;height:1px;background:var(--line);position:relative;overflow:hidden}
#splash .rule::after{content:'';position:absolute;inset:0;background:var(--text);
  transform:translateX(-100%);animation:sweep 1.1s var(--ease) infinite}
#splash .sub{font-family:var(--mono);font-size:9px;letter-spacing:.3em;color:var(--dim)}

/* ---------- type ---------- */
.lab{margin:24px 0 8px;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.2em}
.hero{padding-bottom:20px;border-bottom:1px solid var(--line-soft);margin-bottom:2px;cursor:pointer;
  transition:transform .5s var(--spring),opacity .2s var(--ease)}
.hero:active{transform:scale(.978);opacity:.86;transition:transform .1s var(--press)}
.hero h1{font-size:24px;font-weight:700;margin:0;letter-spacing:-.028em;line-height:1.15}
.cd{line-height:1;display:flex;align-items:baseline;margin-top:14px}
.cd b{font-family:var(--disp);font-size:58px;font-weight:600;letter-spacing:-.045em;
  /* 時計の数字と同じく、わずかに透かして内側に陰を落とす */
  color:rgba(255,255,255,.96);
  text-shadow:0 1px 0 rgba(255,255,255,.28), 0 3px 26px rgba(255,255,255,.14),
              0 -1px 1px rgba(0,0,0,.22)}
.cd s{font-family:var(--mono);font-size:12px;color:var(--muted);margin:0 10px 0 3px;text-decoration:none}

/* ---------- strip & rows ---------- */
.strip{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 4px}
.stripitem{display:inline-flex;align-items:center;gap:10px;width:100%;max-width:380px;
  text-align:left;cursor:pointer;background:var(--surface);
  border:none;border-radius:var(--r-card);padding:13px 16px;color:var(--text);
  box-shadow:var(--glass-edge);
  transition:transform .5s var(--spring),opacity .2s var(--ease)}
.stripitem:active{transform:scale(.965);transition:transform .1s var(--press)}
.stripitem .k{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--muted);
  border:1px solid var(--line);border-radius:999px;padding:3px 9px;flex:0 0 auto;
  background:rgba(255,255,255,.07)}
.stripitem .n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stripitem .d{margin-left:auto;font-family:var(--disp);font-size:15px;font-weight:600;flex:0 0 auto}
.stripitem .w{font-family:var(--mono);font-size:10px;color:var(--dim);flex:0 0 auto}

.row[data-act]{cursor:pointer}
.row{
  /* 画面外のカードは描かない。31枚あるので効果が大きい */
  content-visibility:auto;
  contain-intrinsic-size:auto 104px;
  /* 各カードの中で描画を完結させ、隣のカードの再描画を誘発させない */
  contain:layout paint style;
  background:var(--surface);
  border:none;border-radius:var(--r-tile);
  box-shadow:var(--glass-edge);
  margin-bottom:10px;overflow:hidden;cursor:pointer;
  display:flex;flex-direction:column;justify-content:space-between;
  opacity:var(--base-op, 1);
  transition:transform .5s var(--spring),opacity .2s var(--ease),background .2s var(--ease)}
.row:active{transform:scale(.975);background:var(--surface-hi);
  transition:transform .1s var(--press),background .1s var(--ease)}
.row.is-fixed{
  background:linear-gradient(180deg, rgba(64,214,120,0.24) 0%, rgba(40,150,90,0.1) 100%), rgba(18,34,26,0.4);
  box-shadow:var(--glass-edge)}
.row.is-offer{
  background:linear-gradient(180deg, rgba(72,222,130,0.32) 0%, rgba(44,164,98,0.14) 100%), rgba(18,38,28,0.44);
  box-shadow:var(--glass-edge), 0 0 24px -8px rgba(48,209,88,.35)}
.row.is-muted{--base-op:0.42}

.row .main{padding:16px 17px 13px;display:flex;align-items:center;gap:14px;flex:1 1 auto}
.day{width:60px;flex:0 0 auto;text-align:center}
.day b{font-family:var(--disp);font-size:33px;font-weight:600;letter-spacing:-.04em;line-height:1;display:block;
  text-shadow:0 1px 0 rgba(255,255,255,.16)}
.day s{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.12em;margin-top:4px;display:block;text-decoration:none}
.day .tag{font-family:var(--mono);font-size:10px;letter-spacing:.1em;line-height:1.5}
.body1{min-width:0;flex:1}
.meta{display:flex;align-items:center;gap:8px}
.meta em{font-family:var(--mono);font-size:12px;color:rgba(255,255,255,.66);font-style:normal;letter-spacing:.02em}
.meta i{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:rgba(255,255,255,.45);font-style:normal}
.name{font-size:17px;font-weight:600;letter-spacing:-.022em;margin-top:5px;line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-family:var(--mono);font-size:11.5px;color:rgba(255,255,255,.62);margin-top:5px;
  letter-spacing:-.005em}
.acts{display:flex;gap:8px;padding:0 17px 14px 76px;flex:0 0 auto}
.gh{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);color:var(--muted);
  border-radius:var(--r-chip);padding:6px 14px;font-size:12px;cursor:pointer;text-decoration:none;
  display:inline-block;box-shadow:inset 0 1px 0 rgba(255,255,255,.28);
  transition:transform .42s var(--spring),background .16s var(--ease),color .16s var(--ease)}
.gh:active{transform:scale(.9);transition:transform .1s var(--press)}
.logo{width:28px;height:28px;border-radius:14px;flex:0 0 auto;display:flex;align-items:center;
  justify-content:center;overflow:hidden;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.4)}
.logo img{width:78%;height:78%;object-fit:contain}
.logo.mono{background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.25)}
.logo.mono span{color:#EDEDF2;font-weight:600}

/* ---------- sheet / card ---------- */
.sheet{
  position:fixed;inset:0;height:100dvh;background:rgba(0,0,0,.5);
  /* 背後はすでに縮小・減光しているので、ここでのぼかしは二重になる */
  display:flex;align-items:flex-end;justify-content:center;z-index:60;
  padding:0 10px calc(10px + env(safe-area-inset-bottom));
  opacity:0;pointer-events:none;
  transition:opacity .28s var(--ease);
  will-change:opacity;transform:translateZ(0);
}
.sheet.is-active{opacity:1;pointer-events:auto}
.card{
  position:relative;width:100%;max-width:480px;
  height:85vh;height:85dvh;display:flex;flex-direction:column;overflow:hidden;
  border-radius:var(--r-sheet);border:none;
  background:linear-gradient(180deg, rgba(186,206,238,0.15) 0%, rgba(150,175,215,0.06) 100%), rgba(18,24,38,0.78);
  backdrop-filter:blur(36px) saturate(200%);-webkit-backdrop-filter:blur(36px) saturate(200%);
  box-shadow:var(--glass-drop-lg);
  padding:12px 20px calc(14px + env(safe-area-inset-bottom));
  transform:translate3d(0,105%,0);
  transition:transform .58s var(--spring);
  will-change:transform;
}
.sheet.is-active .card{transform:translate3d(0,0,0)}
/* せり上がっている最中はぼかしを外す。動きながらのぼかしが一番重い */
.card.noblur{backdrop-filter:none !important;-webkit-backdrop-filter:none !important;
  background:linear-gradient(180deg, rgba(44,44,58,.95) 0%, rgba(16,16,24,.98) 100%) !important}
.grab{width:40px;height:5px;background:rgba(255,255,255,.3);border-radius:3px;margin:0 auto 16px;
  transition:background .2s var(--ease);flex:0 0 auto}
.card.drag .grab{background:rgba(255,255,255,.7)}
.sheet.out{opacity:0}
.sheet.out .card{transform:translate3d(0,100%,0) scale(.97);transition:transform .3s var(--out)}
.sheet .card.drag{transition:none}
.sheet .card.spring{transition:transform .58s var(--spring)}
.sheet .card.fly{transition:transform .26s var(--out),opacity .22s var(--ease);
  will-change:transform,opacity;backface-visibility:hidden}
/* 飛ばしたカードには、閉じる動きを重ねて掛けない（残像の原因）。
   位置はインラインの transform が持っているので、そちらを優先させる */
.sheet.out .card.fly{transition:transform .26s var(--out),opacity .22s var(--ease) !important}
.sideclose{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:16px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:var(--muted);
  font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  line-height:1;z-index:5;box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .42s var(--spring),background .16s var(--ease),color .16s var(--ease)}
.sideclose:active{transform:scale(.88);transition:transform .1s var(--press)}
.sideclose:hover{background:rgba(255,255,255,.22);color:var(--text)}

/* ---------- detail ---------- */
.card-head{flex:0 0 auto;padding-right:46px;animation:rise .4s var(--spring) both}
.tabs{display:flex;gap:2px;margin-top:20px;border-bottom:1px solid var(--line-soft);position:relative}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);
  padding:11px 12px;font-size:13px;font-weight:500;cursor:pointer;
  transition:color .2s var(--ease),border-color .2s var(--ease),transform .42s var(--spring)}
.tabs button:active{transform:scale(.94);transition:transform .1s var(--press)}
.tabs button.on{color:var(--text);border-bottom-color:var(--text)}
.tab-pane{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:32px;padding-right:4px;animation:tabPaneIn .42s var(--spring) both}
@keyframes tabPaneIn{
  from{opacity:0;transform:translate3d(16px,0,0)}
  to{opacity:1;transform:translate3d(0,0,0)}
}
.kv{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.kv span:first-child{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.kv span:last-child{font-size:13px;text-align:right;word-break:break-all;margin-left:16px}
.f{width:100%;background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.15);border-radius:var(--r-field);
  padding:13px 15px;color:var(--text);font-size:14px;outline:none;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.4);
  transition:border-color .2s var(--ease),background .2s var(--ease),box-shadow .2s var(--ease)}
.f:focus{border-color:var(--blue);background:rgba(0,0,0,.5);
  box-shadow:0 0 0 3.5px rgba(10,132,255,.32), inset 0 1px 2px rgba(0,0,0,.4)}
.card .f{margin-top:8px;border-radius:var(--r-in-sheet)}
.card .big{border-radius:var(--r-in-sheet)}
.big{width:100%;padding:14px 0;border-radius:var(--r-field);border:none;font-size:14px;font-weight:600;
  cursor:pointer;margin-top:12px;display:block;text-align:center;text-decoration:none;
  box-shadow:0 4px 14px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .5s var(--spring),opacity .2s var(--ease)}
.big:active{transform:scale(.94);transition:transform .1s var(--press)}
.big[disabled]{opacity:.4;cursor:default}
.rail{display:flex;align-items:center}
.rail i{flex:0 0 auto;border-radius:9px;display:block;transition:all .5s var(--spring)}
.rail u{height:1px;flex:1;display:block}
.railtxt{display:flex;justify-content:space-between;margin-top:8px}
.railtxt span{font-size:8.5px;color:var(--dim);flex:1;text-align:center}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:6px}

/* ---------- dock & segment ---------- */
.tabbar,.seg{
  touch-action:pan-y;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  position:relative;isolation:isolate;
  background:var(--chrome);
  border:1px solid rgba(255,255,255,0.14);
  box-shadow:var(--glass-edge);
  transition:transform .5s var(--spring),background .3s var(--ease),
             border-color .3s var(--ease),box-shadow .3s var(--ease);
}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);
  /* 画面に固定されていてスクロールで再計算されないので、強めのブラーを掛けられる */
  backdrop-filter:blur(32px) saturate(190%) brightness(1.04);
  -webkit-backdrop-filter:blur(32px) saturate(190%) brightness(1.04);
  bottom:calc(18px + env(safe-area-inset-bottom));z-index:45;
  display:inline-flex;align-items:center;justify-content:center;gap:2px;
  white-space:nowrap;max-width:calc(100vw - 24px);
  border-radius:var(--r-chip);padding:5px;--pw:88px;--pg:2px}
.tabbar button{background:none;border:none;color:var(--muted);font-size:13px;font-weight:600;
  padding:10px 0;border-radius:var(--r-chip);cursor:pointer;position:relative;z-index:1;
  white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
  transition:color .22s var(--ease),transform .42s var(--spring)}
.tabbar button:active{transform:scale(.93);transition:transform .1s var(--press)}
.tabbar button:not(.ico){width:var(--pw)}
.tabbar button.on{color:#000}
.tabbar .sep{width:1px;height:20px;background:var(--line);margin:0 4px;flex-shrink:0}
.tabbar .ico{padding:10px 15px;font-size:18px;font-weight:400;color:var(--text);line-height:1;
  white-space:nowrap;flex-shrink:0}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin:0 auto 16px;max-width:320px;
  /* 本文と一緒にスクロールする要素にブラーを掛けると毎フレーム計算される。
     塗りを一段濃くして見え方を合わせる */
  background:linear-gradient(180deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.04) 100%), rgba(18,18,28,0.55);
  border-radius:var(--r-chip);padding:4px}
.seg button{background:none;border:none;color:var(--muted);position:relative;z-index:1;
  border-radius:var(--r-chip);padding:10px 0;font-size:13px;font-weight:600;cursor:pointer;
  white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;
  transition:color .22s var(--ease),transform .42s var(--spring)}
.seg button:active{transform:scale(.94);transition:transform .1s var(--press)}
.seg button.on{color:#000}
.sgn{font-family:var(--mono);font-size:10px;margin-left:7px;opacity:.7}

/* ピル本体 */
.pill{
  position:absolute;z-index:0;pointer-events:none;border-radius:var(--r-chip);overflow:hidden;
  background:linear-gradient(180deg, rgba(255,255,255,0.96) 0%, rgba(238,242,250,0.9) 100%);
  box-shadow:0 2px 8px rgba(0,0,0,0.2);
  transform:translate3d(0,0,0);
  transition:transform .55s var(--spring);
  will-change:transform;
}
/* 上面の照り返しだけを残す */
.pill::before{content:'';position:absolute;left:8%;right:8%;top:2px;height:40%;
  border-radius:999px;pointer-events:none;opacity:.32;
  background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,0))}
.tabbar .pill{left:5px;top:5px;width:var(--pw);height:calc(100% - 10px)}
.tabbar.p1 .pill{transform:translate3d(calc(var(--pw) + var(--pg)),0,0)}
.seg .pill{left:4px;top:4px;height:calc(100% - 8px);width:calc((100% - 8px) / 2)}
.seg.i1 .pill{transform:translate3d(100%,0,0)}

/* つまんでいる間だけ、四辺のふちを光らせる */
.tabbar::after,.seg::after{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;
  opacity:0;transition:opacity .25s var(--ease);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(255,255,255,.12),
             inset 1px 0 0 rgba(255,255,255,.16),inset -1px 0 0 rgba(255,255,255,.16)}
.tabbar.lifted::after,.seg.lifted::after{opacity:1}

.tabbar.lifted,.seg.lifted{
  background:linear-gradient(180deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.03) 100%), rgba(26,26,36,0.3);
  border-color:rgba(255,255,255,.36);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(0,0,0,.4),
             0 0 30px rgba(255,255,255,.14),0 18px 46px rgba(0,0,0,.6)}
.tabbar.lifted{transform:translateX(-50%) scale(1.055)}
.seg.lifted{transform:scale(1.045)}
@media (min-width:1000px){ .tabbar.lifted{transform:scale(1.055)} }

/* つまんでいる間は、一覧のタイルと同じすりガラスになる。
   縁取りも上端の光も入れず、影だけで浮かせる（One UI と同じ作り） */
.grabbing .pill{
  transition:none !important;
  will-change:transform;
  background:linear-gradient(180deg, rgba(186,206,238,0.28) 0%, rgba(150,175,215,0.16) 100%),
             rgba(24,30,46,0.5) !important;
  backdrop-filter:blur(20px) saturate(190%) brightness(1.15);
  -webkit-backdrop-filter:blur(20px) saturate(190%) brightness(1.15);
  box-shadow:0 4px 14px -4px rgba(0,0,0,.45),
             0 14px 32px -14px rgba(0,0,0,.55) !important}
/* 面が透けるので、文字は白のまま読ませる */
.grabbing button.on{color:var(--text) !important}
.grabbing .pill::before{opacity:0}
.grabbing button{color:var(--text) !important}
.settling .pill{transition:transform .58s var(--spring)}

/* PC は余力があるので、カードにも本物のすりガラスを掛ける。
   スマホは塗りだけで表現して負荷を避ける */
@media (min-width:1000px){
  .row,.stripitem,.pcard{
    backdrop-filter:blur(22px) saturate(170%);
    -webkit-backdrop-filter:blur(22px) saturate(170%);
  }
}

/* ---------- passport ---------- */
.ptitle{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.2em;margin-bottom:12px}
.pwrap{display:flex;flex-direction:column;gap:12px}
.pcol{display:contents}
.po1{order:1}.po2{order:2}.po3{order:3}.po4{order:4}.po5{order:5}
.pcard{border-radius:var(--r-card);padding:20px;position:relative;overflow:hidden;
  border:1px solid rgba(255,255,255,0.16);box-shadow:var(--glass-edge)}
.pcard.flat{background:var(--surface)}
.pcard.flat .ttl{color:var(--muted)}
.pcard .ttl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;opacity:.85}
.pcard .num{font-family:var(--disp);font-size:44px;line-height:1;font-weight:700;letter-spacing:-.04em}
.pgrid{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px}
.pgrid div>span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.08em;opacity:.68;margin-top:4px}
.pgrid div>b{font-family:var(--disp);font-size:34px;font-weight:700;line-height:1;letter-spacing:-.035em}
.pmini{display:flex;gap:16px;margin-top:14px;padding-top:12px;
  border-top:1px solid rgba(255,255,255,.14);font-size:11px;opacity:.85}
.pmini b{font-family:var(--disp);font-size:15px;font-weight:700;margin-left:4px}
.pfoot{margin-top:10px;font-size:11.5px;opacity:.72;line-height:1.5}
.rateRow{margin-bottom:13px}
.rateRow:last-child{margin-bottom:4px}
.rateHead{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px}
.rateNum{font-family:var(--mono);font-size:11px}
.rateNum i{color:var(--dim);margin-left:8px;font-style:normal}
.legend{display:flex;gap:14px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line-soft);
  font-family:var(--mono);font-size:10px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.brkRow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;
  border-bottom:1px solid var(--line-soft);font-size:13px}
.brkRow:last-child{border-bottom:none;padding-bottom:0}

/* ---------- chips ---------- */
/* 下端のぼかしは背景専用の層に掛ける。要素ごとマスクするとボタンまで欠ける */
.chips{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  margin:16px -16px 10px;padding:10px 16px 14px}
.chips::before{content:'';position:absolute;z-index:-1;
  /* 100vw にすると右パネルの下まで潜り込み、
     半透明のパネル越しに黒帯として透けてしまう。本文の幅に収める。
     ただし左右へ少しはみ出させ、境目を読む範囲の外で消す */
  left:-14px;right:-14px;top:-18px;bottom:-6px;
  /* 縦の減衰は塗りで、横の減衰はマスクで。四辺すべてが溶けて切れ目が出ない */
  background:linear-gradient(180deg,
    rgba(4,4,10,0) 0%, rgba(4,4,10,.34) 34%, rgba(4,4,10,.34) 62%, rgba(4,4,10,0) 100%);
  -webkit-mask-image:linear-gradient(90deg,
    transparent 0%, #000 7%, #000 93%, transparent 100%);
  mask-image:linear-gradient(90deg,
    transparent 0%, #000 7%, #000 93%, transparent 100%)}
.chiprow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:2px 0}
.chiprow::-webkit-scrollbar{display:none}
.chiprow button{flex:0 0 auto;
  background:linear-gradient(180deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.03) 100%), rgba(22,22,34,0.6);
  border:1px solid rgba(255,255,255,.16);color:var(--muted);border-radius:var(--r-chip);
  padding:8px 16px;font-size:12px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:7px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 2px 8px rgba(0,0,0,.3);
  transition:background .24s var(--ease),color .24s var(--ease),transform .5s var(--spring)}
.chiprow button:active{transform:scale(.88);transition:transform .1s var(--press)}
.chiprow button b{font-family:var(--disp);font-size:16px;font-weight:600;line-height:1}
.chiprow button.on{background:linear-gradient(180deg,#FFFFFF 0%,#EDEDF4 100%);
  color:#000;border-color:transparent;font-weight:600;
  box-shadow:0 2px 12px rgba(255,255,255,.2), inset 0 1px 0 #FFFFFF}
.chiprow button.on b{color:#000}

.lanes{transition:opacity .2s var(--ease)}
.lane{transition:opacity .2s var(--ease);margin-bottom:18px}
.lane > .lab{display:flex;align-items:center;gap:9px;margin:22px 0 10px}
.lane > .lab::before{content:'';width:3px;height:12px;border-radius:2px;
  background:currentColor;opacity:.8;flex:0 0 auto}
.lane > .accord-btn{display:flex;align-items:center;gap:9px;margin:22px 0 10px}
.lane.is-filt-hidden{display:none !important}
/* 絞り込み時の再生。--fi を使い、画面切り替え用より優先度を上げる */
#view .lanes.filt-in .lane:not(.is-filt-hidden) > .lab,
#view .lanes.filt-in .lane:not(.is-filt-hidden) > .accord-btn{
  animation:rise .4s var(--spring) both}
#view .lanes.filt-in .lane:not(.is-filt-hidden) .row{
  animation:rise .5s var(--spring) both !important;
  animation-delay:calc(var(--fi,0) * 26ms) !important}
/* 再生中は「画面外を描かない」設定を外す。

#view .lanes.filt-in .row{content-visibility:visible}
.accord-btn{width:100%;background:none;border:none;text-align:left;cursor:pointer;padding:0;color:var(--muted);
  transition:transform .42s var(--spring),opacity .2s var(--ease)}
.accord-btn:active{transform:scale(.98);opacity:.8;transition:transform .1s var(--press)}

.sheet.spot{align-items:flex-start;padding-top:14vh}

#qres button:active{background:rgba(255,255,255,.1);transform:scale(.98);transition:transform .1s var(--press)}
#qres .qn{font-size:14px;font-weight:600}

.emptyNote{color:var(--dim);font-size:13px;line-height:1.9;text-align:center;padding:36px 0}
.setup{display:flex;align-items:center;justify-content:center;min-height:70vh;padding:20px 0}
.setupBox{width:100%;max-width:420px;background:var(--hi);
  backdrop-filter:blur(34px) saturate(230%);-webkit-backdrop-filter:blur(34px) saturate(230%);
  border:1px solid rgba(255,255,255,0.2);border-radius:var(--r-card);padding:28px 24px 26px;
  box-shadow:var(--glass-drop-lg);animation:rise .42s var(--spring)}
.setupMark{font-size:26px;font-weight:700;letter-spacing:.24em;padding-left:.24em;text-align:center}
.setupLead{font-size:12px;color:var(--muted);line-height:1.9;margin-top:14px;text-align:center}
.setupErr{margin-top:14px;padding:10px 12px;border-radius:12px;font-size:12px;line-height:1.7;
  background:rgba(255,69,58,.16);border:1px solid rgba(255,69,58,.4);color:#FFC9C4}
.setupBox .lab{margin:18px 0 8px}
#toast{position:fixed;left:50%;transform:translate3d(-50%,26px,0) scale(.9);
  bottom:calc(96px + env(safe-area-inset-bottom));z-index:80;opacity:0;pointer-events:none;
  background:var(--chrome);backdrop-filter:blur(26px) saturate(210%);-webkit-backdrop-filter:blur(26px) saturate(210%);
  border:1px solid rgba(255,255,255,0.18);border-radius:var(--r-field);padding:12px 20px;font-size:13px;font-weight:500;
  box-shadow:var(--glass-drop-lg);transition:opacity .3s var(--ease),transform .58s var(--spring);max-width:88vw}
#toast.on{opacity:1;transform:translate3d(-50%,0,0) scale(1)}
#ptr{position:fixed;top:calc(6px + env(safe-area-inset-top));left:50%;
  transform:translate3d(-50%,-40px,0) scale(.7);opacity:0;z-index:70;pointer-events:none;
  width:34px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center;
  background:var(--chrome);border:1px solid rgba(255,255,255,.18);box-shadow:var(--glass-edge)}
.ptrRing{width:15px;height:15px;border-radius:50%;
  border:2px solid rgba(255,255,255,.28);border-top-color:#fff}
#ptr.spin .ptrRing{animation:ptrSpin .7s linear infinite}
@keyframes ptrSpin{to{transform:rotate(360deg)}}
#stale{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;
  transform:translate3d(-50%,-14px,0);opacity:0;pointer-events:none;z-index:70;
  background:var(--chrome);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border:1px solid rgba(255,255,255,0.18);border-radius:999px;
  padding:6px 16px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);
  box-shadow:var(--glass-edge);transition:opacity .3s var(--ease),transform .5s var(--spring)}
#stale.on{opacity:1;transform:translate3d(-50%,0,0)}
/* 固定要素の下端に、輪郭を溶かす淡い影を置く */
.tabbar::before,.seg::before{border-radius:inherit}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.65);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:none;align-items:center;justify-content:center;z-index:99;
  font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.2em}

/* ---------- motion ---------- */
@keyframes rise{from{opacity:0;transform:translate3d(0,18px,0) scale(.96)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
@keyframes sweep{to{transform:translateX(100%)}}

/* 画面が切り替わったときの登場。--ei を使う */
#view.enter{animation:rise .34s var(--spring)}
#view.enter .row,#view.enter .pcard,#view.enter .stripitem{animation:rise .55s var(--spring) both}
#view.enter .row{animation-delay:calc(var(--ei,0) * 28ms)}
#view.enter .pcard{animation-delay:calc(var(--ei,0) * 48ms)}
#view.enter .hero{animation:rise .52s var(--spring) both}
#view.enter .chips{animation:rise .38s var(--spring) .06s both}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-delay:0ms !important;
    transition-duration:.01ms !important}
}

#side{display:none}
/* キーボードが出ている間 */
body.kb-open .tabbar{opacity:0;transform:translateX(-50%) translate3d(0,40px,0);pointer-events:none}
body.kb-open .sheet{padding-bottom:calc(10px + var(--kb,0px))}
body.kb-open .card{height:auto;max-height:calc(100dvh - var(--kb,0px) - 40px)}

    background:linear-gradient(180deg, rgba(255,255,255,0.09) 0%, rgba(255,255,255,0.03) 100%), rgba(18,18,26,0.9);
    backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);

<body>

  <div class="mark">就活</div>

</div>

<script>
/* ============ 定数 ============ */
var DEFAULT_ROUTE = ['エントリー','ES','適性検査','GD','面接','最終面接','内定'];
var PALETTE = ['エントリー','ES','適性検査','Webテスト','GD','面談','一次面接','二次面接','三次面接','面接','最終面接','インターン','内定'];
try{
  var _cs=JSON.parse(localStorage.getItem('sk_stages')||'[]');
  _cs.forEach(function(x){ if(PALETTE.indexOf(x)<0) PALETTE.push(x) });
}catch(e){}
function rememberStage(name){
  if(!name)return;
  if(PALETTE.indexOf(name)<0) PALETTE.push(name);
  try{
    var a=JSON.parse(localStorage.getItem('sk_stages')||'[]');
    if(a.indexOf(name)<0){ a.push(name); localStorage.setItem('sk_stages',JSON.stringify(a)); }
  }catch(e){}
}
var KINDS = ['面接','説明会','GD','面談','インターン','適性検査'];
var WD = ['日','月','火','水','木','金','土'];
var NONCO = ['テストセンター','テストセンター受験','Webテスト'];
function isCo(it){return NONCO.indexOf(it.c)<0}

var DATA = {items:[],events:[]};
var openCo = null, tab = 'info';
var TERM = '夏インターン';
var TERMS = ['夏インターン','本選考'];
var FILT = 'all', PAGE = 'list';
var VIEWKEY = '';

try{
  var _savedUi = JSON.parse(localStorage.getItem('sk_ui_state')||'{}');
  if(_savedUi.term && TERMS.indexOf(_savedUi.term)>=0) TERM = _savedUi.term;
  if(_savedUi.page) PAGE = _savedUi.page;
  if(_savedUi.filt) FILT = _savedUi.filt;
}catch(e){}
function saveUiState(){
  try{ localStorage.setItem('sk_ui_state', JSON.stringify({page:PAGE, term:TERM, filt:FILT})); }catch(e){}
}

function ensureShell(){
  var app=document.getElementById('app');
  if(document.getElementById('view')) return;
  app.innerHTML='<div id="segHost"></div><div id="view"></div>';
  document.getElementById('segHost').innerHTML=
    '<div class="seg" id="seg"><span class="pill"></span>'+
    TERMS.map(function(t,i){
      return '<button id="sg'+i+'" onclick="setTerm(\''+t+'\')">'+
             '<span>'+t+'</span><span class="sgn"></span></button>';
    }).join('')+'</div>';
  initLiquid();
}
function updateSeg(){
  var seg=document.getElementById('seg');
  if(!seg)return;
  TERMS.forEach(function(t,i){
    var b=document.getElementById('sg'+i);
    if(!b)return;
    b.className = (TERM===t)?'on':'';
    b.querySelector('.sgn').textContent =
      DATA.items.filter(function(x){return (x.term||'夏インターン')===t}).length;
  });
  seg.classList.toggle('i1', TERM===TERMS[1]);
}
function markEnter(force){
  var el=document.getElementById('view');
  if(!el)return;
  var key=PAGE+'|'+TERM;
  if(!force && key===VIEWKEY){ el.classList.remove('enter'); return; }
  VIEWKEY=key;
  el.classList.remove('enter');
  void el.offsetWidth;
  el.classList.add('enter');
  /* 付けっぱなしにすると、後から走る絞り込みの動きと競合する */
  clearTimeout(window._entT);
  window._entT=setTimeout(function(){ el.classList.remove('enter') },1000);
}

/* ============ ユーティリティ ============ */
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
/* onclick の中は「HTML属性の中のJavaScript文字列」という二重構造。
   実体参照にするだけではブラウザが ' に戻してから JS が読むので壊れる。
   先に JS 用の退避をしてから HTML 用に変換する */
function J(s){
  return esc(String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"));
}
function D(s){
  if(!s)return null;
  var d = new Date(String(s).replace(/-/g,'/').replace('T',' '));
  return isNaN(d.getTime()) ? null : d;
}
function fdate(s){var d=D(s);return d?(d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')':''}
function ftime(s){var d=D(s);return d?('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2):''}
function rem(s){
  var d=D(s);if(!d)return null;
  var ms=d-new Date();if(ms<=0)return null;
  var t=Math.floor(ms/1000);
  return {ms:ms,d:Math.floor(t/86400),h:Math.floor(t%86400/3600),m:Math.floor(t%3600/60),s:t%60};
}
function since(s){
  var d=D(s);if(!d)return null;
  var now=new Date();
  var a=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
  var b=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  return Math.max(0, Math.floor((b-a)/86400000));
}
function routeOf(it){return (it.route&&it.route.length)?it.route:DEFAULT_ROUTE}
function isWide(){return window.innerWidth>=1000}
function ITEMS(){return DATA.items.filter(function(i){return (i.term||'夏インターン')===TERM})}
function EVENTS(){return DATA.events.filter(function(e){return (e.term||'夏インターン')===TERM})}
function byCo(c){var L=ITEMS();for(var i=0;i<L.length;i++){if(L[i].c===c)return L[i]}return null}
function evOf(c){return EVENTS().filter(function(e){return e.c===c}).sort(function(a,b){return (a.at||'').localeCompare(b.at||'')})}
function nextEv(c){var f=evOf(c).filter(function(e){return rem(e.at)});return f[0]||null}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}

/* ============ ロゴ ============ */
var LOGOS = {}, tried = {};
function logo(it,size){
  var s=size||28;
  var st='width:'+s+'px;height:'+s+'px;border-radius:'+(s/2)+'px';
  var cached=LOGOS[it.c];
  if(cached&&cached!=='none')
    return '<div class="logo" style="'+st+'" data-co="'+esc(it.c)+'" data-sz="'+s+'">'+
      '<img loading="lazy" decoding="async" referrerpolicy="no-referrer" src="'+esc(cached)+'" onerror="logoErr(this)"></div>';
  if(it.dom&&cached!=='none')
    return '<div class="logo" style="'+st+'" data-co="'+esc(it.c)+'" data-sz="'+s+'">'+
      '<img loading="lazy" decoding="async" referrerpolicy="no-referrer" src="https://icons.duckduckgo.com/ip3/'+esc(it.dom)+'.ico" onerror="logoErr(this)"></div>';
  return monoLogo(it.c,s);
}
function monoLogo(name,s){
  return '<div class="logo mono" style="width:'+s+'px;height:'+s+'px;border-radius:'+(s/2)+'px" '+
    'data-co="'+esc(name)+'" data-sz="'+s+'">'+
    '<span style="font-size:'+Math.round(s*0.42)+'px">'+esc(String(name).slice(0,1))+'</span></div>';
}
function logoErr(img){
  var box=img.parentNode;
  if(box&&box.dataset) box.outerHTML=monoLogo(box.dataset.co, parseFloat(box.dataset.sz)||28);
}
function wdLogo(name){
  var s='https://www.wikidata.org/w/api.php?action=wbsearchentities&search='+
    encodeURIComponent(name)+'&language=ja&uselang=ja&type=item&limit=1&format=json&origin=*';
  return fetch(s).then(function(r){return r.json()}).then(function(j){
    var id=j.search&&j.search[0]&&j.search[0].id;
    if(!id)return null;
    return fetch('https://www.wikidata.org/w/api.php?action=wbgetclaims&entity='+id+
      '&property=P154&format=json&origin=*').then(function(r){return r.json()}).then(function(j2){
      var c=j2.claims&&j2.claims.P154&&j2.claims.P154[0];
      var f=c&&c.mainsnak&&c.mainsnak.datavalue&&c.mainsnak.datavalue.value;
      return f?'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(f)+'?width=240':null;
    });
  }).catch(function(){return null});
}
function wpThumb(name){
  var q='https://ja.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+
    encodeURIComponent(name)+'&gsrlimit=1&prop=pageimages&piprop=thumbnail&pithumbsize=200&format=json&origin=*';
  return fetch(q).then(function(r){return r.json()}).then(function(j){
    var p=j&&j.query&&j.query.pages;
    if(p)for(var k in p){if(p[k].thumbnail&&p[k].thumbnail.source)return p[k].thumbnail.source}
    return null;
  }).catch(function(){return null});
}
function hydrateLogos(){
  DATA.items.forEach(function(it){
    if(!isCo(it)){tried[it.c]=1;return}
    if(LOGOS[it.c]||tried[it.c])return;
    tried[it.c]=1;
    wdLogo(it.c).then(function(u){return u||wpThumb(it.c)}).then(function(u){
      var url=u||'none';
      LOGOS[it.c]=url;
      api('apiSaveLogo',[it.c,url]).catch(function(){});
      if(url!=='none')paintLogo(it.c,url);
    });
  });
}
function refetchLogo(co){
  delete LOGOS[co]; delete tried[co]; tried[co]=1;
  wdLogo(co).then(function(u){return u||wpThumb(co)}).then(function(u){
    var url=u||'none';
    LOGOS[co]=url;
    api('apiSaveLogo',[co,url]).catch(function(){});
    render(false);
    toast(url==='none'?'ロゴが見つかりませんでした':'ロゴを取り直しました',url!=='none');
  });
}
function setLogoUrl(co){
  var el=document.getElementById('logoUrl');
  var v=el?el.value.trim():'';
  if(!v){toast('画像URLを入れてください');return}
  LOGOS[co]=v; tried[co]=1;
  api('apiSaveLogo',[co,v]).catch(function(){});
  render(false);
  toast('ロゴを設定しました',true);
}
function paintLogo(co,url){
  var list=document.querySelectorAll('[data-co]');
  for(var i=0;i<list.length;i++){
    var b=list[i];
    if(b.dataset.co!==co)continue;
    var s=parseFloat(b.dataset.sz)||28;
    b.className='logo';
    b.style.cssText='width:'+s+'px;height:'+s+'px;border-radius:'+(s/2)+'px';
    b.innerHTML='<img loading="lazy" decoding="async" referrerpolicy="no-referrer" src="'+esc(url)+'" onerror="logoErr(this)">';
  }
}

/* ============ 通信 ============ */
var CFG={ep:'',key:''};
function loadCfg(){
  try{
    CFG.ep = localStorage.getItem('sk_ep')||'';
    CFG.key= localStorage.getItem('sk_key')||'';
  }catch(e){}
  return !!(CFG.ep&&CFG.key);
}
function saveCfg(ep,key){
  CFG.ep=ep; CFG.key=key;
  try{ localStorage.setItem('sk_ep',ep); localStorage.setItem('sk_key',key); }catch(e){}
}
function api(action,args){
  return fetch(CFG.ep,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({key:CFG.key,action:action,args:args||[]}),
    redirect:'follow'
  }).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(j){
    if(j&&j.ok===false) throw new Error(j.error==='unauthorized'?'鍵が違います':j.error);
    return j;
  });
}
function busy(on){document.getElementById('busy').style.display=on?'flex':'none'}
/* 上部の小さな表示。出しっぱなしにならないよう、消すのも文言を戻すのもここで行う */
function staleShow(msg){
  var el=document.getElementById('stale');
  if(!el)return;
  clearTimeout(window._stl);
  clearTimeout(window._stlReset);   /* 消した直後の後片付けが文言を奪わないように */
  el.textContent = msg || '更新中…';
  el.style.borderColor = msg ? 'rgba(255,69,58,.5)' : 'rgba(255,255,255,.18)';
  el.classList.add('on');
  if(msg){ window._stl=setTimeout(staleHide,3200); }   /* 失敗の表示は自動で消す */
}
function staleHide(){
  var el=document.getElementById('stale');
  if(!el)return;
  clearTimeout(window._stl);
  el.classList.remove('on');
  clearTimeout(window._stlReset);
  window._stlReset=setTimeout(function(){
    el.textContent='更新中…';
    el.style.borderColor='rgba(255,255,255,.18)';
  },320);
}
function cacheSave(j){
  try{ localStorage.setItem('sk_cache', JSON.stringify(
    {items:j.items||[], events:j.events||[], logos:j.logos||{}, at:Date.now()})); }catch(e){}
}
function cacheLoad(){
  try{ return JSON.parse(localStorage.getItem('sk_cache')||'null'); }catch(e){ return null }
}
function applyData(j,cb){
  DATA=j;
  if(j&&j.items&&j.items.length){ cacheSave(j); staleHide(); }
  if(DATA.logos)for(var k in DATA.logos)if(!LOGOS[k])LOGOS[k]=DATA.logos[k];
  render(false); hydrateLogos(); if(cb)cb();
}
function resetUi(){
  var box=document.getElementById('sheet');
  if(box) box.innerHTML='';
  if(locked){ locked=false; lockScroll(false); }
  pushed=false; openCo=null;
  document.body.classList.remove('sheet-open');
  var dock=document.getElementById('tabbar');
  if(dock) dock.style.display='';
  var side=document.getElementById('side');
  if(side){ side.dataset.co=''; side.innerHTML=''; }
}
function call(fn,args,cb){
  busy(true);
  api(fn,args).then(function(j){ busy(false); applyData(j,cb); })
  .catch(function(e){
    busy(false); hideSplash(); resetUi();
    document.getElementById('app').innerHTML=
      '<div style="color:var(--dim);font-size:13px;line-height:1.9;padding:40px 0">'+
      '読み込めませんでした。<br>'+esc(e&&e.message?e.message:'')+
      '<br><br><button class="gh" onclick="location.reload()">再読み込み</button>'+
      '<button class="gh" style="margin-left:8px" onclick="openSetup()">接続設定</button></div>';
  });
}
var booted=false;
function hideSplash(){
  if(booted)return; booted=true;
  var el=document.getElementById('splash');
  if(el){el.classList.add('gone');setTimeout(function(){if(el.parentNode)el.remove()},340)}
}
function load(){
  var c=cacheLoad();
  if(c && c.items && c.items.length){
    applyData(c, hideSplash);
    staleShow();
    api('apiGetData',[]).then(function(j){
      if(!j||!j.items) return;
      applyData(j);
      staleHide();
    }).catch(function(){
      staleShow('最新を取得できませんでした');
    });
    return;
  }
  call('apiGetData',[],hideSplash);
}

/* ============ 楽観的更新 ============ */
function toast(msg,ok){
  var el=document.getElementById('toast');
  el.textContent=msg;
  el.style.borderColor = ok?'rgba(48,209,88,.6)':'rgba(255,69,58,.6)';
  el.classList.add('on');
  clearTimeout(window._tt);
  window._tt=setTimeout(function(){el.classList.remove('on')},2200);
}
function opt(mutate,fn,args,label){
  var snap=JSON.stringify(DATA.items);
  mutate();
  render(false);
  api(fn,args).then(function(d){
    if(d&&d.items){ DATA.items=d.items; DATA.events=d.events; cacheSave(d); }
    render(false);
  }).catch(function(){
    DATA.items=JSON.parse(snap);
    render(false);
    toast('保存できませんでした。通信を確認してください');
  });
  if(label)toast(label,true);
}
function find_(co){
  for(var i=0;i<DATA.items.length;i++){
    if(DATA.items[i].c===co&&(DATA.items[i].term||'夏インターン')===TERM)return DATA.items[i];
  }
  return null;
}
function doDone(co){
  opt(function(){var it=find_(co);if(!it)return;it.status='結果待ち';it.since=todayStr();},
      'apiMarkDone',[co,TERM],'結果待ちに移しました');
}
function doPass(co){
  opt(function(){
    var it=find_(co);if(!it)return;
    var r=routeOf(it),i=r.indexOf(it.stage);
    if(i<0||i>=r.length-2){it.status='内定';it.on=todayStr();}
    else{it.stage=r[i+1];it.status='対応中';it.due=null;it.since=null;}
  },'apiMarkPass',[co,TERM],'通過を記録しました');
}
function doPrevStage(co){
  var it=find_(co); if(!it)return;
  var r=routeOf(it), cur=it.lost||it.stage, i=r.indexOf(cur);
  if(i<=0){ toast('これ以上前の選考段階はありません'); return; }
  var prev=r[i-1];
  opt(function(){
    var x=find_(co); if(!x)return;
    x.stage=prev; x.status='対応中';
    x.lost=''; x.on=null; x.due=null; x.since=null;
  },'apiPrevStage',[co,TERM,prev], prev+' に戻しました');
}
function doFail(co){
  opt(function(){var it=find_(co);if(!it)return;it.lost=it.stage;it.status='落選';it.on=todayStr();it.due=null;},
      'apiMarkFail',[co,TERM],'選考終了として記録しました');
}
function doStatus(co,st){
  opt(function(){
    var it=find_(co);if(!it)return;
    it.status=st;
    if(st==='結果待ち'&&!it.since)it.since=todayStr();
    if(st==='対応中'){it.lost='';it.on=null;}
  },'apiSetStatus',[co,TERM,st],st+'にしました');
}
function setDue(co){
  var el=document.getElementById('coDue');
  var v=el?el.value:'';
  if(v&&!D(v)){toast('日時の形式が正しくありません');return}
  call('apiSetDue',[co,TERM,v],function(){toast(v?'締切を更新しました':'締切を未定にしました',true)});
}

/* ============ 状態 ============ */
function stOf(it){
  var s=it.status||'';
  if(s==='見送り') return 'skip';
  if(s==='落選') return 'fail';
  /* インターンの区分に「内定」は無いので、参加決定として扱う */
  if(s==='内定') return (TERM==='夏インターン') ? 'fixed' : 'offer';
  if(s==='参加決定') return 'fixed';
  if(s==='結果待ち') return 'waiting';
  if(s==='対応中'&&it.due&&!rem(it.due)) return 'waiting';
  return 'todo';
}
function autoSent(it){return it.status==='対応中'&&it.due&&!rem(it.due)}

/* ============ 一覧描画 ============ */
function dayCell(n,color,unit){
  if(n==='TODAY') return '<b style="font-size:21px;color:'+color+'">TODAY</b>';
  return '<b style="color:'+color+'">'+n+'</b><s>'+(unit||'DAYS')+'</s>';
}
function rowHtml(it){
  var st=stOf(it), r=it.due?rem(it.due):null, left='', right='', sub='';
  if(st==='waiting'){
    var d=since(it.since||(it.due?it.due.slice(0,10):null));
    left='<b style="font-size:32px;color:'+(d>=14?'var(--hot)':'var(--wait)')+'">'+(d==null?'—':d)+'</b><s>DAYS 経過</s>';
    right=it.since?fdate(it.since)+' 提出':'';
    if(autoSent(it)) sub='<div class="sub" style="color:var(--wait)">締切経過で自動送り</div>';
  } else if(st==='fixed'){
    var ev=nextEv(it.c), rr=ev?rem(ev.at):null;
    left=rr?dayCell(rr.d===0?'TODAY':rr.d,'var(--go)'):'<span class="tag" style="color:var(--go)">参加<br>決定</span>';
    right=ev?fdate(ev.at)+' 実施':(it.on?fdate(it.on)+' 確定':'');
  } else if(st==='offer'){
    left='<span class="tag" style="color:var(--go)">内定</span>';
    right=it.on?fdate(it.on):'';
  } else if(st==='fail'){
    left='<span class="tag" style="color:var(--dim)">終了</span>';
    right=it.on?fdate(it.on):'';
  } else if(st==='skip'){
    left='<span class="tag" style="color:var(--dim)">見送り</span>';
  } else if(r){
    left=dayCell(r.d===0?'TODAY':r.d, r.d<=2?'var(--hot)':'var(--text)');
    right=fdate(it.due);
    if(!it.timeUnset) sub='<div class="sub">締切 '+ftime(it.due)+'</div>';
  } else {
    left='<span class="tag" style="color:var(--dim)">未定</span>';
  }

  var stop='event.stopPropagation();';
  var acts='';
  if(st==='todo') acts='<div class="acts"><button class="gh" data-act="done" data-co="'+esc(it.c)+'">完了にする</button></div>';
  if(st==='waiting'){
    var rt=routeOf(it), last=rt.indexOf(it.stage)>=rt.length-2;
    var goalLab = last ? (TERM==='夏インターン'?'参加決定':'内定') : '通過';
    acts='<div class="acts">'+
      '<button class="gh" style="border-color:rgba(48,209,88,.5);color:var(--go)" data-act="pass" data-co="'+esc(it.c)+'">'+goalLab+'</button>'+
      '<button class="gh" data-act="fail" data-co="'+esc(it.c)+'">落選</button></div>';
  }
  var isMuted = (st==='fail'||st==='skip');
  return '<div class="row'+(st==='fixed'?' is-fixed':st==='offer'?' is-offer':'')+(isMuted?' is-muted':'')+
    '" data-act="open" data-co="'+esc(it.c)+'">'+
    '<div class="main">'+
      '<div class="day">'+left+'</div>'+
      '<div class="body1"><div class="meta">'+logo(it)+
        '<em>'+esc(it.lost||it.stage)+'</em>'+
        (isCo(it)?'':'<em style="color:var(--dim);font-size:10px">管理用</em>')+
        '<i>'+right+'</i></div>'+
        '<div class="name">'+esc(it.c)+'</div>'+sub+
      '</div></div>'+acts+'</div>';
}
function eventRowHtml(ev){
  var it=byCo(ev.c)||{c:ev.c,dom:''}, r=rem(ev.at);
  return '<div class="row" data-act="open" data-co="'+esc(ev.c)+'"><div class="main">'+
    '<div class="day">'+(r?dayCell(r.d===0?'TODAY':r.d, r.d<=2?'var(--hot)':'var(--text)'):'<span class="tag" style="color:var(--dim)">終了</span>')+'</div>'+
    '<div class="body1"><div class="meta">'+logo(it)+
      '<em style="color:var(--text)">'+esc(ev.kind)+'</em><i>'+fdate(ev.at)+' '+ftime(ev.at)+'</i></div>'+
      '<div class="name">'+esc(ev.c)+'</div>'+

function replayFilterMotion(){
  var box=document.querySelector('.lanes');
  if(!box)return;
  /* 画面切り替え用の指定が残っていると、どちらが効くか毎回変わる */
  var view=document.getElementById('view');
  if(view) view.classList.remove('enter');
  clearTimeout(window._entT);

  box.classList.remove('filt-in');
  var vis=box.querySelectorAll('.lane:not(.is-filt-hidden) .row');
  for(var i=0;i<vis.length;i++){
    vis[i].style.animation='none';          /* 走りかけを一度止める */
    vis[i].style.setProperty('--fi', i<12?i:12);
  }
  void box.offsetWidth;                     /* ここで確実に初期状態へ戻す */
  for(var k=0;k<vis.length;k++) vis[k].style.animation='';
  box.classList.add('filt-in');
  clearTimeout(window._filtT);
  window._filtT=setTimeout(function(){ box.classList.remove('filt-in') },900);
}
function setFilt(k){
  FILT = (FILT===k && k!=='all') ? 'all' : k;
  saveUiState();
  if(FILT==='end' && !window._end){ window._end=true; render(false); replayFilterMotion(); return; }
  if(FILT==='skip' && !window._skip){ window._skip=true; render(false); replayFilterMotion(); return; }

  var btns = document.querySelectorAll('.chiprow button');
  Array.prototype.forEach.call(btns,function(b){
    b.className = (b.getAttribute('data-filt')===FILT) ? 'on' : '';
  });
  var lanesBox = document.querySelector('.lanes');
  if(!lanesBox) return;
  lanesBox.classList.toggle('single', FILT!=='all');
  var lanes = lanesBox.querySelectorAll('.lane');
  Array.prototype.forEach.call(lanes,function(l){
    var lk = l.getAttribute('data-lane');
    if(!lk) return;
    if(FILT==='all') l.classList.remove('is-filt-hidden');
    else l.classList.toggle('is-filt-hidden', lk!==FILT);

/* ============ シート制御 ============ */
var lockY=0, pushed=false, locked=false;
/* スワイプで既に飛ばし終えたかどうか。閉じる処理を二重に走らせないため */
var DISMISSING=false;
function lockScroll(on){
  var de=document.documentElement;
  if(on){
    lockY=window.scrollY;
    de.style.overflow='hidden';
    document.body.style.overflow='hidden';
  }else{
    de.style.overflow='';
    document.body.style.overflow='';
    window.scrollTo(0,lockY);
  }
}
function sheetOpened(){
  if(isWide()){bindSheetGesture();return}
  if(!locked){ locked=true; lockScroll(true); }
  document.body.style.setProperty('--bgs','.93');
  document.body.classList.add('sheet-open');
  if(!pushed){ pushed=true; history.pushState({sheet:1},''); }
  bindSheetGesture();
}
function closeOverlay(){
  var box=document.getElementById('sheet');
  var sh=box.querySelector('.sheet');
  if(!isWide()) openCo=null;
  document.body.classList.remove('sheet-open');
  document.body.style.removeProperty('--bgs');

  /* スワイプで既に画面外へ飛んでいる場合、ここで再度アニメーションを掛けると
     消えたはずのカードがもう一度描かれ、残像として見える */
  if(DISMISSING){
    DISMISSING=false;
    box.innerHTML='';
    if(locked){locked=false;lockScroll(false)}
    return;
  }
  if(!sh){ if(locked){locked=false;lockScroll(false)} return }
  var c=sh.querySelector('.card');
  if(c) c.classList.add('noblur');        /* 閉じる動きの間も外す */
  sh.classList.remove('is-active');
  sh.classList.add('out');
  setTimeout(function(){
    box.innerHTML='';
    if(locked){locked=false;lockScroll(false)}
  },300);
}
function closeSide(){ openCo=null; sideEmpty(); }
function closeDetail(){ if(isWide()) closeSide(); else closeSheet(); }
function closeSheet(e){
  if(e&&e.target!==e.currentTarget)return;
  var box=document.getElementById('sheet');
  if(box.innerHTML){
    if(!isWide()&&pushed){ history.back(); return }
    closeOverlay();
    return;
  }
  if(isWide()) closeSide();
}
window.addEventListener('popstate',function(){
  pushed=false;
  if(document.getElementById('sheet').innerHTML) closeOverlay();
});

function bindSheetGesture(){
  var card=document.querySelector('#sheet .card');
  if(!card||card._bound)return;
  card._bound=true;
  var sheet=card.parentNode;
  var y0=0,x0=0,t0=0,dy=0,active=false,tracking=false,raf=0;

  function getScrollTop(){
    var pane=card.querySelector('.tab-pane');
    return pane ? pane.scrollTop : card.scrollTop;
  }
  function applyTransform(){
    raf=0;
    if(!active)return;
    var d=Math.max(0,dy);
    var sc=Math.max(.9,1-d/2400);
    card.style.transform='translate3d(0,'+d+'px,0) scale('+sc+')';
    /* 背後の画面が指に合わせて手前へ戻る */
    document.body.style.setProperty('--bgs',(0.93+Math.min(1,d/320)*0.07).toFixed(3));
  }

  card.addEventListener('touchstart',function(e){
    if(e.touches.length!==1)return;
    y0=e.touches[0].clientY; x0=e.touches[0].clientX;
    t0=Date.now(); dy=0; active=false; tracking=true;
    card.classList.remove('spring','fly');
  },{passive:true});

  card.addEventListener('touchmove',function(e){
    if(!tracking||e.touches.length!==1)return;
    if(active&&!card.classList.contains('noblur')) card.classList.add('noblur');
    var cy=e.touches[0].clientY, cx=e.touches[0].clientX;
    var vdy=cy-y0, vdx=cx-x0;
    var st=getScrollTop();
    if(!active){
      if(Math.abs(vdx)>Math.abs(vdy)){ tracking=false; return }
      if(st>0){ y0=cy; t0=Date.now(); return }
      if(vdy>6){ active=true; card.classList.add('drag'); }
      else return;
    }
    dy=vdy;
    if(!raf) raf=requestAnimationFrame(applyTransform);
    if(e.cancelable) e.preventDefault();
  },{passive:false});

  function end(){
    if(!tracking)return;
    tracking=false;
    if(raf){ cancelAnimationFrame(raf); raf=0 }
    if(!active)return;
    active=false;
    var dt=Math.max(1,Date.now()-t0), v=dy/dt;
    if(dy>96 || v>0.5) dismiss(); else bounce();
  }
  card.addEventListener('touchend', end);
  card.addEventListener('touchcancel', end);

  function bounce(){
    card.classList.remove('drag');
    card.classList.add('spring');
    card.style.transform='';
    document.body.style.setProperty('--bgs','.93');   /* 背景も奥へ戻す */
    setTimeout(function(){ card.classList.remove('noblur') },600);
  }
  function dismiss(){
    card.classList.remove('drag');
    card.classList.add('fly','noblur');
    /* 指の位置から続けて飛ばす。ここで一度止めると跳ねて見える */
    card.style.transform='translate3d(0,'+Math.max(window.innerHeight, dy+400)+'px,0) scale(.96)';
    card.style.opacity='0';
    sheet.classList.remove('is-active');
    sheet.classList.add('out');
    document.body.classList.remove('sheet-open');
    document.body.style.removeProperty('--bgs');
    DISMISSING=true;                 /* 後片付けでアニメーションを重ねない */
    setTimeout(function(){
      if(!isWide()&&pushed){ history.back(); }
      else closeOverlay();
    },240);
  }
}

function railHtml(it){
  var rt=routeOf(it), cur=it.lost||it.stage, idx=rt.indexOf(cur), dead=stOf(it)==='fail';
  var h='<div class="rail">';
  rt.forEach(function(s,i){
    var passed=idx>=0&&i<idx, here=idx===i;
    var col=dead?'var(--dim)':here?'var(--text)':passed?'var(--muted)':'var(--line)';
    var sz=here?8:5;
    h+='<div style="display:flex;align-items:center;'+(i===rt.length-1?'flex:0 0 auto':'flex:1')+'">'+
      '<i style="width:'+sz+'px;height:'+sz+'px;background:'+col+
      (here&&!dead?';box-shadow:0 0 0 4px rgba(255,255,255,.15)':'')+'"></i>'+
      (i<rt.length-1?'<u style="background:'+((passed&&!dead)?'var(--muted)':'var(--line)')+'"></u>':'')+'</div>';
  });
  h+='</div><div class="railtxt">';
  rt.forEach(function(s){h+='<span style="'+(s===cur?'color:var(--text)':'')+'">'+esc(s)+'</span>'});
  return h+'</div>';
}
function gcalUrl(title,at,details,allDay){
  var d=D(at); if(!d)return '#';
  var p=function(v){return ('0'+v).slice(-2)};
  var day=function(x){return x.getFullYear()+p(x.getMonth()+1)+p(x.getDate())};
  var dates;
  if(allDay) dates=day(d)+'/'+day(new Date(d.getTime()+86400000));
  else{
    var f=function(x){return day(x)+'T'+p(x.getHours())+p(x.getMinutes())+'00'};
    dates=f(d)+'/'+f(new Date(d.getTime()+3600000));
  }
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+
    '&dates='+dates+'&ctz=Asia/Tokyo&details='+encodeURIComponent(details||'');
}

      } else {

      h+='<div style="display:flex;gap:8px;margin-top:10px">'+
        '<input class="f" type="datetime-local" id="coDue" style="flex:1;margin:0" value="'+esc(it.due||'')+'">'+
        '<button class="gh" style="padding:0 14px;color:var(--text)" data-act="setdue" data-co="'+esc(it.c)+'">保存</button></div></div>';

    if(st==='waiting'){
      var d=since(it.since||(it.due?it.due.slice(0,10):null));
      h+='<div style="margin-top:18px;padding-bottom:18px;border-bottom:1px solid var(--line-soft)">'+
        '<div class="lab" style="margin:0 0 8px">結果待ち</div>'+

function paintDetail(it){
  var st=stOf(it), col=st==='waiting'?'var(--wait)':(st==='offer'||st==='fixed')?'var(--go)':'var(--muted)';
  var LAB={todo:'対応中',waiting:'結果待ち',offer:'内定',fail:'選考終了',fixed:'参加決定',skip:'見送り'};

  var headHtml='<div class="grab"></div>'+
    '<button class="sideclose" onclick="event.stopPropagation();closeDetail()" aria-label="閉じる">✕</button>'+
    '<div style="display:flex;align-items:center;gap:12px">'+logo(it,44)+
    '<div><div style="font-size:19px;font-weight:700;letter-spacing:-.01em">'+esc(it.c)+'</div>'+
    '<div style="font-family:var(--mono);font-size:11px;color:'+col+';margin-top:3px">'+
      esc(it.lost||it.stage)+' '+LAB[st]+'</div></div></div>'+
    '<div class="tabs">'+
      ['info,概要','events,予定 '+evOf(it.c).length,'route,選考ルート'].map(function(x){
        var k=x.split(',')[0];
        return '<button data-tab="'+k+'" class="'+(tab===k?'on':'')+'" onclick="switchTab(\''+k+'\')">'+x.split(',')[1]+'</button>';
      }).join('')+'</div>';

  var fullHtml='<div class="card-head">'+headHtml+'</div><div class="tab-pane">'+renderTabContent(it)+'</div>';

  if(isWide()){
    var side=document.getElementById('side');
    var sc=side.querySelector('.card');
    if(sc && side.dataset.co===openCo){
      var sy=side.scrollTop;
      sc.innerHTML=fullHtml;
      side.scrollTop=sy;
      return;
    }
    side.dataset.co=openCo;
    side.innerHTML='<div class="card">'+fullHtml+'</div>';
    return;
  }

  var box=document.getElementById('sheet');
  var card=box.querySelector('.sheet .card');
  if(card){ card.innerHTML=fullHtml; return; }
  box.innerHTML='<div class="sheet" onclick="closeSheet(event)"><div class="card noblur">'+fullHtml+'</div></div>';

    var sh=box.querySelector('.sheet');
    if(sh) sh.classList.add('is-active');
  });

  setTimeout(function(){
    var c=box.querySelector('.card');
    if(c) c.classList.remove('noblur');
  },620);
  sheetOpened();

/* ルート編集 */
function saveRoute(arr,stage){call('apiSetRoute',[openCo,TERM,arr,stage||''])}
function mv(i,d){var it=byCo(openCo);if(!it)return;var r=routeOf(it).slice(),j=i+d;
  if(j<0||j>=r.length)return; var t=r[i];r[i]=r[j];r[j]=t; saveRoute(r)}
function rm(i){
  var it=byCo(openCo); if(!it)return;
  var r=routeOf(it).slice();
  if(r.length<=2){ toast('段階は2つ以上必要です'); return; }
  var cur=it.lost||it.stage;
  if(r[i]===cur){ toast('現在の段階は削除できません'); return; }
  r.splice(i,1); saveRoute(r);
}
function setCur(i){var it=byCo(openCo);if(!it)return;var r=routeOf(it); saveRoute(r.slice(),r[i])}
function addStage(){
  var it=byCo(openCo); if(!it)return;
  var v=document.getElementById('addStage').value;
  var r=routeOf(it).slice();
  if(r.indexOf(v)>=0){ toast('すでにその段階があります'); return; }
  r.push(v); saveRoute(r);
}
function addCustomStage(){
  var it=byCo(openCo); if(!it)return;
  var el=document.getElementById('newStage');
  var v=el?el.value.trim():'';
  if(!v){ toast('段階の名前を入れてください'); return; }
  if(v.indexOf('>')>=0){ toast('「>」は使えません'); return; }
  var r=routeOf(it).slice();
  if(r.indexOf(v)>=0){ toast('すでにその段階があります'); return; }
  rememberStage(v);
  r.push(v);
  if(el) el.value='';
  saveRoute(r);
  toast(v+' を追加しました',true);
}

/* ============ リキッドグラス操作 ============ */

function attachLiquid(host, ids, onPick, isActive){
  if(!host || host._liquid) return;
  host._liquid = true;
  var pill = host.querySelector('.pill');
  if(!pill) return;

  var press=0, lifted=false, startX=0, lastX=0, lastT=0, vx=0;
  var startVisualX=0, originLeft=0, rafId=0, moved=false;
  /* つまんだ時点の寸法を覚えておく。毎フレーム測り直すと、
     変形の書き込みと測定が交互に起きてレイアウト計算が強制され、動きががたつく */
  var geo=null;

  function btns(){
    return ids.map(function(id){return document.getElementById(id)})
              .filter(function(b){return !!b});
  }
  function activeIndex(){
    var L=btns();
    for(var i=0;i<L.length;i++) if(isActive(i)) return i;
    return 0;
  }
  /* ピルの「変形前の位置」を基準に、各ボタンまでの移動量を出す。
     これを使わないと、右側のタブからつまんだときに位置が飛ぶ */
  function targets(){
    originLeft = pill.offsetLeft || 4;
    return btns().map(function(b){ return b.offsetLeft - originLeft });
  }

  function lift(){
    lifted=true;
    host.classList.add('lifted','grabbing');
    var t=targets(), i=activeIndex();
    startVisualX = (t[i]!==undefined) ? t[i] : 0;
    /* ここで一度だけ測る */
    var pr=pill.getBoundingClientRect(), hr=host.getBoundingClientRect();
    geo={ t:t, min:t[0], max:t[t.length-1],
          pw:pr.width||1, pl:pr.left, hw:hr.width||1, hl:hr.left };
    if(navigator.vibrate) try{ navigator.vibrate(11) }catch(e){}
  }
  function renderMove(){
    rafId=0;
    if(!lifted||!geo)return;
    var x=Math.max(geo.min, Math.min(geo.max, startVisualX + (lastX-startX)));
    var st=Math.max(-.16, Math.min(.16, vx*0.06));
    var sx=1+Math.abs(st), sy=1-Math.abs(st)*0.55;
    /* 書き込みだけを行う。読み取りを混ぜない */
    pill.style.transform='translate3d('+x+'px,0,0) scaleX('+sx.toFixed(3)+') scaleY('+sy.toFixed(3)+')';
  }
  /* 指の真下にあるボタンを探す。つまんだまま動かさずに離したときに使う */
  function indexUnder(x){
    var L=btns();
    for(var i=0;i<L.length;i++){
      var r=L[i].getBoundingClientRect();
      if(x>=r.left && x<=r.right) return i;
    }
    return -1;
  }
  function drop(){
    clearTimeout(press);
    if(rafId){ cancelAnimationFrame(rafId); rafId=0 }
    host.classList.remove('lifted','grabbing');
    if(!lifted)return;
    lifted=false;

    var best;
    if(!moved){
      /* 動かさずに離した場合は、押している場所のボタンを選ぶ */
      best = indexUnder(lastX);
      if(best<0) best = activeIndex();
    }else{
      var t=(geo?geo.t:targets()), x=startVisualX+(lastX-startX);
      best=0; var bd=1e9;
      t.forEach(function(tx,i){ var d=Math.abs(tx-x); if(d<bd){bd=d;best=i} });
    }

    geo=null;
    host.classList.add('settling');
    pill.style.transform='';
    setTimeout(function(){ host.classList.remove('settling') },600);
    if(!isActive(best)) onPick(best);
    if(moved){                       /* 直後に発生する click を1回だけ無視する */
      host._swallow=true;
      setTimeout(function(){ host._swallow=false },350);
    }
  }

  host.addEventListener('contextmenu',function(e){e.preventDefault()});
  host.addEventListener('selectstart',function(e){e.preventDefault()});
  /* ドラッグで選び直した直後の click だけ握り潰す。
     setPointerCapture を使うと click の宛先が容器に化けてボタンが押せなくなるため使わない */
  host.addEventListener('click',function(e){
    if(host._swallow){ e.preventDefault(); e.stopPropagation(); host._swallow=false; }
  },true);
  host.addEventListener('pointerdown',function(e){
    if(e.pointerType==='mouse'&&e.button!==0)return;
    startX=lastX=e.clientX; lastT=Date.now(); vx=0; moved=false;
    clearTimeout(press);
    press=setTimeout(lift,150);   /* つまめるまでの待ちを短く */
  });
  host.addEventListener('pointermove',function(e){
    var t=Date.now(), dt=Math.max(1,t-lastT);
    /* 生の速度は1フレームごとに大きく振れる。均して伸縮の震えを抑える */
    var raw=(e.clientX-lastX)/dt*10;
    vx = vx*0.65 + raw*0.35;
    lastX=e.clientX; lastT=t;
    if(!lifted){
      if(Math.abs(e.clientX-startX)>9) clearTimeout(press);
      return;
    }
    if(Math.abs(e.clientX-startX)>8) moved=true;
    e.preventDefault();
    if(!rafId) rafId=requestAnimationFrame(renderMove);
  });
  host.addEventListener('pointerup',drop);
  host.addEventListener('pointercancel',drop);
  host.addEventListener('pointerleave',function(){ if(lifted) drop(); else clearTimeout(press); });
}

function initLiquid(){
  attachLiquid(document.getElementById('tabbar'), ['tb-list','tb-pass'],
    function(i){ setPage(i===0?'list':'pass') },
    function(i){ return (i===0) === (PAGE==='list') });
  attachLiquid(document.getElementById('seg'), ['sg0','sg1'],
    function(i){ setTerm(TERMS[i]) },
    function(i){ return TERM===TERMS[i] });
}

/* ============ 記録 ============ */
function tally(){
  var t={};
  var bump=function(s,k){if(!t[s])t[s]={p:0,f:0,w:0};t[s][k]++};
  ITEMS().forEach(function(it){
    if(!isCo(it))return;
    var r=routeOf(it),cur=it.lost||it.stage,i=r.indexOf(cur),st=stOf(it);
    if(st==='skip')return;
    if(i<0){bump(cur, st==='fail'?'f':(st==='offer'||st==='fixed')?'p':'w');return}
    for(var k=0;k<i;k++)bump(r[k],'p');
    if(st==='fail')bump(cur,'f');
    else if(st==='offer'||st==='fixed')bump(cur,'p');
    else bump(cur,'w');
  });
  return t;
}
function renderPassport(pageChanged){
  var t=tally();
  var order=DEFAULT_ROUTE.concat(PALETTE.filter(function(p){return DEFAULT_ROUTE.indexOf(p)<0}));
  var rows=order.filter(function(s){return t[s]});
  var max=1; rows.forEach(function(s){max=Math.max(max,t[s].p+t[s].f+t[s].w)});

  var LIST=ITEMS().filter(isCo);
  var live=LIST.filter(function(i){return ['todo','waiting','fixed','offer'].indexOf(stOf(i))>=0});
  var fails=LIST.filter(function(i){return stOf(i)==='fail'});
  var entered=LIST.filter(function(i){return stOf(i)!=='skip'});
  var skipped=LIST.filter(function(i){return stOf(i)==='skip'});
  var passes=0; rows.forEach(function(s){passes+=t[s].p});

  var worst=null;
  rows.forEach(function(s){ if(!worst||t[s].f>t[worst].f) worst=s });

  var waits=LIST.filter(function(i){return stOf(i)==='waiting'})
    .map(function(i){return {c:i.c, d:since(i.since||(i.due?i.due.slice(0,10):null))||0}})
    .sort(function(a,b){return b.d-a.d});
  var avg=waits.length?Math.round(waits.reduce(function(a,b){return a+b.d},0)/waits.length):0;

  var deepest='—';
  LIST.forEach(function(it){
    var r=routeOf(it), i=r.indexOf(it.lost||it.stage);
    if(i<0)return;
    if(order.indexOf(r[i])>order.indexOf(deepest)) deepest=r[i];
  });

  var cA=[], cB=[];
  cA.push('<div class="pcard po1" style="background:linear-gradient(155deg,rgba(88,74,220,.5) 0%,rgba(48,102,214,.5) 55%,rgba(46,142,224,.5) 100%);color:#EEF3FF">'+
    '<div class="ttl">'+TERM+' パスポート</div>'+
    '<div class="pgrid">'+
      '<div><b>'+entered.length+'</b><span>エントリー社数</span></div>'+
      '<div><b>'+passes+'</b><span>通過した選考</span></div></div>'+
    '<div class="pmini">'+
      '<span>進行中 <b>'+live.length+'</b></span>'+
      '<span>終了 <b>'+fails.length+'</b></span>'+
      '<span>見送り <b>'+skipped.length+'</b></span></div>'+
    '<div class="pfoot">最も進んだ段階 '+esc(deepest)+'</div></div>');

  if(worst && t[worst].f>0 && fails.length>0){
    cA.push('<div class="pcard po2" style="background:linear-gradient(155deg,rgba(226,66,86,.46) 0%,rgba(150,32,48,.5) 100%);color:#FFEEF0">'+
      '<div style="display:flex;align-items:baseline;gap:12px">'+
        '<div class="num">'+t[worst].f+'</div>'+
        '<div style="font-size:15px;font-weight:600">社が'+esc(worst)+'で終了</div></div>'+
      '<div class="pfoot">終了'+fails.length+'社のうち'+
        Math.round(t[worst].f/fails.length*100)+'％がこの段階です</div></div>');
  }

  var rate='<div class="pcard po3 flat"><div class="ttl">段階別の通過率</div><div style="margin-top:14px">';
  rows.forEach(function(sname){
    var o=t[sname],att=o.p+o.f,pc=att?Math.round(o.p/att*100):null;
    rate+='<div class="rateRow"><div class="rateHead">'+
      '<span>'+esc(sname)+'</span>'+
      '<span class="rateNum" style="color:'+(pc===null?'var(--dim)':pc>=50?'var(--go)':'var(--hot)')+'">'+
      (pc===null?'—':pc+'%')+'<i>'+o.p+'/'+att+'</i></span></div>'+
      '<div class="bar" style="width:'+Math.max(18,(o.p+o.f+o.w)/max*100)+'%">'+
      (o.p?'<div style="flex:'+o.p+';background:var(--go)"></div>':'')+
      (o.f?'<div style="flex:'+o.f+';background:var(--fail)"></div>':'')+
      (o.w?'<div style="flex:'+o.w+';background:var(--line)"></div>':'')+'</div></div>';
  });
  rate+='</div><div class="legend">'+
    '<span><i style="background:var(--go)"></i>通過</span>'+
    '<span><i style="background:var(--fail)"></i>終了</span>'+
    '<span><i style="background:var(--line)"></i>進行中</span></div></div>';
  cB.push(rate);

  if(waits.length){
    cB.push('<div class="pcard po4" style="background:linear-gradient(155deg,rgba(52,116,190,.44) 0%,rgba(28,62,108,.5) 100%);color:#E4EFFF">'+
      '<div class="ttl">結果待ち</div>'+
      '<div class="pgrid">'+
        '<div><b>'+waits.length+'</b><span>社</span></div>'+
        '<div><b>'+avg+'</b><span>平均経過日数</span></div>'+
        '<div><b>'+waits[0].d+'</b><span>最長</span></div></div>'+
      '<div class="pfoot">最も長いのは'+esc(waits[0].c)+'</div></div>');
  }

  var brk='<div class="pcard po5 flat"><div class="ttl">進行中の内訳</div><div style="margin-top:10px">';
  var brkKeys = (TERM==='夏インターン') ? ['todo','waiting','fixed'] : ['todo','waiting','fixed','offer'];
  brkKeys.forEach(function(k){
    var n=LIST.filter(function(i){return stOf(i)===k}).length;
    var lab={todo:'対応中',waiting:'結果待ち',fixed:'参加決定',offer:'内定'}[k];
    var c2={todo:'var(--blue)',waiting:'var(--wait)',fixed:'var(--go)',offer:'var(--go)'}[k];
    brk+='<div class="brkRow"><span>'+lab+'</span>'+
      '<span style="font-family:var(--disp);font-size:21px;font-weight:600;color:'+
      (n?c2:'var(--dim)')+'">'+n+'</span></div>';
  });
  brk+='</div></div>';
  cA.push(brk);

  var h='<div class="ptitle">'+TERM+' 記録</div>'+
    '<div class="pwrap"><div class="pcol">'+cA.join('')+'</div>'+
    '<div class="pcol">'+cB.join('')+'</div></div>';

  document.getElementById('view').innerHTML=h;
  var pc=document.querySelectorAll('#view .pcard');
  for(var q=0;q<pc.length;q++) pc[q].style.setProperty('--ei', q);
  if(pageChanged) markEnter(true);
  requestAnimationFrame(syncPills);
  if(isWide()&&!openCo)sideEmpty();
}

/* ============ 接続設定 ============ */
function openSetup(msg){
  hideSplash();
  if(locked){ locked=false; lockScroll(false); }
  pushed=false; openCo=null;
  document.body.classList.remove('sheet-open');
  document.getElementById('sheet').innerHTML='';
  var dock=document.getElementById('tabbar');
  if(dock)dock.style.display='none';
  var side=document.getElementById('side');
  if(side)side.innerHTML='';
  document.getElementById('app').innerHTML=
    '<div class="setup">'+
    '<div class="setupBox">'+
    '<div class="setupMark">就活</div>'+
    '<div class="setupLead">Apps Script のウェブアプリURLと鍵を入れてください。<br>'+
    'この端末にだけ保存され、ページのソースには残りません。</div>'+
    (msg?'<div class="setupErr">'+esc(msg)+'</div>':'')+
    '<div class="lab">ウェブアプリURL</div>'+
    '<input class="f" id="cfgEp" placeholder="https://script.google.com/macros/s/.../exec" value="'+esc(CFG.ep)+'">'+
    '<div class="lab">鍵</div>'+
    '<input class="f" id="cfgKey" type="password" placeholder="WebAppApi.gs の WA_KEY" value="'+esc(CFG.key)+'">'+
    '<button class="big" style="background:#fff;color:#000" onclick="doSetup()">接続する</button>'+
    '</div></div>';
  var k=document.getElementById('cfgKey');
  if(k)k.addEventListener('keydown',function(e){if(e.key==='Enter')doSetup()});
}
function doSetup(){
  var ep=document.getElementById('cfgEp').value.trim();
  var key=document.getElementById('cfgKey').value.trim();
  if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(ep)){
    openSetup('URLは https://script.google.com/macros/s/.../exec の形式です'); return;
  }
  if(!key){ openSetup('鍵を入れてください'); return; }
  saveCfg(ep,key);
  document.getElementById('app').innerHTML=
    '<div class="setup"><div class="setupBox"><div class="setupMark">就活</div>'+
    '<div class="setupLead">接続しています…</div></div></div>';
  api('apiGetData',[]).then(function(j){
    if(!j||!j.items){ openSetup('応答の形式が違います。WebAppApi.gs のデプロイを確認してください'); return; }
    var dock=document.getElementById('tabbar');
    if(dock)dock.style.display='';
    applyData(j);
  }).catch(function(e){
    openSetup(e&&e.message?e.message:'接続できませんでした');
  });
}
function resetCfg(){
  if(!confirm('接続設定を消してやり直しますか。'))return;
  try{localStorage.removeItem('sk_ep');localStorage.removeItem('sk_key');
      localStorage.removeItem('sk_cache');localStorage.removeItem('sk_ui_state');}catch(e){}
  CFG={ep:'',key:''};
  openSetup();
}

/* ============ ソフトキーボード対応 ============ */
/* 入力欄に触れると画面下が持ち上がる。ドックは邪魔なので隠し、
   シートの下端はキーボードの高さぶん空ける */
(function(){
  var vv=window.visualViewport;
  if(!vv)return;
  function apply(){
    var gap=Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    document.documentElement.style.setProperty('--kb', gap+'px');
    document.body.classList.toggle('kb-open', gap>120);
  }
  vv.addEventListener('resize',apply);
  vv.addEventListener('scroll',apply);
  apply();
})();

/* ============ 引っ張って更新 ============ */
(function(){
  var y0=0, x0=0, pulling=false, dist=0, locked=false, lastScroll=0;
  var el=function(){return document.getElementById('ptr')};
  /* 直前までスクロールしていた（慣性が残っている）間は反応させない */
  window.addEventListener('scroll',function(){ lastScroll=Date.now() },{passive:true});
  function set(d){
    var p=el(); if(!p)return;
    var t=Math.min(1,d/90);
    p.style.opacity=t.toFixed(2);
    p.style.transform='translate3d(-50%,'+Math.min(56,d*0.6)+'px,0) scale('+(0.7+t*0.3).toFixed(2)+')';
    p.querySelector('.ptrRing').style.transform='rotate('+(d*3)+'deg)';
  }
  function reset(){
    var p=el(); if(!p)return;
    p.classList.remove('spin');
    p.style.transition='opacity .3s var(--ease),transform .5s var(--spring)';
    p.style.opacity='0';
    p.style.transform='translate3d(-50%,-40px,0) scale(.7)';
    setTimeout(function(){ if(p) p.style.transition='' },520);
  }
  document.addEventListener('touchstart',function(e){
    pulling=false; locked=false;
    if(document.getElementById('sheet').innerHTML)return;
    if(window.scrollY>0)return;
    if(Date.now()-lastScroll<350)return;          /* 慣性スクロールの直後は無視 */
    if(e.touches.length!==1)return;
    if(e.target.closest&&e.target.closest('.chiprow,.tabbar,.seg,.tab-pane'))return;
    y0=e.touches[0].clientY; x0=e.touches[0].clientX;
    pulling=true; dist=0;
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!pulling)return;
    if(e.touches.length!==1){ pulling=false; reset(); return }
    var dy=e.touches[0].clientY-y0, dx=e.touches[0].clientX-x0;
    if(!locked){
      if(Math.abs(dx)>Math.abs(dy)){ pulling=false; reset(); return }  /* 横スワイプ */
      if(Math.abs(dy)<8) return;
      locked=true;
    }
    dist=dy;
    if(dist<=0){ pulling=false; reset(); return }
    if(window.scrollY>0){ pulling=false; reset(); return }
    set(dist);
  },{passive:true});
  document.addEventListener('touchend',function(){
    if(!pulling)return;
    pulling=false;
    if(dist>110 && locked && CFG.ep){
      var p=el();
      if(p){ p.classList.add('spin'); p.style.opacity='1';
             p.style.transform='translate3d(-50%,40px,0) scale(1)'; }
      api('apiGetData',[]).then(function(j){
        if(j&&j.items){ applyData(j); staleHide(); toast('最新に更新しました',true); }
        reset();
      }).catch(function(){ staleShow('更新できませんでした'); reset(); });
    }else reset();
  });
})();

window.addEventListener('load',function(){ syncPills(); initLiquid();
  setTimeout(syncPills,80); setTimeout(syncPills,300); });
window.addEventListener('resize',function(){ syncPills() });
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){syncPills()});

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}

if(loadCfg()) load(); else openSetup();
