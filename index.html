<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>就活</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="就活">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#020205">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<style>
/* ==========================================================================
   APPLE 7-LAYER SPATIAL DEPTH SYSTEM & GLASS TOKENS
   ========================================================================== */
:root{
  color-scheme: dark;
  --ink:#020205;
  --lightX: 50vw;
  --lightY: 22vh;
  
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);

  /* Layer 1 & 2: Back Ambient Mesh */
  --bg-mesh: 
    radial-gradient(130% 85% at 0% 0%, rgba(10,132,255,0.22) 0%, transparent 60%),
    radial-gradient(110% 75% at 100% 20%, rgba(48,209,88,0.14) 0%, transparent 55%),
    radial-gradient(150% 95% at 50% 90%, rgba(140,50,255,0.18) 0%, transparent 65%);

  /* Adaptive Blur Scale */
  --blur-card: 28px;
  --blur-chrome: 36px;
  --blur-sheet: 44px;
  --glass-saturation: 220%;

  /* Layer 3 & 4: Glass Surface & Highlight Tokens */
  --surface: linear-gradient(180deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.02) 100%), rgba(18,18,26,0.52);
  --hi: linear-gradient(180deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.03) 100%), rgba(22,22,34,0.80);
  --chrome: linear-gradient(180deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.03) 100%), rgba(20,20,32,0.60);
  
  --line: rgba(255,255,255,0.15);
  --line-soft: rgba(255,255,255,0.07);
  --glass-edge: 
    inset 0 1.5px 0.5px 0 rgba(255,255,255,0.65),
    inset 0 -1.5px 1px 0 rgba(0,0,0,0.55),
    inset 1px 0 0.5px 0 rgba(255,255,255,0.20),
    inset -1px 0 0.5px 0 rgba(255,255,255,0.20),
    0 10px 28px -4px rgba(0,0,0,0.48);
  --glass-drop-lg:
    0 24px 64px -10px rgba(0,0,0,0.85),
    inset 0 1.5px 0.5px rgba(255,255,255,0.75),
    inset 0 -1px 1px rgba(0,0,0,0.55);

  --text:#FFFFFF; --muted:#A4A4B4; --dim:#7A7A8B;
  --blue:#0A84FF; --go:#30D158; --wait:#FF9F0A; --hot:#FF453A; --fail:#6E3E4B;

  /* Native Fluid Timing Tokens */
  --apple-spring: cubic-bezier(0.16, 1, 0.3, 1);
  --apple-ease: cubic-bezier(0.25, 0.1, 0.25, 1);
  --apple-press: cubic-bezier(0.2, 0, 0, 1);
  --apple-pop: cubic-bezier(0.34, 1.56, 0.64, 1);
  --apple-bounce: cubic-bezier(0.18, 0.9, 0.32, 1.25);
  
  --disp:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}

html.glass-high {
  --blur-card: 32px;
  --blur-chrome: 44px;
  --blur-sheet: 48px;
  --glass-saturation: 250%;
}
html.glass-lite {
  --blur-card: 16px;
  --blur-chrome: 22px;
  --blur-sheet: 26px;
  --glass-saturation: 180%;
  --glass-edge: inset 0 1px 0 rgba(255,255,255,.35), 0 8px 20px rgba(0,0,0,.35);
  --glass-drop-lg: 0 16px 42px rgba(0,0,0,.65);
}

@media (prefers-contrast: more) {
  :root {
    --surface: rgba(20,20,28,.96);
    --hi: rgba(24,24,34,.98);
    --chrome: rgba(22,22,32,.98);
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
*::-webkit-scrollbar{width:6px;height:6px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:999px}

html{
  background: var(--ink);
  -webkit-text-size-adjust:100%;
  scroll-padding-bottom:120px;
  scrollbar-gutter: stable;
}
body{
  overscroll-behavior-y:none;margin:0;background:transparent;color:var(--text);
  font-family:var(--body);font-variant-numeric:tabular-nums;
  padding:calc(20px + var(--safe-top)) calc(16px + var(--safe-right))
          calc(130px + var(--safe-bottom)) calc(16px + var(--safe-left));
  max-width:480px;margin:0 auto;
  position: relative;
  isolation: isolate;
}
button,select,input,textarea{font-family:var(--body)}
button:disabled { cursor: default; pointer-events: none; }
.tabbar{-webkit-user-select:none;user-select:none}

/* Focus Visible */
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
.row:focus-visible,
.hero:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 3px;
}

/* Background Layers */
#ambientBackplate {
  position: fixed;
  inset: -8vh -8vw;
  pointer-events: none;
  z-index: 0;
  background-image: var(--bg-mesh);
  background-size: cover;
  transform: translate3d(0, var(--ambient-offset, 0px), 0);
  will-change: transform;
}

#globalSpecular {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  background: radial-gradient(circle 420px at var(--lightX) var(--lightY), rgba(255,255,255,0.06), transparent 75%);
  transform: translateZ(0);
}

#globalNoise {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  opacity: .024;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  transform: translateZ(0);
}

html.glass-lite #globalNoise {
  opacity: .012;
}

body::before {
  content: none;
}

#app {
  position: relative;
  z-index: 3;
}

#side {
  position: relative;
  z-index: 3;
}

#sheet {
  position: static;
  z-index: auto;
}

/* GPU Performance & Layer Primitives */
.tabbar, .seg, .sheet .card {
  will-change: transform;
  transform: translateZ(0);
  isolation: isolate;
}
.row, .stripitem, .pcard {
  contain: layout paint;
  content-visibility: auto;
}
html.is-webkit .row {
  content-visibility: visible;
}
.row { contain-intrinsic-size: 0 112px; }
.stripitem { contain-intrinsic-size: 0 52px; }
.pcard { contain-intrinsic-size: 0 220px; }

/* 局所スペキュラライト */
.row, .stripitem, .pcard, .card, .spotbox, .setupBox {
  position: relative;
}
.row::before, .stripitem::before, .pcard::before, .card::before, .spotbox::before, .setupBox::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  z-index: 0;
  background: radial-gradient(240px circle at var(--local-light-x, 50%) var(--local-light-y, 0%), rgba(255,255,255,.14), rgba(255,255,255,.035) 35%, transparent 68%);
  opacity: var(--local-light-opacity, .42);
}
.row > *, .stripitem > *, .pcard > *, .card > *, .spotbox > *, .setupBox > * {
  position: relative;
  z-index: 1;
}

.spotbox input {
  position: relative;
  z-index: 2;
}

.card > .sideclose {
  z-index: 5;
  width: 32px;
  height: 32px;
}
.card > .sideclose::before {
  content: "";
  position: absolute;
  inset: -6px;
}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:200;background:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  transition:opacity .35s var(--apple-ease),visibility .35s}
#splash.gone{opacity:0;visibility:hidden;pointer-events:none}
#splash .mark{font-size:28px;font-weight:700;letter-spacing:.26em;color:var(--text);padding-left:.26em}
#splash .rule{width:54px;height:1px;background:var(--line);position:relative;overflow:hidden}
#splash .rule::after{content:'';position:absolute;inset:0;background:var(--text);
  transform:translateX(-100%);animation:sweep 1.1s infinite}
#splash .sub{font-family:var(--mono);font-size:9px;letter-spacing:.3em;color:var(--dim)}

/* ---------- typography & floating hero ---------- */
.lab{margin:24px 0 8px;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.2em}

@keyframes heroFloat{
  0%{transform:translate3d(0,0,0)}
  50%{transform:translate3d(0,-4px,0)}
  100%{transform:translate3d(0,0,0)}
}
.hero-parallax{
  will-change: transform;
  transform: translate3d(0,0,0);
}
.hero-float{
  animation: heroFloat 8s ease-in-out infinite;
  will-change: transform;
}
html.glass-lite .hero-parallax, html.glass-lite .hero-float {
  will-change: auto;
}
.hero{padding-bottom:20px;border-bottom:1px solid var(--line-soft);margin-bottom:2px;cursor:pointer}
.hero:active{transform:scale(.985);opacity:.85}
.hero h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.02em}
.cd{line-height:1;display:flex;align-items:baseline;margin-top:14px}
.cd b{font-family:var(--disp);font-size:52px;font-weight:600;letter-spacing:-.035em}
.cd s{font-family:var(--mono);font-size:12px;color:var(--muted);margin:0 10px 0 3px;text-decoration:none}

/* ---------- strip & rows ---------- */
.strip{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 4px}
.stripitem{display:inline-flex;align-items:center;gap:10px;width:100%;max-width:380px;
  text-align:left;cursor:pointer;
  background:var(--surface);
  backdrop-filter:blur(var(--blur-card)) saturate(var(--glass-saturation)) brightness(1.1);
  -webkit-backdrop-filter:blur(var(--blur-card)) saturate(var(--glass-saturation)) brightness(1.1);
  border:1px solid rgba(255,255,255,0.16);border-radius:18px;padding:12px 16px;color:var(--text);
  box-shadow:var(--glass-edge);
  transition:transform .35s var(--apple-spring),opacity .2s var(--apple-ease)}
.stripitem:active{transform:scale(.96)}
.stripitem .k{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--muted);
  border:1px solid var(--line);border-radius:6px;padding:3px 7px;flex:0 0 auto;background:rgba(255,255,255,.08)}
.stripitem .n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stripitem .d{margin-left:auto;font-family:var(--disp);font-size:15px;font-weight:600;flex:0 0 auto}
.stripitem .w{font-family:var(--mono);font-size:10px;color:var(--dim);flex:0 0 auto}

.row{
  --card-scale: 1;
  background:var(--surface);
  backdrop-filter:blur(var(--blur-card)) saturate(var(--glass-saturation)) brightness(1.08);
  -webkit-backdrop-filter:blur(var(--blur-card)) saturate(var(--glass-saturation)) brightness(1.08);
  border:1px solid rgba(255,255,255,0.16);border-radius:20px;
  box-shadow:var(--glass-edge);
  margin-bottom:10px;overflow:hidden;cursor:pointer;
  display:flex;flex-direction:column;justify-content:space-between;
  opacity:var(--base-op, 1);
  transform: translate3d(0, var(--card-offset, 0px), 0) scale(var(--card-scale));
  transition: transform .35s var(--apple-spring), opacity .2s var(--apple-ease), box-shadow .3s var(--apple-ease);
}
@media (hover: hover) and (pointer: fine) {
  .row:hover {
    border-color: rgba(255,255,255,.24);
    box-shadow: var(--glass-edge), 0 16px 40px -12px rgba(0,0,0,.65);
  }
}
.row:active{
  --card-scale: 0.96;
}
.row.is-fixed{
  background:linear-gradient(180deg, rgba(48,209,88,0.24) 0%, rgba(14,34,22,0.6) 100%), rgba(20,40,28,0.5);
  border-color:rgba(48,209,88,.4);
  box-shadow:var(--glass-edge), 0 0 24px rgba(48,209,88,.2)}
.row.is-offer{
  background:linear-gradient(180deg, rgba(48,209,88,0.3) 0%, rgba(14,38,24,0.68) 100%), rgba(22,48,30,0.55);
  border-color:rgba(48,209,88,.6);
  box-shadow:var(--glass-edge), 0 0 32px rgba(48,209,88,.28)}
.row.is-muted{--base-op:0.42}

.row .main{padding:14px 15px 12px;display:flex;align-items:center;gap:14px;flex:1 1 auto}
.day{width:60px;flex:0 0 auto;text-align:center}
.day b{font-family:var(--disp);font-size:32px;font-weight:600;letter-spacing:-.035em;line-height:1;display:block}
.day s{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.12em;margin-top:4px;display:block;text-decoration:none}
.day .tag{font-family:var(--mono);font-size:10px;letter-spacing:.1em;line-height:1.5}
.body1{min-width:0;flex:1}
.meta{display:flex;align-items:center;gap:8px}
.meta em{font-family:var(--mono);font-size:12px;color:var(--muted);font-style:normal;letter-spacing:.04em}
.meta i{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim);font-style:normal}
.name{font-size:16px;font-weight:600;letter-spacing:-.01em;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px}
.acts{display:flex;gap:8px;padding:0 15px 12px 74px;flex:0 0 auto}
.gh{
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.18);
  color:var(--muted);border-radius:12px;padding:6px 14px;font-size:12px;cursor:pointer;text-decoration:none;
  display:inline-block;box-shadow:inset 0 1px 0 rgba(255,255,255,.3);
  transition:transform .2s var(--apple-spring),background .16s var(--apple-ease),color .16s var(--apple-ease)}
.gh:active{transform:scale(.91)}
.logo{width:28px;height:28px;border-radius:14px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.4);aspect-ratio:1;}
.logo img{width:78%;height:78%;object-fit:contain;display:block;}
.logo.mono{background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.25)}
.logo.mono span{color:#EDEDF2;font-weight:600}

/* ---------- sheet / card ---------- */
.sheet{
  position:fixed;
  inset:0;
  height:100vh;
  height:100dvh;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(24px) brightness(0.9);
  -webkit-backdrop-filter:blur(24px) brightness(0.9);
  display:flex;
  align-items:flex-end;
  justify-content:center;
  z-index:60;
  padding:0 10px calc(10px + var(--safe-bottom));
  opacity:0;
  pointer-events:none;
  transition:opacity .3s var(--apple-ease);
  will-change:opacity;
  transform:translateZ(0);
}
.sheet.is-active{opacity:1;pointer-events:auto}
.card{
  position:relative;width:100%;max-width:480px;
  height:85vh;height:85dvh;display:flex;flex-direction:column;overflow:hidden;
  border-radius:30px;border:1px solid rgba(255,255,255,0.2);
  background:linear-gradient(180deg, rgba(38,38,50,0.72) 0%, rgba(18,18,26,0.88) 100%);
  backdrop-filter:blur(var(--blur-sheet)) saturate(var(--glass-saturation));
  -webkit-backdrop-filter:blur(var(--blur-sheet)) saturate(var(--glass-saturation));
  box-shadow:var(--glass-drop-lg);
  padding:12px 20px calc(14px + var(--safe-bottom));
  transform:translate3d(0,105%,0);
  will-change:transform;
}
.is-physics-running { transition: none !important; }
.grab{width:40px;height:5px;background:rgba(255,255,255,.3);border-radius:3px;margin:0 auto 16px;flex:0 0 auto}
.sideclose{position:absolute;top:14px;right:14px;border-radius:15px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:var(--muted);font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;line-height:1;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .2s var(--apple-spring),background .16s var(--apple-ease),color .16s var(--apple-ease)}
.sideclose:active{transform:scale(.9)}

.card-head{flex:0 0 auto;padding-right:40px;min-width:0;}
.card-head h2, .card-head .company-name { overflow-wrap: anywhere; }
.tabs{display:flex;gap:2px;margin-top:20px;border-bottom:1px solid var(--line-soft);position:relative}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);
  padding:11px 12px;font-size:13px;font-weight:500;cursor:pointer;
  transition:color .2s var(--apple-ease),border-color .2s var(--apple-ease),transform .2s var(--apple-spring)}
.tabs button:active{transform:scale(.95)}
.tabs button.on{color:var(--text);border-bottom-color:var(--text)}

.tab-pane{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:32px;padding-right:4px}
.kv{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.kv span:first-child{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.kv span:last-child{font-size:13px;text-align:right;word-break:break-all;margin-left:16px}
.f{width:100%;background:rgba(0,0,0,.3);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:12px 14px;color:var(--text);font-size:14px;outline:none;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.4);
  transition:border-color .2s var(--apple-ease),background .2s var(--apple-ease),box-shadow .2s var(--apple-ease)}
.f:focus{border-color:var(--blue);background:rgba(0,0,0,.5);box-shadow:0 0 0 3.5px rgba(10,132,255,.35), inset 0 1px 2px rgba(0,0,0,.4)}
.card .f{margin-top:8px}
input[type="datetime-local"] { min-height: 44px; }
.big{width:100%;padding:14px 0;border-radius:14px;border:none;font-size:14px;font-weight:600;
  cursor:pointer;margin-top:12px;display:block;text-align:center;text-decoration:none;
  box-shadow:0 4px 14px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .35s var(--apple-bounce),opacity .2s var(--apple-ease)}
.big:active{transform:scale(.94)}
.big[disabled]{opacity:.4;cursor:default}
.rail{display:flex;align-items:center}
.rail i{flex:0 0 auto;border-radius:9px;display:block}
.rail u{height:1px;flex:1;display:block}
.railtxt{display:flex;justify-content:space-between;margin-top:8px}
.railtxt span{font-size:8.5px;color:var(--dim);flex:1;text-align:center}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:6px}

/* ---------- 究極iOS26リキッドグラス・ドック & セグメント ---------- */
.tabbar, .seg{
  touch-action: pan-y;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  position:relative;isolation:isolate;
  background:var(--chrome);
  backdrop-filter:blur(var(--blur-chrome)) saturate(var(--glass-saturation)) brightness(1.15);
  -webkit-backdrop-filter:blur(var(--blur-chrome)) saturate(var(--glass-saturation)) brightness(1.15);
  border:1px solid rgba(255,255,255,0.18);
  box-shadow:var(--glass-edge);
  transition:transform .32s var(--apple-pop), background .3s var(--apple-ease),
             border-color .3s var(--apple-ease), box-shadow .3s var(--apple-ease);
}

.tabbar{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(18px + var(--safe-bottom));z-index:45;
  display:inline-flex;align-items:center;justify-content:center;gap:2px;
  white-space:nowrap;max-width:calc(100vw - 24px);
  border-radius:34px;padding:5px;--pw:clamp(74px, 24vw, 96px);--pg:2px}
.tabbar button{background:none;border:none;color:var(--muted);font-size:13px;font-weight:600;
  padding:10px 0;border-radius:28px;cursor:pointer;position:relative;z-index:1;
  white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
  transition:color .2s var(--apple-ease),transform .2s var(--apple-spring)}
.tabbar button:active{transform:scale(.94)}
.tabbar button:not(.ico){width:var(--pw)}
.tabbar button.on, .tabbar button[aria-pressed="true"]{color:#000}

.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:2px;margin:0 auto 16px;max-width:320px;
  border-radius:34px;padding:4px}
.seg button{background:none;border:none;color:var(--muted);position:relative;z-index:1;
  border-radius:28px;padding:10px 0;font-size:13px;font-weight:600;cursor:pointer;
  white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;
  transition:color .2s var(--apple-ease),transform .2s var(--apple-spring)}
.seg button:active{transform:scale(.95)}
.seg button.on, .seg button[aria-pressed="true"]{color:#000}

    inset 0 2px 1px rgba(255,255,255,.85),
    inset 0 -1.5px 1px rgba(0,0,0,.6),

<script>
/* ==========================================================================
   PRIORITY 1: TIME-BASED SPRING PHYSICS ENGINE
   ========================================================================== */
class Spring {
  constructor(options = {}) {
    this.position = options.position ?? 0;
    this.velocity = options.velocity ?? 0;
    this.target = options.target ?? 0;
    this.mass = options.mass ?? 1;
    this.stiffness = options.stiffness ?? 320;
    this.damping = options.damping ?? 30;
    this.lastTime = 0;
  }
  resetTime() { this.lastTime = 0; }
  update(time) {
    if (!Number.isFinite(time)) return this.position;
    if (!Number.isFinite(this.position) || !Number.isFinite(this.velocity) || !Number.isFinite(this.target)) {
      this.position = Number.isFinite(this.target) ? this.target : 0;
      this.velocity = 0;
      this.lastTime = time;
      return this.position;
    }
    if (!this.lastTime) { this.lastTime = time; return this.position; }
    let dt = (time - this.lastTime) / 1000;
    this.lastTime = time;
    dt = Math.min(dt, 1 / 30);
    const displacement = this.position - this.target;
    const springForce = -this.stiffness * displacement;
    const dampingForce = -this.damping * this.velocity;
    const acceleration = (springForce + dampingForce) / this.mass;
    this.velocity += acceleration * dt;
    this.velocity = Math.max(-6000, Math.min(6000, this.velocity));
    this.position += this.velocity * dt;
    return this.position;
  }
  isResting(pThresh = 0.1, vThresh = 0.1) {
    return Math.abs(this.target - this.position) < pThresh && Math.abs(this.velocity) < vThresh;
  }
}

const SPRING_PRESETS = Object.freeze({
  pill:  { mass: 1, stiffness: 420, damping: 34 },
  sheet: { mass: 1, stiffness: 360, damping: 32 },
  soft:  { mass: 1, stiffness: 260, damping: 30 },
  press: { mass: 0.8, stiffness: 500, damping: 38 }
});

/* ==========================================================================

   ========================================================================== */
const MotionLayer = (() => {
  const tasks = new Set();
  let frameId = 0;
  function tick(time) {
    const snapshot = Array.from(tasks);
    for (const task of snapshot) {
      try {
        task(time);
      } catch (error) {
        tasks.delete(task);
        console.error('Motion task failed', error);
      }
    }

const WarpEngine = (() => {

function captureFocusState() {
  const active = document.activeElement;

    id: active.id || '',
    action: active.dataset ? active.dataset.action || '' : '',
    itemKey: active.dataset ? active.dataset.itemKey || '' : ''

}

function restoreFocusState(state) {
  if (!state) return;
  let target = null;
  if (state.id) {
    target = document.getElementById(state.id);
  }
  if (!target && state.action && state.itemKey) {
    target = document.querySelector(`[data-action="${CSS.escape(state.action)}"][data-item-key="${CSS.escape(state.itemKey)}"]`);

}

function captureFormState(container) {
  if (!container) return null;
  const state = {};
  container.querySelectorAll('input[id],select[id],textarea[id]').forEach(field => {
    if (field.type === 'password') return;
    state[field.id] = field.value;
  });
  return state;
}

function restoreFormState(container, state) {
  if (!container || !state) return;
  Object.keys(state).forEach(id => {
    const field = container.querySelector('#' + CSS.escape(id));
    if (field && document.activeElement !== field) {
      field.value = state[id];
    }
  });

function scheduleRender(pageChanged) {
  pendingPageChanged = pendingPageChanged || Boolean(pageChanged);
  if (renderPending) return;
  renderPending = true;
  requestAnimationFrame(() => {
    const animate = pendingPageChanged;
    renderPending = false;
    pendingPageChanged = false;
    performRender(animate);
  });

function performRender(pageChanged) {
  if (isRendering) {
    rerenderRequested = true;
    return;
  }
  isRendering = true;
  const focusState = captureFocusState();
  const sidePanel = document.getElementById('side');
  const sideFormState = captureFormState(sidePanel);

  try {
    render(pageChanged);
  } catch (error) {
    console.error('Render failed', error);
    toast('表示の更新に失敗しました');
  } finally {
    isRendering = false;
  }

  if (sidePanel && sideFormState) {
    restoreFormState(sidePanel, sideFormState);
  }

  afterRender({
    pillSync: pendingPillSyncMode,
    focusState: focusState
  });

  if (rerenderRequested) {
    rerenderRequested = false;
    scheduleRender(false);
  }
}

const visibleCards = new Set();

  destroyCardObserver();

  cardObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        visibleCards.add(entry.target);
      } else {
        visibleCards.delete(entry.target);
        entry.target.style.removeProperty('--card-offset');
      }
    });
  }, { rootMargin: '120px 0px', threshold: 0 });

  document.querySelectorAll('.row').forEach(c => cardObserver.observe(c));
}

function destroyCardObserver() {
  if (cardObserver) {
    cardObserver.disconnect();
    cardObserver = null;
  }
  visibleCards.clear();
}

function updateCardParallax() {
  parallaxFrame = 0;
  if (!motionEffectsEnabled()) return;
  const viewportCenter = window.innerHeight * 0.5;
  visibleCards.forEach(card => {
    if (card.matches(':focus-visible')) {
      card.style.setProperty('--card-offset', '0px');
      return;
    }
    const rect = card.getBoundingClientRect();
    const center = rect.top + rect.height * 0.5;
    const norm = (viewportCenter - center) / Math.max(window.innerHeight, 1);
    const offset = Math.max(-6, Math.min(6, norm * 10));
    card.style.setProperty('--card-offset', `${offset.toFixed(2)}px`);
  });

function requestParallaxUpdate() {
  if (parallaxFrame) return;
  parallaxFrame = requestAnimationFrame(updateCardParallax);
}

function handleScrollFrame() {
  scrollFrame = 0;
  const sy = window.scrollY;
  if (sy !== lastScrollY) {
    lastScrollY = sy;

    if (heroParallax && !prefersReducedMotion) {
      heroParallax.style.transform = `translate3d(0, ${Math.min(18, sy * 0.03).toFixed(2)}px, 0)`;

    toast(url==='none'?'ロゴが見つかりませんでした':'ロゴを取り直しました',url!=='none');
  }));
}
function setLogoUrl(co){

  toast('ロゴを設定しました',true);
}
function paintLogo(co,url){

/* ============ 通信 ============ */
var CFG={ep:'',key:''};
function loadCfg(){
  try{
    CFG.ep = localStorage.getItem('sk_ep')||'';
    CFG.key= localStorage.getItem('sk_key')||'';
  }catch(e){}
  return !!(CFG.ep&&CFG.key);
}
function saveCfg(ep,key){
  CFG.ep=ep; CFG.key=key;
  try{ localStorage.setItem('sk_ep',ep); localStorage.setItem('sk_key',key); }catch(e){}
}
function api(action,args){
  return fetch(CFG.ep,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({key:CFG.key,action:action,args:args||[]}),
    redirect:'follow'
  }).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(j){
    if(j&&j.ok===false) throw new Error(j.error==='unauthorized'?'鍵が違います':j.error);
    return j;
  });
}
function busy(on){
  const element = document.getElementById('busy');
  if (element) {
    element.style.display = on ? 'flex' : 'none';
    element.setAttribute('aria-hidden', String(!on));
  }
  document.body.setAttribute('aria-busy', String(on));
}
function applyData(j,cb){
  DATA=j;
  if(j&&j.items&&j.items.length) cacheSave(j);
  if(DATA.logos)for(var k in DATA.logos)if(!LOGOS[k])LOGOS[k]=DATA.logos[k];
  scheduleRender(false); hydrateLogos(); if(cb)cb();
}
function call(fn,args,cb){
  busy(true);
  api(fn,args).then(function(j){ busy(false); applyData(j,cb); })
  .catch(function(e){
    busy(false); hideSplash();
    resetUi();
    document.getElementById('app').innerHTML=
      '<div style="color:var(--dim);font-size:13px;line-height:1.9;padding:40px 0">'+
      '読み込めませんでした。<br>'+esc(e&&e.message?e.message:'')+
      '<br><br><button class="gh" type="button" onclick="location.reload()">再読み込み</button>'+
      '<button class="gh" type="button" style="margin-left:8px" data-action="open-setup">接続設定</button></div>';
  });
}
function resetUi(){
  finalizeSheetClose({ clearSelection: true });
  var dock=document.getElementById('tabbar');
  if(dock) dock.style.display='';
  var side=document.getElementById('side');
  if(side){ side.dataset.co=''; side.innerHTML=''; }
}
var booted=false;
function hideSplash(){
  if(booted)return; booted=true;
  var el=document.getElementById('splash');
  if(el){el.classList.add('gone');setTimeout(function(){if(el.parentNode)el.remove()},350)}
}
function cacheSave(j){
  try{ localStorage.setItem('sk_cache', JSON.stringify(
    {items:j.items||[], events:j.events||[], logos:j.logos||{}, at:Date.now()})); }catch(e){}
}
function cacheLoad(){
  try{ return JSON.parse(localStorage.getItem('sk_cache')||'null'); }catch(e){ return null }
}
function isValidDataPayload(value) {
  return Boolean(value && Array.isArray(value.items) && (value.events == null || Array.isArray(value.events)));
}

let dataRefreshPromise = null;
function refreshDataSafely() {
  if (dataRefreshPromise) return dataRefreshPromise;
  dataRefreshPromise = api('apiGetData', []).then(function(data) {
    if (!isValidDataPayload(data)) throw new Error('Invalid data payload');
    cacheSave(data);
    applyData(data);
    var e=document.getElementById('stale'); if(e) e.classList.remove('on');
    return data;
  }).finally(function() {
    dataRefreshPromise = null;
  });
  return dataRefreshPromise;
}

function load(){
  var c=cacheLoad();
  if(c && c.items && c.items.length){
    applyData(c, hideSplash);
    var st=document.getElementById('stale');
    if(st) st.classList.add('on');
    refreshDataSafely().catch(function(){
      var e=document.getElementById('stale');
      if(e){ e.textContent='最新を取得できませんでした'; }
      toast('最新を取得できませんでした。前回の内容を表示しています');
    });
    return;
  }
  call('apiGetData',[],hideSplash);
}

/* ============ 楽観的更新 ============ */
function toast(msg,ok){
  var el=document.getElementById('toast');
  if(!el) return;
  clearTimeout(window._tt);
  requestAnimationFrame(function() {
    el.textContent = msg;
    el.style.borderColor = ok?'rgba(48,209,88,.6)':'rgba(255,69,58,.6)';
    el.classList.add('on');
    window._tt=setTimeout(function(){el.classList.remove('on')},2200);
  });
}
function opt(mutate,fn,args,label,mutationKey){
  var snapshot=JSON.stringify(DATA.items);
  const key = mutationKey || fn + '::' + JSON.stringify(args);
  const version = beginMutation(key);
  mutate();
  scheduleRender(false);
  api(fn,args).then(function(d){
    if (!isLatestMutation(key, version)) return;
    if(d&&d.items){
      DATA.items=d.items; DATA.events=d.events;
    }
    scheduleRender(false);
  }).catch(function(){
    if (!isLatestMutation(key, version)) return;
    DATA.items=JSON.parse(snapshot);
    scheduleRender(false);
    toast('保存できませんでした。通信を確認してください');
  });
  if(label)toast(label,true);
}
function find_(co){
  for(var i=0;i<DATA.items.length;i++){
    if(DATA.items[i].c===co&&(DATA.items[i].term||'夏インターン')===TERM)return DATA.items[i];
  }
  return null;
}
function doDone(co){
  opt(function(){var it=find_(co);if(!it)return;it.status='結果待ち';it.since=todayStr();},
      'apiMarkDone',[co,TERM],'結果待ちに移しました');
}
function doPass(co){
  opt(function(){
    var it=find_(co);if(!it)return;
    var r=routeOf(it),i=r.indexOf(it.stage);
    if(i<0||i>=r.length-2){it.status='内定';it.on=todayStr();}
    else{it.stage=r[i+1];it.status='対応中';it.due=null;it.since=null;}
  },'apiMarkPass',[co,TERM],'通過を記録しました');
}
function doPrevStage(co){
  var it=find_(co); if(!it)return;
  var r=routeOf(it), cur=it.lost||it.stage, i=r.indexOf(cur);
  if(i<=0){ toast('これ以上前の選考段階はありません'); return; }
  var prev=r[i-1];
  opt(function(){
    var x=find_(co); if(!x)return;
    x.stage=prev; x.status='対応中';
    x.lost=''; x.on=null; x.due=null; x.since=null;
  },'apiPrevStage',[co,TERM,prev], prev+' に戻しました');
}
function doFail(co){
  opt(function(){var it=find_(co);if(!it)return;it.lost=it.stage;it.status='落選';it.on=todayStr();it.due=null;},
      'apiMarkFail',[co,TERM],'選考終了として記録しました');
}
function doStatus(co,st){
  opt(function(){
    var it=find_(co);if(!it)return;
    it.status=st;
    if(st==='結果待ち'&&!it.since)it.since=todayStr();
    if(st==='対応中'){it.lost='';it.on=null;}
  },'apiSetStatus',[co,TERM,st],st+'にしました');
}
function setDue(co){
  var el=document.getElementById('coDue');
  var v=el?el.value:'';
  call('apiSetDue',[co,TERM,v],function(){toast(v?'締切を更新しました':'締切を未定にしました',true)});
}

/* ============ 状態 ============ */
function stOf(it){
  var s=it.status||'';
  if(s==='見送り') return 'skip';
  if(s==='落選') return 'fail';
  if(s==='内定') return 'offer';
  if(s==='参加決定') return 'fixed';
  if(s==='結果待ち') return 'waiting';
  if(s==='対応中'&&it.due&&!rem(it.due)) return 'waiting';
  return 'todo';
}
function autoSent(it){return it.status==='対応中'&&it.due&&!rem(it.due)}

/* ============ 一覧描画 ============ */
function dayCell(n,color,unit){
  if(n==='TODAY') return '<b style="font-size:21px;color:'+color+'">TODAY</b>';
  return '<b style="color:'+color+'">'+n+'</b><s>'+(unit||'DAYS')+'</s>';
}
function rowHtml(it){
  var st=stOf(it), r=it.due?rem(it.due):null, left='', right='', sub='';
  if(st==='waiting'){
    var d=since(it.since||(it.due?it.due.slice(0,10):null));
    left='<b style="font-size:32px;color:'+(d>=14?'var(--hot)':'var(--wait)')+'">'+(d==null?'—':d)+'</b><s>DAYS 経過</s>';
    right=it.since?fdate(it.since)+' 提出':'';
    if(autoSent(it)) sub='<div class="sub" style="color:var(--wait)">締切経過で自動送り</div>';
  } else if(st==='fixed'){
    var ev=nextEv(it.c), rr=ev?rem(ev.at):null;
    left=rr?dayCell(rr.d===0?'TODAY':rr.d,'var(--go)'):'<span class="tag" style="color:var(--go)">参加<br>決定</span>';
    right=ev?fdate(ev.at)+' 実施':(it.on?fdate(it.on)+' 確定':'');
  } else if(st==='offer'){
    left='<span class="tag" style="color:var(--go)">内定</span>';
    right=it.on?fdate(it.on):'';
  } else if(st==='fail'){
    left='<span class="tag" style="color:var(--dim)">終了</span>';
    right=it.on?fdate(it.on):'';
  } else if(st==='skip'){
    left='<span class="tag" style="color:var(--dim)">見送り</span>';
  } else if(r){
    left=dayCell(r.d===0?'TODAY':r.d, r.d<=2?'var(--hot)':'var(--text)');
    right=fdate(it.due);
    if(!it.timeUnset) sub='<div class="sub">締切 '+ftime(it.due)+'</div>';
  } else {
    left='<span class="tag" style="color:var(--dim)">未定</span>';
  }

  var acts='';
  if(st==='todo') acts='<div class="acts"><button class="gh" type="button" data-action="do-done" data-company="'+esc(it.c)+'">完了にする</button></div>';
  if(st==='waiting'){
    var rt=routeOf(it), last=rt.indexOf(it.stage)>=rt.length-2;
    acts='<div class="acts">'+
      '<button class="gh" type="button" style="border-color:rgba(48,209,88,.5);color:var(--go)" data-action="do-pass" data-company="'+esc(it.c)+'">'+(last?'内定':'通過')+'</button>'+
      '<button class="gh" type="button" data-action="confirm-fail" data-company="'+esc(it.c)+'">落選</button></div>';
  }

  var isMuted = (st==='fail'||st==='skip');
  return '<div class="row'+(st==='fixed'?' is-fixed':st==='offer'?' is-offer':'')+(isMuted?' is-muted':'')+
    '" data-cardco="'+esc(it.c)+'" data-item-key="'+esc(itemUiKey(it))+'" data-action="open-detail" data-company="'+esc(it.c)+'" tabindex="0" role="button" aria-label="'+esc(it.c)+'の詳細を開く">'+
    '<div class="main">'+
      '<div class="day">'+left+'</div>'+
      '<div class="body1"><div class="meta">'+logo(it)+
        '<em>'+esc(it.lost||it.stage)+'</em>'+
        (isCo(it)?'':'<em style="color:var(--dim);font-size:10px">管理用</em>')+
        '<i>'+right+'</i></div>'+
        '<div class="name">'+esc(it.c)+'</div>'+sub+
      '</div></div>'+acts+'</div>';
}
function eventRowHtml(ev){
  var it=byCo(ev.c)||{c:ev.c,dom:''}, r=rem(ev.at);
  return '<div class="row" data-cardco="'+esc(ev.c)+'" data-item-key="'+esc(itemUiKey(it))+'" data-action="open-detail" data-company="'+esc(ev.c)+'" tabindex="0" role="button" aria-label="'+esc(ev.c)+'の予定詳細を開く"><div class="main">'+
    '<div class="day">'+(r?dayCell(r.d===0?'TODAY':r.d, r.d<=2?'var(--hot)':'var(--text)'):'<span class="tag" style="color:var(--dim)">終了</span>')+'</div>'+
    '<div class="body1"><div class="meta">'+logo(it)+
      '<em style="color:var(--text)">'+esc(ev.kind)+'</em><i>'+fdate(ev.at)+' '+ftime(ev.at)+'</i></div>'+
      '<div class="name">'+esc(ev.c)+'</div>'+
      (ev.place?'<div class="sub" style="font-family:var(--body)">'+esc(ev.place)+'</div>':'')+
    '</div></div></div>';
}

function updateNavigationState() {
  const bList = document.getElementById('tb-list');
  const bPass = document.getElementById('tb-pass');
  if (bList) {
    bList.classList.toggle('on', PAGE === 'list');
    bList.setAttribute('aria-pressed', String(PAGE === 'list'));
  }
  if (bPass) {
    bPass.classList.toggle('on', PAGE === 'pass');
    bPass.setAttribute('aria-pressed', String(PAGE === 'pass'));
  }
}

function setTerm(t){
  TERM=t;
  window.scrollTo(0,0);
  requestPillSync(liquidSelectionHost ? 'preserve' : 'animate');
  scheduleRender(true);
}

function setFilt(k){
  FILT = (FILT===k && k!=='all') ? 'all' : k;
  if(FILT==='end' && !window._end){ window._end=true; scheduleRender(false); return; }
  if(FILT==='skip' && !window._skip){ window._skip=true; scheduleRender(false); return; }

  var btns = document.querySelectorAll('.chiprow button');
  Array.prototype.forEach.call(btns,function(b){
    b.className = (b.getAttribute('data-filt')===FILT) ? 'on' : '';
  });

  var lanesBox = document.querySelector('.lanes');
  if(!lanesBox) return;
  lanesBox.classList.toggle('single', FILT!=='all');

  var lanes = lanesBox.querySelectorAll('.lane');
  Array.prototype.forEach.call(lanes,function(l){
    var lk = l.getAttribute('data-lane');
    if(!lk) return;
    if(FILT==='all'){
      l.classList.remove('is-filt-hidden');
    } else {
      l.classList.toggle('is-filt-hidden', lk!==FILT);
    }
  });
}

function setPage(p){
  PAGE=p;
  updateNavigationState();
  window.scrollTo(0,0);
  requestPillSync(liquidSelectionHost ? 'preserve' : 'animate');
  scheduleRender(true);
}
function toggleEnded(){window._end=!window._end;scheduleRender(false);}
function toggleSkip(){window._skip=!window._skip;scheduleRender(false);}

let currentDayKey = todayStr();
function checkDayBoundary() {
  const next = todayStr();
  if (next !== currentDayKey) {
    currentDayKey = next;
    scheduleRender(false);
  }
}

function render(pageChanged){
  ensureShell(); updateSeg();
  checkDayBoundary();
  if(PAGE==='pass'){
    destroyCardObserver();
    renderPassport(pageChanged);
    return;
  }
  var ALL=ITEMS();
  var MGMT=ALL.filter(function(i){return !isCo(i)});
  var LIST=ALL.filter(isCo);
  var agenda=[];
  LIST.forEach(function(it){
    if(stOf(it)==='todo'&&it.due&&rem(it.due)) agenda.push({c:it.c,kind:'due',at:it.due,it:it});
  });
  EVENTS().forEach(function(ev){ if(rem(ev.at)) agenda.push({c:ev.c,kind:'event',at:ev.at,ev:ev,it:byCo(ev.c)}); });
  agenda.sort(function(a,b){return (D(a.at)||0)-(D(b.at)||0)});
  var hero=agenda[0];

  var h='';

  if(MGMT.length){
    h+='<div class="strip">';
    MGMT.forEach(function(it){
      var r=it.due?rem(it.due):null;
      var lab=r?(r.d===0?'今日':r.d+'日後'):(it.due?'期限切れ':'日程未定');
      h+='<button class="stripitem" type="button" data-action="open-detail" data-company="'+esc(it.c)+'">'+
        '<span class="k">受験予定</span><span class="n">'+esc(it.c)+'</span>'+
        '<span class="d" style="color:'+(r&&r.d<=2?'var(--hot)':'var(--text)')+'">'+lab+'</span>'+
        (it.due?'<span class="w">'+fdate(it.due)+(it.timeUnset?'':' '+ftime(it.due))+'</span>':'')+
        '</button>';
    });
    h+='</div>';
  }

  if(hero){
    var it=hero.it||{c:hero.c,dom:''};
    var head=hero.kind==='due'?'次の締切':'次の'+hero.ev.kind;
    var stage=hero.kind==='due'?it.stage:hero.ev.kind;
    h+='<div class="hero-parallax" id="heroParallax"><div class="hero-float"><div class="hero" tabindex="0" role="button" aria-label="直近の選考タスクの詳細を開く" data-action="open-detail" data-company="'+esc(hero.c)+'">'+
      '<div class="lab" style="margin:0">'+head+'</div>'+
      '<div style="display:flex;align-items:center;gap:10px;margin-top:10px">'+logo(it,36)+'<h1>'+esc(hero.c)+'</h1></div>'+
      '<div style="font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.06em">'+
        esc(stage)+' '+fdate(hero.at)+((hero.kind==='due'&&it.timeUnset)?'':' '+ftime(hero.at))+'</div>'+
      '<div class="cd" id="heroCd" data-at="'+esc(hero.at)+'"></div></div></div></div>';
  } else if(!DATA.items.length){
    h+='<div class="emptyNote">シートからデータを取得できていません。<br>'+
       'Sheet1 に行があるか、接続設定が正しいかを確認してください。'+
       '<button class="gh" type="button" style="display:block;margin:14px auto 0" onclick="resetCfg()">接続設定をやり直す</button></div>';
  } else {
    h+='<div style="color:var(--dim);font-size:14px;padding:20px 0">予定も締切もありません。</div>';
  }

  var events=agenda.filter(function(a){return a.kind==='event' && a!==hero});
  var todo=LIST.filter(function(x){
      return stOf(x)==='todo' && !(hero && hero.kind==='due' && hero.c===x.c);
    })
    .sort(function(a,b){return (D(a.due)||9e15)-(D(b.due)||9e15)});
  var fixed=LIST.filter(function(x){return stOf(x)==='fixed'});
  var waiting=LIST.filter(function(x){return stOf(x)==='waiting'})
    .sort(function(a,b){return (a.since||'').localeCompare(b.since||'')});
  var offers=LIST.filter(function(x){return stOf(x)==='offer'})
    .sort(function(a,b){return (b.on||'').localeCompare(a.on||'')});
  var ended=LIST.filter(function(x){return stOf(x)==='fail'})
    .sort(function(a,b){return (b.on||'').localeCompare(a.on||'')});
  var skipped=LIST.filter(function(x){return stOf(x)==='skip'});

  var G=[
    {k:'event', lab:'予定',    col:'var(--text)', n:events.length},
    {k:'todo',  lab:'対応中',  col:'var(--blue)', n:todo.length},
    {k:'offer', lab:'内定',    col:'var(--go)',   n:offers.length},
    {k:'fixed', lab:'参加決定',col:'var(--go)',   n:fixed.length},
    {k:'wait',  lab:'結果待ち',col:'var(--wait)', n:waiting.length},
    {k:'end',   lab:'終了',    col:'var(--dim)',  n:ended.length},
    {k:'skip',  lab:'見送り',  col:'var(--dim)',  n:skipped.length}
  ].filter(function(g){return g.n>0});

  h+='<div class="chips"><div class="chiprow">';
  h+='<button data-filt="all" type="button" class="'+(FILT==='all'?'on':'')+'" onclick="setFilt(\'all\')">すべて'+
     '<b>'+(events.length+todo.length+offers.length+fixed.length+waiting.length)+'</b></button>';
  G.forEach(function(g){
    h+='<button data-filt="'+g.k+'" type="button" class="'+(FILT===g.k?'on':'')+'" onclick="setFilt(\''+g.k+'\')">'+
       g.lab+'<b style="color:'+(FILT===g.k?'':g.col)+'">'+g.n+'</b></button>';
  });
  h+='</div></div>';

  var rows={
    event:function(){return events.map(function(a){return eventRowHtml(a.ev)}).join('')},
    todo :function(){return todo.map(rowHtml).join('')},
    offer:function(){return offers.map(rowHtml).join('')},
    fixed:function(){return fixed.map(rowHtml).join('')},
    wait :function(){return waiting.map(rowHtml).join('')},
    end  :function(){return ended.map(rowHtml).join('')},
    skip :function(){return skipped.map(rowHtml).join('')}
  };

  h+='<div class="lanes'+(FILT==='all'?'':' single')+'">';
  G.forEach(function(g){
    if(g.k==='end'||g.k==='skip')return;
    var isHidden = (FILT!=='all' && FILT!==g.k);
    h+='<section class="lane'+(isHidden?' is-filt-hidden':'')+'" data-lane="'+g.k+'">'+
       '<div class="lab" style="color:'+g.col+'">'+g.lab+'\u3000'+g.n+'件</div>'+
       '<div class="rows">'+rows[g.k]()+'</div></section>';
  });

  if(ended.length){
    var isEndHidden = (FILT!=='all' && FILT!=='end');
    h+='<section class="lane'+(isEndHidden?' is-filt-hidden':'')+'" data-lane="end">'+
       '<button class="lab accord-btn" type="button" onclick="toggleEnded()">'+
       '終了 '+ended.length+'件 '+(window._end?'▾':'▸')+'</button>'+
       (window._end?'<div class="rows">'+rows.end()+'</div>':'')+'</section>';
  }
  if(skipped.length){
    var isSkipHidden = (FILT!=='all' && FILT!=='skip');
    h+='<section class="lane'+(isSkipHidden?' is-filt-hidden':'')+'" data-lane="skip">'+
       '<button class="lab accord-btn" type="button" onclick="toggleSkip()">'+
       '見送り '+skipped.length+'件 '+(window._skip?'▾':'▸')+'</button>'+
       (window._skip?'<div class="rows">'+rows.skip()+'</div>':'')+'</section>';
  }
  h+='</div>';

  document.getElementById('view').innerHTML=h;

/* ============ シート・モーダル制御 ============ */
let lockY = 0, pushed = false, locked = false;
let closingFromHistory = false;
let previousFocus = null;
let suppressFocusReturn = false;

function lockScroll(on) {
  if (on) {
    lockY = window.scrollY;
    document.body.style.position = 'fixed';
    document.body.style.top = `-${lockY}px`;
    document.body.style.left = '0';
    document.body.style.right = '0';
    document.body.style.width = '100%';
    return;
  }
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.left = '';
  document.body.style.right = '';
  document.body.style.width = '';
  window.scrollTo(0, lockY);
}

function resetAppDepth() {
  document.body.style.removeProperty('--app-scale');
  document.body.style.removeProperty('--app-offset');
  document.body.style.removeProperty('--app-brightness');
  document.body.style.removeProperty('--app-blur');
}

function setBackgroundInert(inert) {
  const elements = [
    document.getElementById('app'),
    document.getElementById('tabbar'),
    isWide() ? null : document.getElementById('side')
  ].filter(Boolean);

  elements.forEach(element => {
    if ('inert' in element) {
      element.inert = inert;
    }
    if (inert) {
      element.setAttribute('aria-hidden', 'true');
    } else {
      element.removeAttribute('aria-hidden');
    }
  });
}

function rememberDialogOpener() {
  previousFocus = document.activeElement;
}

function cancelSheetSpring(card) {
  if (card && card._sheetSpringTask) {
    MotionLayer.remove(card._sheetSpringTask);
    card._sheetSpringTask = null;
  }
}

function getFocusable(container) {
  const candidates = Array.from(
    container.querySelectorAll(
      'button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'
    )
  );
  return candidates.filter(element => {
    if (element.hidden || element.getAttribute('aria-hidden') === 'true' || element.closest('[inert]')) {
      return false;
    }
    const style = getComputedStyle(element);
    return style.display !== 'none' && style.visibility !== 'hidden' && element.getClientRects().length > 0;
  });
}

function primeDialogFocus(dialog) {
  if (!dialog) return;
  dialog.setAttribute('tabindex', '-1');
  dialog.focus({ preventScroll: true });
}

function activateDialogFocus(dialog, options = {}) {
  if (!options.preservePreviousFocus) {
    previousFocus = document.activeElement;
  }
  removeFocusTrap(dialog);

  const focusable = getFocusable(dialog);
  if (focusable.length) {
    focusable[0].focus({ preventScroll: true });
  } else {
    dialog.focus({ preventScroll: true });
  }

  dialog._focusTrap = function(event) {
    if (event.key !== 'Tab') return;
    const items = getFocusable(dialog);
    if (!items.length) {
      event.preventDefault();
      dialog.focus();
      return;
    }
    const first = items[0];
    const last = items[items.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  };
  dialog.addEventListener('keydown', dialog._focusTrap);
}

function removeFocusTrap(dialog) {
  if (dialog && dialog._focusTrap) {
    dialog.removeEventListener('keydown', dialog._focusTrap);
    delete dialog._focusTrap;
  }
}

function restorePreviousFocus() {
  if (suppressFocusReturn) {
    suppressFocusReturn = false;
    previousFocus = null;
    return;
  }
  if (!previousFocus || !previousFocus.isConnected) {
    previousFocus = document.getElementById('tb-list');
  }
  if (previousFocus && previousFocus.focus) {
    previousFocus.focus({ preventScroll: true });
  }
  previousFocus = null;
}

function modalOpened(options = {}) {
  const useHistory = options.history !== false;
  if (!locked) {
    locked = true;
    lockScroll(true);
  }
  document.body.classList.add('sheet-open');
  setBackgroundInert(true);
  if (useHistory && !pushed) {
    pushed = true;
    history.pushState({ sheet: 1, owner: 'jobhunt-ui', modal: activeModalType }, '');
  }
  bindSheetGesture();
}

function resetModalState() {
  const box = document.getElementById('sheet');
  if (box) {
    const dialog = box.querySelector('[role="dialog"]');
    if (dialog) removeFocusTrap(dialog);
    box.innerHTML = '';
    box.classList.remove('modal-host');
    delete box.dataset.modalType;
  }
  setBackgroundInert(false);
  resetAppDepth();
  document.body.classList.remove('sheet-open');
  modalState = ModalState.CLOSED;
  activeModalType = null;
  closingFromHistory = false;
  if (locked) {
    locked = false;
    lockScroll(false);
  }
}

function finalizeSheetClose(options = {}) {
  const clearSelection = options.clearSelection !== false;
  const box = document.getElementById('sheet');
  if (box) {
    const dialog = box.querySelector('[role="dialog"]');
    if (dialog) removeFocusTrap(dialog);
    box.innerHTML = '';
    box.classList.remove('modal-host');
    delete box.dataset.modalType;
  }
  document.body.classList.remove('sheet-open');
  resetAppDepth();
  setBackgroundInert(false);
  if (clearSelection) {
    openCo = null;
  }
  modalState = ModalState.CLOSED;
  activeModalType = null;
  closingFromHistory = false;
  if (locked) {
    locked = false;
    lockScroll(false);
  }
  restorePreviousFocus();

  if (pendingAfterSheetClose) {
    const next = pendingAfterSheetClose;
    pendingAfterSheetClose = null;
    requestAnimationFrame(next);
  }
}

function animateSheetOpen(card) {
  cancelSheetSpring(card);
  const height = Math.max(card.offsetHeight, (window.visualViewport ? window.visualViewport.height : window.innerHeight) * 0.85);
  const spring = new Spring({
    ...SPRING_PRESETS.sheet,
    position: height,
    target: 0,
    velocity: -60
  });
  spring.resetTime();
  card.classList.add('is-physics-running');
  card.style.transform = `translate3d(0, ${height.toFixed(2)}px, 0) scale(.975)`;

  const task = function(time) {
    const y = spring.update(time);
    const progress = 1 - Math.min(1, Math.max(0, y / height));
    const scale = 0.975 + progress * 0.025;
    card.style.transform = `translate3d(0, ${Math.max(0, y).toFixed(2)}px, 0) scale(${scale.toFixed(4)})`;

    if (spring.isResting()) {
      MotionLayer.remove(task);
      card._sheetSpringTask = null;
      card.classList.remove('is-physics-running');
      card.style.transform = 'translate3d(0,0,0)';
      modalState = ModalState.OPEN;
      activateDialogFocus(card, { preservePreviousFocus: true });
    }
  };
  card._sheetSpringTask = task;
  MotionLayer.add(task);
}

function requestSheetClose() {
  if (modalState === ModalState.CLOSING || modalState === ModalState.CLOSED) return;
  if (!isWide() && pushed && !closingFromHistory) {
    closingFromHistory = true;
    history.back();
    return;
  }
  closeOverlay();
}

function closeOverlay() {
  if (modalState === ModalState.CLOSING || modalState === ModalState.CLOSED) return;
  modalState = ModalState.CLOSING;
  
  var box = document.getElementById('sheet');
  var sh = box && box.querySelector('.sheet');
  var dialog = sh && sh.querySelector('[role="dialog"]');
  var card = sh && sh.querySelector('.card');

  if (!sh) {
    finalizeSheetClose();
    return;
  }

  if (dialog) removeFocusTrap(dialog);
  cancelSheetSpring(card);
  sh.classList.remove('is-active');
  document.body.classList.remove('sheet-open');
  resetAppDepth();

  if (card) {
    card.classList.remove('is-physics-running');
    card.style.transition = 'transform 280ms cubic-bezier(.32,.72,0,1)';
    card.style.transform = 'translate3d(0,105%,0) scale(.98)';
  }

  setTimeout(function() {
    finalizeSheetClose();
  }, 300);
}

function closeSide(){ openCo=null; sideEmpty(); }
function closeDetail(){
  if(isWide()){ closeSide(); return; }
  requestSheetClose();
}
function closeSheet(e){
  if(e && e.target !== e.currentTarget) return;
  var box = document.getElementById('sheet');
  if(box && box.innerHTML){
    requestSheetClose();
    return;
  }
  if(isWide()) closeSide();
}

window.addEventListener('popstate', function() {
  pushed = false;
  closingFromHistory = false;
  const box = document.getElementById('sheet');
  if (box && box.innerHTML) {
    closeOverlay();
  }
});

function bindSheetGesture(){
  var card = document.querySelector('#sheet .card');
  if (!card || card._bound) return;
  card._bound = true;

  let y0 = 0, startX = 0, lastY = 0, lastT = 0, velocity = 0, dy = 0;
  let active = false, tracking = false;
  let activeSpringTask = null;
  const spring = new Spring(SPRING_PRESETS.sheet);

  function getScrollTop(){
    var pane = card.querySelector('.tab-pane');
    return pane ? pane.scrollTop : card.scrollTop;
  }

  card.addEventListener('touchstart', function(e){
    if (e.touches.length !== 1) return;
    const target = e.target;
    const editing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    const startedOnGrab = target.closest('.grab');
    if (editing && !startedOnGrab) return;

    const interactive = target.closest('button,a,input,select,textarea,.tabs');
    if (interactive && !startedOnGrab) return;

    cancelSheetSpring(card);
    if (activeSpringTask) {
      MotionLayer.remove(activeSpringTask);
      activeSpringTask = null;
    }

    y0 = lastY = e.touches[0].clientY;
    startX = e.touches[0].clientX;
    lastT = Date.now();
    velocity = 0;
    dy = 0;
    active = false;
    tracking = true;
  }, {passive:true});

  card.addEventListener('touchmove', function(e){
    if (!tracking || e.touches.length !== 1) return;
    const cy = e.touches[0].clientY;
    const cx = e.touches[0].clientX;
    const now = Date.now();
    const dt = Math.max(1, now - lastT);
    const instantVelocity = (cy - lastY) / dt;
    velocity = velocity * 0.72 + instantVelocity * 0.28;
    lastY = cy;
    lastT = now;
    const vdy = cy - y0;
    const vdx = cx - startX;

    const st = getScrollTop();
    if (!active) {
      if (Math.abs(vdx) > Math.abs(vdy)) { tracking = false; return; }
      if (st > 0) { y0 = cy; lastY = cy; lastT = now; velocity = 0; return; }
      if (vdy > 4) { 
        active = true;
        card.classList.add('is-physics-running');
      } else {
        return;
      }
    }
    if (active) {
      dy = vdy;
      const targetY = rubberBand(Math.max(0, dy));
      card.style.transform = `translate3d(0, ${targetY.toFixed(2)}px, 0)`;
      
      const progress = Math.min(1, targetY / 320);
      document.body.style.setProperty('--app-scale', (0.965 + progress * 0.035).toFixed(4));
      document.body.style.setProperty('--app-offset', `${(8 - progress * 8).toFixed(2)}px`);
      document.body.style.setProperty('--app-brightness', (0.68 + progress * 0.32).toFixed(3));
      document.body.style.setProperty('--app-blur', `${(1.2 - progress * 1.2).toFixed(2)}px`);
      
      if (e.cancelable) e.preventDefault();
    }
  }, {passive:false});

  function end(){
    if (!tracking) return;
    tracking = false;
    if (!active) {
      card.classList.remove('is-physics-running');
      return;
    }
    active = false;

    const projectedDistance = dy + velocity * 190;
    const dismiss = projectedDistance > 160 && velocity > -0.05;

    if (dismiss) {
      card.classList.remove('is-physics-running');
      requestSheetClose();
    } else {
      spring.position = rubberBand(Math.max(0, dy));
      spring.velocity = velocity * 1000;
      spring.target = 0;
      spring.resetTime();

      activeSpringTask = (time) => {
        const pos = spring.update(time);
        card.style.transform = `translate3d(0, ${pos.toFixed(2)}px, 0)`;
        const targetY = Math.max(0, pos);
        const progress = Math.min(1, targetY / 320);
        document.body.style.setProperty('--app-scale', (0.965 + progress * 0.035).toFixed(4));
        document.body.style.setProperty('--app-offset', `${(8 - progress * 8).toFixed(2)}px`);
        document.body.style.setProperty('--app-brightness', (0.68 + progress * 0.32).toFixed(3));
        document.body.style.setProperty('--app-blur', `${(1.2 - progress * 1.2).toFixed(2)}px`);

        if (spring.isResting()) {
          MotionLayer.remove(activeSpringTask);
          activeSpringTask = null;
          card.classList.remove('is-physics-running');
          card.style.transform = 'translate3d(0,0,0)';
          resetAppDepth();
        }
      };
      MotionLayer.add(activeSpringTask);
    }
  }

  card.addEventListener('touchend', end);
  card.addEventListener('touchcancel', end);
}

function gcalUrl(title,at,details,allDay){
  var d=D(at); if(!d)return '#';
  var p=function(v){return ('0'+v).slice(-2)};
  var day=function(x){return x.getFullYear()+p(x.getMonth()+1)+p(x.getDate())};
  var dates;
  if(allDay){
    dates=day(d)+'/'+day(new Date(d.getTime()+86400000));
  }else{
    var f=function(x){return day(x)+'T'+p(x.getHours())+p(x.getMinutes())+'00'};
    dates=f(d)+'/'+f(new Date(d.getTime()+3600000));
  }
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+
    '&dates='+dates+'&ctz=Asia/Tokyo&details='+encodeURIComponent(details||'');
}

/* ============ 検索 ============ */
let searchTimer = 0;
let isComposingSearch = false;

function scheduleSearch(value) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function () {
    searchRun(value);
  }, 80);
}

function normalizeSearchText(value) {
  const text = String(value || '');
  return text.normalize ? text.normalize('NFKC').toLowerCase() : text.toLowerCase();
}

function openSearch(){
  if (!canOpenModal('search')) return;
  rememberDialogOpener();
  activeModalType = 'search';
  modalState = ModalState.OPENING;
  var box=document.getElementById('sheet');
  box.dataset.modalType = 'search';
  box.classList.add('modal-host');
  box.innerHTML='<div class="sheet spot" onclick="closeSheet(event)"><div class="spotbox" role="dialog" aria-modal="true" aria-label="会社を検索" tabindex="-1">'+
    '<input id="q" placeholder="会社名を入力" autocomplete="off" aria-label="会社名入力">'+
    '<div id="qres"></div></div></div>';
  
  modalOpened({ history: true });

  requestAnimationFrame(function(){
    var sh=box.querySelector('.sheet');
    if(sh) {
      sh.classList.add('is-active');
      modalState = ModalState.OPEN;
      const dialog = box.querySelector('[role="dialog"]');
      if (dialog) activateDialogFocus(dialog, { preservePreviousFocus: true });
    }
  });

  var q=document.getElementById('q');
  q.addEventListener('compositionstart', () => { isComposingSearch = true; });
  q.addEventListener('compositionend', () => { 
    isComposingSearch = false; 
    scheduleSearch(q.value);
  });
  q.addEventListener('input', function(){
    if (!isComposingSearch) scheduleSearch(q.value);
  });
  q.addEventListener('keydown', function(e){
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Enter') {
      var f = document.querySelector('#qres button');
      if (f) f.click();
    }
    if (e.key === 'Escape') requestSheetClose();
  });
  searchRun('');
}

function searchRun(v){
  var t = normalizeSearchText(v.trim());
  var L = DATA.items.filter(function(i){
    return !t || normalizeSearchText(i.c).indexOf(t) >= 0;
  }).slice(0, 8);
  
  document.getElementById('qres').innerHTML = L.length? L.map(function(it){
    return '<button type="button" data-action="pick-company" data-company="'+esc(it.c)+'" data-term="'+esc(it.term||'夏インターン')+'">'+
      logo(it,26)+'<span class="qn">'+esc(it.c)+'</span>'+
      '<span class="qs">'+esc(it.status||'')+' '+esc(it.stage||'')+'</span></button>';
  }).join('') : '<div class="qempty">見つかりません</div>';
}

function pick(co,term){
  suppressFocusReturn = true;
  pendingAfterSheetClose = function () {
    TERM = term;
    openCo = co;
    tab = 'info';
    scheduleRender(true);
    requestAnimationFrame(renderDetail);
  };

document.addEventListener('keydown', function(e){
  if (e.isComposing || e.keyCode === 229) return;
  const tag = e.target && e.target.tagName;
  const editing = /INPUT|TEXTAREA|SELECT/.test(tag);

  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    if (editing && !e.metaKey && !e.ctrlKey) return;
    e.preventDefault();
    if (modalState === ModalState.CLOSED) openSearch();

  if (e.key === 'Escape') {
    if (e.defaultPrevented) return;
    if (document.getElementById('sheet').innerHTML) requestSheetClose();
    else if (isWide() && openCo) closeSide();
  }
});

     t.closest('.stripitem') || t.closest('.tabbar') || t.closest('.chips') || t.closest('.seg')) return;
