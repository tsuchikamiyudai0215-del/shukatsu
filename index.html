<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>就活</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="就活">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#02050A">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<style>
/* ==========================================================================
   BLUE GLASS DESIGN SYSTEM & LAYOUT TOKENS (0% PURPLE)
   ========================================================================== */
:root {
  color-scheme: dark;
  --ink: #02050A;
  --navy-950: #040912;
  --navy-900: #07101D;
  --navy-850: #091728;
  --navy-800: #0B1C31;
  --blue-700: #123B67;
  --blue-600: #165A91;
  --blue-500: #0A84FF;
  --cyan-soft: #64D2FF;
  --steel-blue: #71859E;
  --text: #FFFFFF;
  --muted: #A2B4C8;
  --dim: #70849B;
  
  --go: #30D158;
  --wait: #FF9F0A;
  --hot: #FF453A;
  --fail: #70252A;

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);

  --hero-min-height: 230px;
  --segment-height: 56px;
  --chip-height: 46px;
  --row-min-height: 148px;

  --glass-radius-sm: 18px;
  --glass-radius-md: 24px;
  --glass-radius-lg: 32px;

  /* Deep Blue Ambient Mesh */
  --bg-mesh: 
    radial-gradient(115% 72% at 4% 0%, rgba(20,77,150,.34), transparent 58%),
    radial-gradient(95% 68% at 102% 14%, rgba(9,87,104,.20), transparent 60%),
    radial-gradient(115% 76% at 50% 100%, rgba(7,48,94,.28), transparent 68%),
    radial-gradient(75% 54% at 38% 58%, rgba(17,40,77,.20), transparent 72%),
    #02050A;

  --blur-card: 10px;
  --blur-chrome: 24px;
  --blur-sheet: 20px;
  --glass-saturation: 180%;

  --line: rgba(188,219,244,.28);
  --line-soft: rgba(188,219,244,.12);
  
  --glass-edge: 
    inset 0 1.5px 1px rgba(238,248,255,.64),
    inset 0 -1px 1px rgba(0,9,20,.72),
    0 12px 28px -12px rgba(0,0,0,.78),
    0 0 18px rgba(10,132,255,.08);

  --glass-drop-lg: 
    0 24px 58px rgba(0,0,0,.82),
    inset 0 1.5px 1px rgba(229,244,255,.66),
    inset 0 -1px 1px rgba(0,6,15,.72),
    0 0 24px rgba(10,132,255,.10);

  --apple-spring: cubic-bezier(0.16, 1, 0.3, 1);
  --apple-ease: cubic-bezier(0.25, 0.1, 0.25, 1);
  --apple-press: cubic-bezier(0.2, 0, 0, 1);
  --apple-pop: cubic-bezier(0.34, 1.56, 0.64, 1);
  --apple-bounce: cubic-bezier(0.18, 0.9, 0.32, 1.25);
  
  --disp: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
  --body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}

html.performance-high {
  --blur-card: 14px;
  --blur-chrome: 28px;
  --blur-sheet: 24px;
  --glass-saturation: 210%;
}
html.performance-lite {
  --blur-card: 0px;
  --blur-chrome: 14px;
  --blur-sheet: 10px;
  --glass-saturation: 140%;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;scrollbar-width:thin;scrollbar-color:rgba(188,219,244,.2) transparent}
*::-webkit-scrollbar{width:6px;height:6px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:rgba(188,219,244,.24);border-radius:999px}

html{
  background: var(--ink);
  -webkit-text-size-adjust:100%;
  scroll-padding-bottom:120px;
  scrollbar-gutter: stable;
}
body{
  overscroll-behavior-y:none;margin:0;background:transparent;color:var(--text);
  font-family:var(--body);font-variant-numeric:tabular-nums;
  padding:calc(20px + var(--safe-top)) calc(16px + var(--safe-right))
          calc(130px + var(--safe-bottom)) calc(16px + var(--safe-left));
  max-width:480px;margin:0 auto;
  position: relative;
  isolation: isolate;
}
button,select,input,textarea{font-family:var(--body)}
button:disabled { cursor: default; pointer-events: none; }
.tabbar{-webkit-user-select:none;user-select:none}

/* Focus Visible */
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .row:focus-visible, .hero:focus-visible {
  outline: 2px solid var(--blue-500);
  outline-offset: 3px;
}

/* Background Layers */
#ambientBackplate {
  position: fixed;
  inset: -4vh -4vw;
  pointer-events: none;
  z-index: 0;
  background-image: var(--bg-mesh);
  background-size: cover;
}

#globalSpecular {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  background: radial-gradient(circle 460px at 52% 18%, rgba(255,255,255,.045), transparent 72%);
}

#globalNoise {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  opacity: .014;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
}
html.performance-lite #globalNoise { display: none; }

#app, #side { position: relative; z-index: 3; }
#sheet { position: static; z-index: auto; }

/* GPU & Layer Primitives */
.tabbar, .seg, .sheet .card {
  will-change: transform;
  transform: translateZ(0);
  isolation: isolate;
}
.row-motion {
  contain: layout paint;
  content-visibility: auto;
  contain-intrinsic-size: 0 160px;
}
html.is-webkit .row-motion { content-visibility: visible; }

.row, .stripitem, .pcard, .card, .spotbox, .setupBox {
  position: relative;
}
.row::before, .stripitem::before, .pcard::before, .card::before, .spotbox::before, .setupBox::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  z-index: 0;
  background: radial-gradient(240px circle at var(--local-light-x, 50%) var(--local-light-y, 0%), rgba(255,255,255,.14), rgba(255,255,255,.03) 35%, transparent 68%);
  opacity: var(--local-light-opacity, .38);
}
.row > *, .stripitem > *, .pcard > *, .card > *, .spotbox > *, .setupBox > * {
  position: relative;
  z-index: 1;
}
.card > .sideclose { z-index: 5; width: 32px; height: 32px; }
.card > .sideclose::before { content: ""; position: absolute; inset: -6px; }

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:200;background:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  transition:opacity .35s var(--apple-ease),visibility .35s}
#splash.gone{opacity:0;visibility:hidden;pointer-events:none}
#splash .mark{font-size:28px;font-weight:700;letter-spacing:.26em;color:var(--text);padding-left:.26em}
#splash .rule{width:54px;height:1px;background:var(--line);position:relative;overflow:hidden}
#splash .rule::after{content:'';position:absolute;inset:0;background:var(--text);transform:translateX(-100%);animation:sweep 1.1s infinite}
#splash .sub{font-family:var(--mono);font-size:9px;letter-spacing:.3em;color:var(--dim)}

/* ---------- Segment Control ---------- */
.seg {
  touch-action: pan-y;
  position:relative;
  width: min(82vw, 360px);
  min-height: var(--segment-height);
  margin: 4px auto 26px;
  padding: 5px;
  border-radius: 34px;
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap: 2px;
  background: linear-gradient(180deg, rgba(137,169,198,.18), rgba(30,53,76,.08)), rgba(7,18,31,.88);
  border: 1px solid rgba(188,219,244,.40);
  box-shadow: inset 0 1.5px 1px rgba(235,247,255,.62), inset 0 -1px 1px rgba(0,5,13,.70), 0 12px 28px rgba(0,0,0,.54), 0 0 20px rgba(10,132,255,.07);
  -webkit-backdrop-filter: blur(var(--blur-chrome)) saturate(var(--glass-saturation)) brightness(1.1);
  backdrop-filter: blur(var(--blur-chrome)) saturate(var(--glass-saturation)) brightness(1.1);
  transition: transform .32s var(--apple-pop), background .3s var(--apple-ease);
}
.seg button {
  background:none;border:none;
  color: rgba(178,194,216,.65);
  font-size: 15px; font-weight: 600; letter-spacing: -.01em;
  padding: 10px 0; border-radius: 28px; cursor: pointer;
  display:inline-flex;align-items:center;justify-content:center;
  transition: color .2s var(--apple-ease), transform .18s var(--apple-spring);
}
.seg button:active { transform: scale(.95); }
.seg button.on, .seg button[aria-pressed="true"] { color: #06101B; font-weight: 700; }
.seg .sgn { font-family:var(--mono); font-size: 11px; margin-left: 8px; opacity: .75; }

.seg .pill, .tabbar .pill {
  position:absolute; z-index:0; pointer-events:none;
  border-radius: 28px;
  background: linear-gradient(180deg, #FFFFFF 0%, #EDF5FC 68%, #DCE8F2 100%);
  box-shadow: inset 0 1.5px 1px #FFFFFF, inset 0 -1px 1px rgba(50,75,96,.20), 0 5px 16px rgba(0,0,0,.40), 0 0 14px rgba(100,210,255,.12);
  transform: translate3d(0,0,0);
  will-change: transform, border-radius;
  overflow: hidden;
}
.seg .pill { left: 4px; top: 4px; height: calc(100% - 8px); width: calc((100% - 8px) / 2); }
.tabbar .pill { left: 5px; top: 5px; width: var(--pw); height: calc(100% - 10px); }

/* ---------- Hero ---------- */
.hero-parallax { min-height: var(--hero-min-height); }
.hero {
  min-height: var(--hero-min-height);
  padding: 4px 2px 34px;
  display: flex;
  flex-direction: column;
  border-bottom: 1px solid var(--line-soft);
  cursor: pointer;
}
.hero:active { transform: scale(.985); opacity: .88; }
.hero h1 { font-size: clamp(26px, 7.5vw, 34px); font-weight: 700; margin: 0; letter-spacing: -.02em; color: #fff; }
.lab { margin: 24px 0 8px; font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: .2em; text-transform: uppercase; }
.cd { line-height: 1; display: flex; align-items: baseline; margin-top: 14px; }
.cd b { font-family: var(--disp); font-size: 54px; font-weight: 600; letter-spacing: -.035em; color: #fff; }
.cd s { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: 0 10px 0 4px; text-decoration: none; }

/* ---------- Strip Items ---------- */
.strip { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0 6px; }
.stripitem {
  display: inline-flex; align-items: center; gap: 12px; width: 100%; max-width: 380px;
  text-align: left; cursor: pointer;
  background: linear-gradient(180deg, rgba(76,91,113,.42) 0%, rgba(29,52,78,.65) 50%, rgba(7,25,46,.88) 100%), rgba(8,17,29,.90);
  border: 1px solid rgba(190,220,255,.32); border-radius: var(--glass-radius-md); padding: 14px 18px; color: var(--text);
  box-shadow: var(--glass-edge);
  transition: transform .24s var(--apple-spring), opacity .2s var(--apple-ease);
}
.stripitem:active { transform: scale(.96); }
.stripitem .k { font-family: var(--mono); font-size: 9px; letter-spacing: .12em; color: var(--cyan-soft); border: 1px solid rgba(100,210,255,.3); border-radius: 6px; padding: 3px 7px; background: rgba(10,132,255,.12); }
.stripitem .n { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stripitem .d { margin-left: auto; font-family: var(--disp); font-size: 16px; font-weight: 600; }
.stripitem .w { font-family: var(--mono); font-size: 11px; color: var(--dim); }

/* ---------- Chips (Filter) ---------- */
.chips {
  position: sticky; top: var(--safe-top); z-index: 20;
  margin: 18px -16px 12px; padding: 10px 16px 14px;
  background: linear-gradient(180deg, rgba(2,5,10,.96) 0%, rgba(4,9,18,.82) 78%, transparent 100%);
}
.chiprow { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; padding: 2px 0 6px; }
.chiprow button {
  flex: 0 0 auto; min-height: var(--chip-height); padding: 0 19px; border-radius: 24px; font-size: 14px; font-weight: 500; cursor: pointer;
  display: flex; align-items: center; gap: 8px;
  background: linear-gradient(180deg, rgba(126,157,190,.14), rgba(22,42,64,.06)), rgba(8,19,33,.90);
  border: 1px solid rgba(171,205,236,.28); color: rgba(185,202,223,.72);
  box-shadow: inset 0 1px 1px rgba(220,239,255,.34), 0 6px 17px rgba(0,0,0,.36);
  transition: transform 220ms var(--apple-spring), opacity 160ms var(--apple-ease), color 160ms var(--apple-ease);
}
.chiprow button:active { transform: scale(.92); }
.chiprow button b { font-family: var(--disp); font-size: 16px; font-weight: 600; line-height: 1; }
.chiprow button.on {
  background: linear-gradient(180deg, #FFFFFF, #EAF3FA);
  color: #06101B;
  border-color: rgba(228,245,255,.92);
  box-shadow: inset 0 1.5px 1px #FFFFFF, 0 7px 18px rgba(0,0,0,.42), 0 0 16px rgba(100,210,255,.10);
}
.chiprow button.on b { color: #06101B; }

@keyframes popIn {
  0% { transform: scale(.94); opacity: .82; }
  68% { transform: scale(1.035); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}

/* ---------- Rows (Cards) & Motion ---------- */
.lane { margin-bottom: 8px; transition: opacity 180ms var(--apple-ease), transform 340ms var(--apple-spring); }
.lane.is-filt-hidden { display: none !important; }
.lane.is-filter-leaving { opacity: 0; transform: translate3d(0,-8px,0) scale(.985); pointer-events: none; }
.lane.is-filter-entering { animation: laneFilterIn 440ms var(--apple-spring) both; }

@keyframes laneFilterIn {
  0% { opacity: 0; transform: translate3d(0,18px,0) scale(.975); }
  64% { opacity: 1; transform: translate3d(0,-2px,0) scale(1.004); }
  100% { opacity: 1; transform: translate3d(0,0,0) scale(1); }
}

.row-motion { margin-bottom: 16px; }
.row-motion.is-staggered {
  animation: filterRowIn 460ms var(--apple-spring) both;
  animation-delay: calc(var(--filter-index, 0) * 28ms);
}
.row-motion.is-fast-enter { animation: fastRowFade 220ms var(--apple-ease) both; }

@keyframes filterRowIn {
  0% { opacity: 0; transform: translate3d(0, 18px, 0) scale(.965); }
  68% { opacity: 1; transform: translate3d(0, -2px, 0) scale(1.005); }
  100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
}
@keyframes fastRowFade { from { opacity: 0; } to { opacity: 1; } }

.row {
  --card-scale: 1;
  min-height: var(--row-min-height);
  border-radius: var(--glass-radius-lg);
  background: linear-gradient(180deg, rgba(76,91,113,.50) 0%, rgba(29,52,78,.76) 50%, rgba(7,25,46,.94) 100%), rgba(8,17,29,.94);
  border: 1px solid rgba(190,220,255,.36);
  box-shadow: var(--glass-edge);
  overflow: hidden; cursor: pointer;
  display: flex; flex-direction: column; justify-content: space-between;
  opacity: var(--base-op, 1);
  transform: scale(var(--card-scale));
  transition: transform .24s var(--apple-spring), border-color .2s var(--apple-ease), opacity .2s var(--apple-ease);
}
.row::after {
  content: ""; position: absolute; top: 0; left: 7%; right: 7%; height: 2px; border-radius: 999px;
  background: linear-gradient(90deg, transparent, rgba(226,243,255,.88), rgba(150,210,255,.54), transparent);
  opacity: .72; pointer-events: none;
}
.row:active { --card-scale: 0.965; }

.row.is-fixed {
  background: linear-gradient(180deg, rgba(48,209,88,.24) 0%, rgba(14,54,34,.74) 50%, rgba(6,30,18,.96) 100%), rgba(8,24,15,.94);
  border-color: rgba(48,209,88,.48);
  box-shadow: var(--glass-edge), 0 0 24px rgba(48,209,88,.20);
}
.row.is-offer {
  background: linear-gradient(180deg, rgba(48,209,88,.30) 0%, rgba(14,60,38,.80) 50%, rgba(6,35,20,.98) 100%), rgba(8,28,18,.96);
  border-color: rgba(48,209,88,.70);
  box-shadow: var(--glass-edge), 0 0 32px rgba(48,209,88,.28);
}
.row.is-muted { --base-op: 0.44; }

.row .main { padding: 24px 24px 18px; display: flex; align-items: center; gap: 20px; flex: 1 1 auto; }
.day { width: 62px; flex: 0 0 auto; text-align: center; }
.day b { font-family: var(--disp); font-size: 34px; font-weight: 600; letter-spacing: -.035em; line-height: 1; display: block; color: #fff; }
.day s { font-family: var(--mono); font-size: 9px; color: var(--muted); letter-spacing: .12em; margin-top: 4px; display: block; text-decoration: none; }
.day .tag { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; line-height: 1.5; }
.body1 { min-width: 0; flex: 1; }
.meta { display: flex; align-items: center; gap: 8px; }
.meta em { font-family: var(--mono); font-size: 12px; color: var(--muted); font-style: normal; letter-spacing: .04em; }
.meta i { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--dim); font-style: normal; }
.name { font-size: 17px; font-weight: 600; letter-spacing: -.01em; margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #fff; }
.sub { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 5px; }
.acts { display: flex; gap: 12px; padding: 0 24px 22px 106px; flex: 0 0 auto; }
.gh {
  background: rgba(255,255,255,.08); border: 1px solid rgba(188,219,244,.24); color: var(--muted);
  border-radius: 12px; padding: 7px 16px; font-size: 12px; font-weight: 500; cursor: pointer; text-decoration: none;
  display: inline-block; box-shadow: inset 0 1px 0 rgba(255,255,255,.3);
  transition: transform .2s var(--apple-spring), background .16s var(--apple-ease), color .16s var(--apple-ease);
}
.gh:active { transform: scale(.92); }

.logo { width: 30px; height: 30px; border-radius: 15px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #fff; box-shadow: 0 0 0 .5px rgba(0,0,0,.4); aspect-ratio: 1; }
.logo img { width: 78%; height: 78%; object-fit: contain; display: block; }
.logo.mono { background: rgba(255,255,255,.14); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.25); }
.logo.mono span { color: #EDEDF2; font-weight: 600; }

/* Accordion */
.accord-btn { width: 100%; background: none; border: none; text-align: left; cursor: pointer; padding: 0; color: var(--muted); }
.accord-chevron { display: inline-block; transition: transform 300ms var(--apple-spring); }
.lane.is-expanded .accord-chevron { transform: rotate(90deg); }

/* ---------- View Transitions ---------- */
#view { --view-direction: 1; }
#view.is-view-leaving { animation: viewLeave 140ms var(--apple-ease) both; }
#view.is-view-entering { animation: viewEnter 360ms var(--apple-spring) both; }

@keyframes viewLeave {
  to { opacity: 0; transform: translate3d(calc(var(--view-direction) * -12px), 0, 0) scale(.992); }
}
@keyframes viewEnter {
  from { opacity: 0; transform: translate3d(calc(var(--view-direction) * 16px), 0, 0) scale(.985); }
  70% { opacity: 1; transform: translate3d(0,0,0) scale(1.002); }
  to { opacity: 1; transform: translate3d(0,0,0) scale(1); }
}

/* ---------- Sheet / Modal / Spotbox (Blue Glass & Overscroll Locks) ---------- */
html.sheet-active, html.sheet-active body {
  overscroll-behavior: none;
  overscroll-behavior-y: none;
}
.sheet {
  position: fixed; inset: 0; height: 100vh; height: 100dvh;
  background: rgba(0,0,0, var(--sheet-dim, .52));
  -webkit-backdrop-filter: blur(8px) brightness(.82);
  backdrop-filter: blur(8px) brightness(.82);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 60;
  padding: 0 10px calc(10px + var(--safe-bottom));
  opacity: 0; pointer-events: none;
  overscroll-behavior: contain; overscroll-behavior-y: contain; touch-action: none;
  transition: opacity .26s var(--apple-ease);
  will-change: opacity; transform: translateZ(0);
}
.sheet.is-active { opacity: 1; pointer-events: auto; }

.card {
  position: relative; width: 100%; max-width: 480px;
  height: 85vh; height: 85dvh; display: flex; flex-direction: column; overflow: hidden;
  border-radius: 32px; border: 1px solid rgba(185,219,247,.34);
  background: linear-gradient(180deg, rgba(58,79,104,.78) 0%, rgba(17,36,57,.92) 44%, rgba(4,15,29,.98) 100%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  box-shadow: var(--glass-drop-lg);
  padding: 12px 22px calc(14px + var(--safe-bottom));
  transform: translate3d(0, 105%, 0);
  will-change: transform;
}
.is-physics-running { transition: none !important; }
.sheet .tab-pane { overscroll-behavior-y: contain; touch-action: pan-y; flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 32px; padding-right: 4px; }
.sheet .grab, .sheet .card-head { touch-action: none; flex: 0 0 auto; }
.grab { width: 44px; height: 5px; background: rgba(255,255,255,.32); border-radius: 3px; margin: 0 auto 16px; }
.sideclose {
  position: absolute; top: 16px; right: 16px; border-radius: 16px; border: 1px solid rgba(188,219,244,.24);

<script>
/* ==========================================================================
   TIME-BASED SPRING PHYSICS ENGINE
   ========================================================================== */
class Spring {
  constructor(options = {}) {
    this.position = options.position ?? 0;
    this.velocity = options.velocity ?? 0;
    this.target = options.target ?? 0;
    this.mass = options.mass ?? 1;
    this.stiffness = options.stiffness ?? 320;
    this.damping = options.damping ?? 30;
    this.lastTime = 0;
  }
  resetTime() { this.lastTime = 0; }
  update(time) {
    if (!Number.isFinite(time)) return this.position;
    if (!Number.isFinite(this.position) || !Number.isFinite(this.velocity) || !Number.isFinite(this.target)) {
      this.position = Number.isFinite(this.target) ? this.target : 0;
      this.velocity = 0;
      this.lastTime = time;
      return this.position;
    }
    if (!this.lastTime) { this.lastTime = time; return this.position; }
    let dt = (time - this.lastTime) / 1000;
    this.lastTime = time;
    dt = Math.min(dt, 1 / 30);
    const displacement = this.position - this.target;
    const springForce = -this.stiffness * displacement;
    const dampingForce = -this.damping * this.velocity;
    const acceleration = (springForce + dampingForce) / this.mass;
    this.velocity += acceleration * dt;
    this.velocity = Math.max(-6000, Math.min(6000, this.velocity));
    this.position += this.velocity * dt;
    return this.position;
  }
  isResting(pThresh = 0.1, vThresh = 0.1) {
    return Math.abs(this.target - this.position) < pThresh && Math.abs(this.velocity) < vThresh;
  }
}

const SPRING_PRESETS = Object.freeze({
  pill:       { mass: 1,   stiffness: 390, damping: 30 },
  sheet:      { mass: 1,   stiffness: 310, damping: 30 },
  soft:       { mass: 1,   stiffness: 230, damping: 27 },
  filter:     { mass: 0.9, stiffness: 340, damping: 28 },
  bounceBack: { mass: 1,   stiffness: 370, damping: 31 }
});

/* ==========================================================================
   MOTION ENGINE & LIFE CYCLE TASK SCHEDULER
   ========================================================================== */
const MotionLayer = (() => {
  const tasks = new Set();
  let frameId = 0;
  function tick(time) {
    const snapshot = Array.from(tasks);
    for (const task of snapshot) {
      try {
        task(time);
      } catch (error) {
        tasks.delete(task);
        console.error('Motion task failed', error);
      }

    if (tasks.size) {
      frameId = requestAnimationFrame(tick);
    } else {
      frameId = 0;
    }

  return {
    add(task) {
      if (tasks.size >= 8) return false;
      tasks.add(task);
      if (!frameId) frameId = requestAnimationFrame(tick);
      return true;
    },
    remove(task) { tasks.delete(task); },
    clear() {
      tasks.clear();
      if (frameId) { cancelAnimationFrame(frameId); frameId = 0; }
    },
    get size() { return tasks.size; }
  };
})();

function rubberBand(offset) { return offset / (1 + Math.abs(offset) / 300); }
function rubberClamp(value, min, max) {
  if (value < min) return min - rubberBand(min - value) * 0.24;
  if (value > max) return max + rubberBand(value - max) * 0.24;
  return value;
}

function readTranslateX(element) {
  const Matrix = window.DOMMatrixReadOnly || window.DOMMatrix || window.WebKitCSSMatrix;
  const transform = getComputedStyle(element).transform;
  if (!transform || transform === 'none') return 0;
  if (Matrix) {
    try { return new Matrix(transform).m41 || 0; } catch (e) {}
  }
  const match = transform.match(/matrix.*\((.+)\)/);
  if (!match) return 0;
  const v = match[1].split(',').map(Number);
  return v.length > 6 ? (v[12] || 0) : (v[4] || 0);
}

function readTranslateY(element) {
  const Matrix = window.DOMMatrixReadOnly || window.DOMMatrix || window.WebKitCSSMatrix;
  const transform = getComputedStyle(element).transform;
  if (!transform || transform === 'none') return 0;
  if (Matrix) {
    try { return new Matrix(transform).m42 || 0; } catch (e) {}
  }
  const match = transform.match(/matrix.*\((.+)\)/);
  if (!match) return 0;
  const v = match[1].split(',').map(Number);
  return v.length > 6 ? (v[13] || 0) : (v[5] || 0);

/* ==========================================================================
   PERFORMANCE, ADAPTIVE LIGHT & WARP ENGINES
   ========================================================================== */
const UA = navigator.userAgent;
const IS_WEBKIT = /AppleWebKit/.test(UA) && !/Chrome|Chromium|Edg/.test(UA);
const supportsCSS = window.CSS && typeof CSS.supports === 'function';
const CAN_BLUR = Boolean(supportsCSS && (CSS.supports('backdrop-filter', 'blur(10px)') || CSS.supports('-webkit-backdrop-filter', 'blur(10px)')));
const CAN_SVG_FILTER = Boolean(!IS_WEBKIT && supportsCSS && CSS.supports('filter', 'url(#liquidWarp)'));

document.documentElement.classList.toggle('can-blur', CAN_BLUR);
document.documentElement.classList.toggle('can-svg-warp', CAN_SVG_FILTER);

const saveDataMode = Boolean(navigator.connection && navigator.connection.saveData);

document.documentElement.classList.add('performance-' + performanceMode);

prefersReducedMotionQuery.addEventListener('change', e => {
  prefersReducedMotion = e.matches;
  if (prefersReducedMotion) {

    WarpEngine.destroy();

  return !prefersReducedMotion && !saveDataMode && !document.hidden;

let activeWarpOwner = null;
const canUseWarp = (performanceMode === 'high') && CAN_SVG_FILTER && !IS_WEBKIT;

const WarpEngine = (() => {
  let target = 0, current = 0, frameId = 0, lastTime = 0;

    } else {

      apply();
      frameId = 0;
      lastTime = 0;
    }

    set(v) {

   ========================================================================== */
let renderPending = false;
let isRendering = false;
let rerenderRequested = false;
let pendingPageChanged = false;
let pendingPillSyncMode = 'none';

function requestPillSync(mode) { pendingPillSyncMode = mode; }

function captureFocusState() {
  const active = document.activeElement;
  if (!active || active === document.body) return null;
  return {
    id: active.id || '',
    action: active.dataset ? active.dataset.action || '' : '',
    company: active.dataset ? active.dataset.company || '' : ''
  };
}

function restoreFocusState(s) {
  if (!s) return;
  let target = null;
  if (s.id) target = document.getElementById(s.id);
  if (!target && s.action) {
    target = document.querySelector(`[data-action="${CSS.escape(s.action)}"][data-company="${CSS.escape(s.company)}"]`);
  }
  if (target && target.focus) target.focus({ preventScroll: true });
}

function captureFormState(container) {
  if (!container) return null;
  const s = {};
  container.querySelectorAll('input[id],select[id],textarea[id]').forEach(f => {
    if (f.type !== 'password') s[f.id] = f.value;
  });
  return s;
}

function restoreFormState(container, s) {
  if (!container || !s) return;
  Object.keys(s).forEach(id => {
    const f = container.querySelector('#' + CSS.escape(id));
    if (f && document.activeElement !== f) f.value = s[id];
  });
}

function scheduleRender(pageChanged, reason) {
  pendingPageChanged = pendingPageChanged || Boolean(pageChanged);
  if (renderPending) return;
  renderPending = true;
  requestAnimationFrame(() => {
    const animate = pendingPageChanged;
    renderPending = false;
    pendingPageChanged = false;
    performRender(animate, reason);
  });
}

function performRender(pageChanged, reason) {
  if (isRendering) { rerenderRequested = true; return; }
  isRendering = true;
  const focusState = captureFocusState();
  const sidePanel = document.getElementById('side');
  const sideFormState = captureFormState(sidePanel);

  try {
    render(pageChanged);
  } catch (err) {
    console.error('Render failure', err);
    toast('表示の更新に失敗しました');
  } finally {
    isRendering = false;
  }

  if (sidePanel && sideFormState) restoreFormState(sidePanel, sideFormState);

  afterRender({
    pillSync: pendingPillSyncMode,
    focusState: focusState,
    reason: reason
  });
  pendingPillSyncMode = 'none';

  if (rerenderRequested) {
    rerenderRequested = false;
    scheduleRender(false);
  }
}

function afterRender(opt = {}) {
  requestAnimationFrame(() => {
    updateNavigationState();
    updateSeg();
    if (opt.pillSync !== 'preserve') {
      syncLiquidPills({ animate: opt.pillSync === 'animate' });
    }
    scheduleHeroTick();
    if (opt.focusState) restoreFocusState(opt.focusState);
  });
}

var LOGOS = {}, tried = {};

function runLogoQueue() {
  while (activeLogoJobs < logoConcurrency && logoQueue.length) {
    const job = logoQueue.shift();
    activeLogoJobs += 1;
    Promise.resolve().then(job).finally(() => {
      activeLogoJobs -= 1;

    });
  }
}

}

    x.stage=prev; x.status='対応中';

  },'apiPrevStage',[co,TERM,prev], prev+' に戻しました');

function doFail(co){

      'apiMarkFail',[co,TERM],'選考終了として記録しました');

function doStatus(co,st){

/* ============ 状態判定 ============ */
function stOf(it){
  var s=it.status||'';
  if(s==='見送り') return 'skip';
  if(s==='落選') return 'fail';
  if(s==='内定') return 'offer';
  if(s==='参加決定') return 'fixed';
  if(s==='結果待ち') return 'waiting';
  if(s==='対応中'&&it.due&&!rem(it.due)) return 'waiting';
  return 'todo';
}
function autoSent(it){return it.status==='対応中'&&it.due&&!rem(it.due)}

/* ============ 一覧・カード描画 ============ */
function dayCell(n,color,unit){
  if(n==='TODAY') return '<b style="font-size:22px;color:'+color+'">TODAY</b>';
  return '<b style="color:'+color+'">'+n+'</b><s>'+(unit||'DAYS')+'</s>';
}
function rowHtml(it){
  var st=stOf(it), r=it.due?rem(it.due):null, left='', right='', sub='';
  if(st==='waiting'){
    var d=since(it.since||(it.due?it.due.slice(0,10):null));
    left='<b style="font-size:32px;color:'+(d>=14?'var(--hot)':'var(--wait)')+'">'+(d==null?'—':d)+'</b><s>DAYS 経過</s>';
    right=it.since?fdate(it.since)+' 提出':'';
    if(autoSent(it)) sub='<div class="sub" style="color:var(--wait)">締切経過で自動送り</div>';
  } else if(st==='fixed'){
    var ev=nextEv(it.c), rr=ev?rem(ev.at):null;
    left=rr?dayCell(rr.d===0?'TODAY':rr.d,'var(--go)'):'<span class="tag" style="color:var(--go)">参加<br>決定</span>';
    right=ev?fdate(ev.at)+' 実施':(it.on?fdate(it.on)+' 確定':'');
  } else if(st==='offer'){
    left='<span class="tag" style="color:var(--go)">内定</span>';
    right=it.on?fdate(it.on):'';
  } else if(st==='fail'){
    left='<span class="tag" style="color:var(--dim)">終了</span>';
    right=it.on?fdate(it.on):'';
  } else if(st==='skip'){
    left='<span class="tag" style="color:var(--dim)">見送り</span>';
  } else if(r){
    left=dayCell(r.d===0?'TODAY':r.d, r.d<=2?'var(--hot)':'var(--text)');
    right=fdate(it.due);
    if(!it.timeUnset) sub='<div class="sub">締切 '+ftime(it.due)+'</div>';
  } else {
    left='<span class="tag" style="color:var(--dim)">未定</span>';
  }

  var acts='';
  if(st==='todo') acts='<div class="acts"><button class="gh" type="button" data-action="do-done" data-company="'+esc(it.c)+'">完了にする</button></div>';
  if(st==='waiting'){
    var rt=routeOf(it), last=rt.indexOf(it.stage)>=rt.length-2;
    acts='<div class="acts">'+
      '<button class="gh" type="button" style="border-color:rgba(48,209,88,.5);color:var(--go)" data-action="do-pass" data-company="'+esc(it.c)+'">'+(last?'内定':'通過')+'</button>'+
      '<button class="gh" type="button" data-action="confirm-fail" data-company="'+esc(it.c)+'">落選</button></div>';
  }

  var isMuted = (st==='fail'||st==='skip');
  return '<div class="row-motion"><div class="row'+(st==='fixed'?' is-fixed':st==='offer'?' is-offer':'')+(isMuted?' is-muted':'')+
    '" data-cardco="'+esc(it.c)+'" data-action="open-detail" data-company="'+esc(it.c)+'" tabindex="0" role="button" aria-label="'+esc(it.c)+'の詳細を開く">'+
    '<div class="main">'+
      '<div class="day">'+left+'</div>'+
      '<div class="body1"><div class="meta">'+logo(it,30)+
        '<em>'+esc(it.lost||it.stage)+'</em>'+
        (isCo(it)?'':'<em style="color:var(--dim);font-size:10px">管理用</em>')+
        '<i>'+right+'</i></div>'+
        '<div class="name">'+esc(it.c)+'</div>'+sub+
      '</div></div>'+acts+'</div></div>';
}
function eventRowHtml(ev){
  var it=byCo(ev.c)||{c:ev.c,dom:''}, r=rem(ev.at);
  return '<div class="row-motion"><div class="row" data-cardco="'+esc(ev.c)+'" data-action="open-detail" data-company="'+esc(ev.c)+'" tabindex="0" role="button" aria-label="'+esc(ev.c)+'の予定詳細を開く"><div class="main">'+
    '<div class="day">'+(r?dayCell(r.d===0?'TODAY':r.d, r.d<=2?'var(--hot)':'var(--text)'):'<span class="tag" style="color:var(--dim)">終了</span>')+'</div>'+

let filterTransitionToken = 0;
function setFilt(nextFilter) {
  const resolved = (FILT === nextFilter && nextFilter !== 'all') ? 'all' : nextFilter;
  if (resolved === FILT) return;
  const token = ++filterTransitionToken;

  const lanesBox = document.querySelector('.lanes');
  if (!lanesBox || !motionEffectsEnabled()) {
    FILT = resolved;
    animateFilterChip(resolved);
    scheduleRender(false);
    return;
  }

  const visibleLanes = Array.from(lanesBox.querySelectorAll('.lane:not(.is-filt-hidden)'));
  visibleLanes.forEach(l => l.classList.add('is-filter-leaving'));
  animateFilterChip(resolved);

  setTimeout(() => {
    if (token !== filterTransitionToken) return;
    FILT = resolved;
    scheduleRender(false);
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        if (token !== filterTransitionToken) return;
        playFilterEnterMotion();
      });
    });
  }, 130);
}

function animateFilterChip(target) {
  document.querySelectorAll('.chiprow button').forEach(b => {
    const on = (b.dataset.filt === target);
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', String(on));
    if (on && motionEffectsEnabled()) {
      b.style.animation = 'none';
      b.offsetHeight; // reflow
      b.style.animation = 'popIn .34s var(--apple-pop)';
    }
  });
}

function playFilterEnterMotion() {
  let rowIndex = 0;
  document.querySelectorAll('.lane:not(.is-filt-hidden)').forEach(lane => {
    lane.classList.remove('is-filter-leaving');
    lane.classList.add('is-filter-entering');
    lane.querySelectorAll('.row-motion').forEach(wrapper => {
      if (rowIndex < 12) {
        wrapper.style.setProperty('--filter-index', rowIndex);
        wrapper.classList.add('is-staggered');
      } else {
        wrapper.classList.add('is-fast-enter');
      }
      rowIndex++;
    });
  });
  setTimeout(() => {
    document.querySelectorAll('.lane').forEach(l => l.classList.remove('is-filter-entering'));
    document.querySelectorAll('.row-motion').forEach(w => {
      w.classList.remove('is-staggered', 'is-fast-enter');
      w.style.removeProperty('--filter-index');
    });
  }, 600);
}

/* ============ シート・モーダル・ジェスチャー制御 ============ */
let lockY = 0, pushed = false, locked = false;
let closingFromHistory = false;
let previousFocus = null;
let suppressFocusReturn = false;

function lockScroll(on) {
  if (on) {
    lockY = window.scrollY;
    document.body.style.position = 'fixed';
    document.body.style.top = `-${lockY}px`;
    document.body.style.left = '0';
    document.body.style.right = '0';
    document.body.style.width = '100%';
    return;
  }
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.left = '';
  document.body.style.right = '';
  document.body.style.width = '';
  window.scrollTo(0, lockY);
}

function resetAppDepth() {
  document.body.style.removeProperty('--app-scale');
  document.body.style.removeProperty('--app-offset');
  document.body.style.removeProperty('--app-brightness');
}

function setBackgroundInert(inert) {
  const elements = [
    document.getElementById('app'),
    document.getElementById('tabbar'),
    isWide() ? null : document.getElementById('side')
  ].filter(Boolean);

  elements.forEach(el => {
    if ('inert' in el) el.inert = inert;
    if (inert) el.setAttribute('aria-hidden', 'true');
    else el.removeAttribute('aria-hidden');
  });
}

function rememberDialogOpener() {
  previousFocus = document.activeElement;
}

function cancelSheetSpring(card) {
  if (card && card._sheetSpringTask) {
    MotionLayer.remove(card._sheetSpringTask);
    card._sheetSpringTask = null;
  }
}

function getFocusable(container) {
  const candidates = Array.from(
    container.querySelectorAll(
      'button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'
    )
  );
  return candidates.filter(el => {
    if (el.hidden || el.getAttribute('aria-hidden') === 'true' || el.closest('[inert]')) return false;
    const s = getComputedStyle(el);
    return s.display !== 'none' && s.visibility !== 'hidden' && el.getClientRects().length > 0;
  });
}

function primeDialogFocus(dialog) {
  if (!dialog) return;
  dialog.setAttribute('tabindex', '-1');
  dialog.focus({ preventScroll: true });
}

function activateDialogFocus(dialog, options = {}) {
  if (!options.preservePreviousFocus) {
    previousFocus = document.activeElement;
  }
  removeFocusTrap(dialog);

  const focusable = getFocusable(dialog);
  if (focusable.length) {
    focusable[0].focus({ preventScroll: true });
  } else {
    dialog.focus({ preventScroll: true });
  }

  dialog._focusTrap = function(e) {
    if (e.key !== 'Tab') return;
    const items = getFocusable(dialog);
    if (!items.length) { e.preventDefault(); dialog.focus(); return; }
    const first = items[0];
    const last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault(); last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault(); first.focus();
    }
  };
  dialog.addEventListener('keydown', dialog._focusTrap);
}

function removeFocusTrap(dialog) {
  if (dialog && dialog._focusTrap) {
    dialog.removeEventListener('keydown', dialog._focusTrap);
    delete dialog._focusTrap;
  }
}

function restorePreviousFocus() {
  if (suppressFocusReturn) {
    suppressFocusReturn = false;
    previousFocus = null;
    return;
  }
  if (!previousFocus || !previousFocus.isConnected) {
    previousFocus = document.getElementById('tb-list');
  }
  if (previousFocus && previousFocus.focus) {
    previousFocus.focus({ preventScroll: true });
  }
  previousFocus = null;
}

function modalOpened(options = {}) {
  const useHistory = options.history !== false;
  if (!locked) {
    locked = true;
    lockScroll(true);
  }
  document.documentElement.classList.add('sheet-active');
  document.body.classList.add('sheet-open');
  setBackgroundInert(true);
  if (useHistory && !pushed) {
    pushed = true;
    history.pushState({ sheet: 1, owner: 'jobhunt-ui', modal: activeModalType }, '');
  }
}

function resetModalState() {
  const box = document.getElementById('sheet');
  if (box) {
    const dialog = box.querySelector('[role="dialog"]');
    if (dialog) removeFocusTrap(dialog);
    box.innerHTML = '';
    box.classList.remove('modal-host');
    delete box.dataset.modalType;
  }
  setBackgroundInert(false);
  resetAppDepth();
  document.documentElement.classList.remove('sheet-active');
  document.body.classList.remove('sheet-open');
  modalState = ModalState.CLOSED;
  activeModalType = null;
  closingFromHistory = false;
  if (locked) {
    locked = false;
    lockScroll(false);
  }
}

function finalizeSheetClose(options = {}) {
  const clearSelection = options.clearSelection !== false;
  const box = document.getElementById('sheet');
  if (box) {
    const dialog = box.querySelector('[role="dialog"]');
    if (dialog) removeFocusTrap(dialog);
    box.innerHTML = '';
    box.classList.remove('modal-host');
    delete box.dataset.modalType;
  }
  document.documentElement.classList.remove('sheet-active');
  document.body.classList.remove('sheet-open');
  resetAppDepth();
  setBackgroundInert(false);
  if (clearSelection) openCo = null;
  modalState = ModalState.CLOSED;
  activeModalType = null;
  closingFromHistory = false;
  if (locked) {
    locked = false;
    lockScroll(false);
  }
  restorePreviousFocus();

  if (pendingAfterSheetClose) {
    const next = pendingAfterSheetClose;
    pendingAfterSheetClose = null;
    requestAnimationFrame(next);
  }
}

function animateSheetOpen(card) {
  cancelSheetSpring(card);
  const height = Math.max(card.offsetHeight, (window.visualViewport ? window.visualViewport.height : window.innerHeight) * 0.85);
  const spring = new Spring({
    ...SPRING_PRESETS.sheet,
    position: height,
    target: 0,
    velocity: -60
  });
  spring.resetTime();
  card.classList.add('is-physics-running');
  card.style.transform = `translate3d(0, ${height.toFixed(2)}px, 0) scale(.975)`;

  const task = function(time) {
    const y = spring.update(time);
    const progress = 1 - Math.min(1, Math.max(0, y / height));
    const scale = 0.975 + progress * 0.025;
    card.style.transform = `translate3d(0, ${Math.max(0, y).toFixed(2)}px, 0) scale(${scale.toFixed(4)})`;

    if (spring.isResting()) {
      MotionLayer.remove(task);
      card._sheetSpringTask = null;
      card.classList.remove('is-physics-running');
      card.style.transform = 'translate3d(0,0,0)';
      modalState = ModalState.OPEN;
      activateDialogFocus(card, { preservePreviousFocus: true });
    }
  };
  card._sheetSpringTask = task;
  MotionLayer.add(task);
}

function requestSheetClose() {
  if (modalState === ModalState.CLOSING || modalState === ModalState.CLOSED) return;
  if (!isWide() && pushed && !closingFromHistory) {
    closingFromHistory = true;
    history.back();
    return;
  }
  closeOverlay();
}

function closeOverlay() {
  if (modalState === ModalState.CLOSING || modalState === ModalState.CLOSED) return;
  modalState = ModalState.CLOSING;
  
  var box = document.getElementById('sheet');
  var sh = box && box.querySelector('.sheet');
  var dialog = sh && sh.querySelector('[role="dialog"]');
  var card = sh && sh.querySelector('.card');

  if (!sh) {
    finalizeSheetClose();
    return;
  }

  if (dialog) removeFocusTrap(dialog);
  cancelSheetSpring(card);
  sh.classList.remove('is-active');
  document.body.classList.remove('sheet-open');
  resetAppDepth();

  if (card) {
    card.classList.remove('is-physics-running');
    card.style.transition = 'transform 230ms var(--apple-spring)';
    card.style.transform = 'translate3d(0, 105%, 0) scale(.98)';
  }

  setTimeout(function() {
    finalizeSheetClose();
  }, 240);
}

function closeSide(){ openCo=null; sideEmpty(); }
function closeDetail(){
  if(isWide()){ closeSide(); return; }
  requestSheetClose();
}
function closeSheet(e){
  if(e && e.target !== e.currentTarget) return;
  var box = document.getElementById('sheet');
  if(box && box.innerHTML){
    requestSheetClose();
    return;
  }
  if(isWide()) closeSide();
}

window.addEventListener('popstate', function() {
  pushed = false;
  closingFromHistory = false;
  const box = document.getElementById('sheet');
  if (box && box.innerHTML) {
    closeOverlay();
  }
});

/* ==========================================================================
   HIGH-FIDELITY SHEET TOUCH GESTURE (PULL TO REFRESH PROOF)
   ========================================================================== */
function bindSheetGesture(card, sheet){
  if (!card || !sheet || card._bound) return;
  card._bound = true;

  let y0 = 0, startX = 0, lastY = 0, lastT = 0, velocity = 0, dy = 0;
  let active = false, tracking = false;
  let gestureAxis = null;
  let activeSpringTask = null;
  let baseTranslateY = 0;
  let sheetGestureFrame = 0;
  let pendingSheetY = 0;
  let pendingSheetProgress = 0;

  const spring = new Spring(SPRING_PRESETS.sheet);

  function getScrollTop(){
    var pane = card.querySelector('.tab-pane');
    return pane ? pane.scrollTop : card.scrollTop;
  }

  function renderSheetGesture() {
    sheetGestureFrame = 0;
    card.style.transform = `translate3d(0, ${pendingSheetY.toFixed(2)}px, 0)`;
    document.body.style.setProperty('--app-scale', (.965 + pendingSheetProgress * .035).toFixed(4));
    document.body.style.setProperty('--app-offset', (8 - pendingSheetProgress * 8).toFixed(2) + 'px');
  }

  card.addEventListener('touchstart', function(e){
    if (e.touches.length !== 1) return;
    const target = e.target;
    const editing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    const startedOnGrab = target.closest('.grab');
    if (editing && !startedOnGrab) return;

    const interactive = target.closest('button,a,input,select,textarea,.tabs');
    if (interactive && !startedOnGrab) return;

    cancelSheetSpring(card);
    if (activeSpringTask) {
      MotionLayer.remove(activeSpringTask);
      activeSpringTask = null;
    }

    baseTranslateY = Math.max(0, readTranslateY(card));
    y0 = lastY = e.touches[0].clientY;
    startX = e.touches[0].clientX;
    lastT = performance.now();
    velocity = 0;
    dy = 0;
    active = false;
    tracking = true;
    gestureAxis = null;
  }, {passive:true});

  card.addEventListener('touchmove', function(e){
    if (!tracking || e.touches.length !== 1) return;
    const cy = e.touches[0].clientY;
    const cx = e.touches[0].clientX;
    const now = performance.now();
    const dt = Math.max(1, now - lastT);
    const instantV = (cy - lastY) / dt;
    velocity = velocity * 0.72 + instantV * 0.28;
    lastY = cy;
    lastT = now;
    const vdy = cy - y0;
    const vdx = cx - startX;

    const absX = Math.abs(vdx);
    const absY = Math.abs(vdy);

    if (!gestureAxis) {
      if (absX < 3 && absY < 3) return;
      gestureAxis = absY > absX * 1.08 ? 'y' : 'x';
    }
    if (gestureAxis === 'x') { tracking = false; return; }

    const st = getScrollTop();
    if (st <= 0 && vdy > 0 && e.cancelable) {
      e.preventDefault();
    }

    if (!active) {
      if (st > 0) { y0 = cy; lastY = cy; lastT = now; velocity = 0; return; }
      if (vdy > 2) {
        active = true;
        card.classList.add('is-physics-running');
      } else {
        return;
      }
    }

    if (active) {
      dy = vdy;
      const targetY = baseTranslateY + rubberBand(Math.max(0, dy));
      pendingSheetY = targetY;
      pendingSheetProgress = Math.min(1, targetY / 320);

      if (!sheetGestureFrame) {
        sheetGestureFrame = requestAnimationFrame(renderSheetGesture);
      }
      if (e.cancelable) e.preventDefault();
    }
  }, {passive:false});

  function end(){
    if (!tracking) return;
    tracking = false;
    if (sheetGestureFrame) {
      cancelAnimationFrame(sheetGestureFrame);
      sheetGestureFrame = 0;
    }
    if (!active) {
      card.classList.remove('is-physics-running');
      return;
    }
    active = false;

    const displayedY = baseTranslateY + rubberBand(Math.max(0, dy));
    const projected = displayedY + velocity * 240;
    const fastSwipe = velocity > 0.55;
    const farEnough = displayedY > Math.min(170, card.offsetHeight * 0.24);
    let dismiss = (fastSwipe || farEnough || projected > card.offsetHeight * 0.32);
    if (velocity < -0.08) dismiss = false;

    if (dismiss) {
      card.classList.remove('is-physics-running');
      requestSheetClose();
    } else {
      spring.position = displayedY;
      spring.velocity = velocity * 1000;
      spring.target = 0;
      spring.resetTime();

      activeSpringTask = (time) => {
        const pos = spring.update(time);
        card.style.transform = `translate3d(0, ${pos.toFixed(2)}px, 0)`;
        const targetY = Math.max(0, pos);
        const progress = Math.min(1, targetY / 320);
        document.body.style.setProperty('--app-scale', (.965 + progress * .035).toFixed(4));
        document.body.style.setProperty('--app-offset', `${(8 - progress * 8).toFixed(2)}px`);

        if (spring.isResting()) {
          MotionLayer.remove(activeSpringTask);
          activeSpringTask = null;
          card.classList.remove('is-physics-running');
          card.style.transform = 'translate3d(0,0,0)';
          resetAppDepth();
        }
      };
      MotionLayer.add(activeSpringTask);
    }
  }

  card.addEventListener('touchend', end);
  card.addEventListener('touchcancel', end);
}

/* ============ 詳細タブ ============ */
function switchTab(nextTab){
  if (nextTab === tab) return;
  var root = isWide() ? document.getElementById('side') : document.getElementById('sheet');
  if(!root) return;

  var tabs = root.querySelectorAll('.tabs button');
  Array.prototype.forEach.call(tabs, function(b) {
    const selected = (b.getAttribute('data-tab') === nextTab);
    b.classList.toggle('on', selected);
    b.setAttribute('aria-selected', String(selected));
    b.setAttribute('tabindex', selected ? '0' : '-1');
  });

  const pane = root.querySelector('.tab-pane');
  if (!pane || !motionEffectsEnabled()) {
    tab = nextTab;
    var it = byCo(openCo);
    if (it && pane) pane.innerHTML = renderTabContent(it);
    return;
  }

  pane.classList.add('is-tab-leaving');
  setTimeout(() => {
    tab = nextTab;
    var it = byCo(openCo);
    if (it) pane.innerHTML = renderTabContent(it);
    pane.classList.remove('is-tab-leaving');
    pane.classList.add('is-tab-entering');
    setTimeout(() => pane.classList.remove('is-tab-entering'), 300);
  }, 90);
}

function gcalUrl(title,at,details,allDay){
  var d=D(at); if(!d)return '#';
  var p=function(v){return ('0'+v).slice(-2)};
  var day=function(x){return x.getFullYear()+p(x.getMonth()+1)+p(x.getDate())};
  var dates;
  if(allDay){
    dates=day(d)+'/'+day(new Date(d.getTime()+86400000));
  }else{
    var f=function(x){return day(x)+'T'+p(x.getHours())+p(x.getMinutes())+'00'};
    dates=f(d)+'/'+f(new Date(d.getTime()+3600000));
  }
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+
    '&dates='+dates+'&ctz=Asia/Tokyo&details='+encodeURIComponent(details||'');
}

/* ============ 検索 ============ */
let searchTimer = 0;
let isComposingSearch = false;

function scheduleSearch(value) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function () {
    searchRun(value);
  }, 80);
}

function normalizeSearchText(value) {
  const text = String(value || '');
  return text.normalize ? text.normalize('NFKC').toLowerCase() : text.toLowerCase();
}

function openSearch(){
  if (!canOpenModal()) return;
  rememberDialogOpener();
  activeModalType = 'search';
  modalState = ModalState.OPENING;
  var box=document.getElementById('sheet');
  box.dataset.modalType = 'search';
  box.classList.add('modal-host');
  box.innerHTML='<div class="sheet spot" onclick="closeSheet(event)"><div class="spotbox" role="dialog" aria-modal="true" aria-label="会社を検索" tabindex="-1">'+
    '<input id="q" placeholder="会社名を入力" autocomplete="off" aria-label="会社名入力">'+
    '<div id="qres"></div></div></div>';
  
  modalOpened({ history: true });

  requestAnimationFrame(function(){
    var sh=box.querySelector('.sheet');
    if(sh) {
      sh.classList.add('is-active');
      modalState = ModalState.OPEN;
      const dialog = box.querySelector('[role="dialog"]');
      if (dialog) activateDialogFocus(dialog, { preservePreviousFocus: true });
    }
  });

  var q=document.getElementById('q');
  q.addEventListener('compositionstart', () => { isComposingSearch = true; });
  q.addEventListener('compositionend', () => { 
    isComposingSearch = false; 
    scheduleSearch(q.value);
  });
  q.addEventListener('input', function(){
    if (!isComposingSearch) scheduleSearch(q.value);
  });
  q.addEventListener('keydown', function(e){
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Enter') {
      var f = document.querySelector('#qres button');
      if (f) f.click();
    }
    if (e.key === 'Escape') requestSheetClose();
  });
  searchRun('');
}

function searchRun(v){
  var t = normalizeSearchText(v.trim());
  var L = DATA.items.filter(function(i){
    return !t || normalizeSearchText(i.c).indexOf(t) >= 0;
  }).slice(0, 8);
  
  document.getElementById('qres').innerHTML = L.length? L.map(function(it, idx){
    return '<button type="button" style="--result-index:'+idx+'" data-action="pick-company" data-company="'+esc(it.c)+'" data-term="'+esc(it.term||'夏インターン')+'">'+
      logo(it,26)+'<span class="qn">'+esc(it.c)+'</span>'+
      '<span class="qs">'+esc(it.status||'')+' '+esc(it.stage||'')+'</span></button>';
  }).join('') : '<div class="qempty">見つかりません</div>';
}

function pick(co,term){
  suppressFocusReturn = true;
  pendingAfterSheetClose = function () {
    TERM = term;
    openCo = co;
    tab = 'info';
    scheduleRender(true);
    requestAnimationFrame(renderDetail);
  };
  requestSheetClose();
}

document.addEventListener('keydown', function(e){
  if (e.isComposing || e.keyCode === 229) return;
  const tag = e.target && e.target.tagName;
  const editing = /INPUT|TEXTAREA|SELECT/.test(tag);

  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    if (editing && !e.metaKey && !e.ctrlKey) return;
    e.preventDefault();
    if (modalState === ModalState.CLOSED) openSearch();
  }
  if (e.key === 'Escape') {
    if (e.defaultPrevented) return;
    if (document.getElementById('sheet').innerHTML) requestSheetClose();
    else if (isWide() && openCo) closeSide();
  }
});

document.addEventListener('click', function(e){
  if (!isWide() || !openCo) return;
  if (document.getElementById('sheet').innerHTML) return;
  var t = e.target;
  if (t.closest('#side') || t.closest('.row') || t.closest('.hero') ||
     t.closest('.stripitem') || t.closest('.tabbar') || t.closest('.chips') || t.closest('.seg')) return;
  closeSide();
});

/* ==========================================================================
   LIQUID PILL PHYSICS CONTROLLER
   ========================================================================== */
let liquidSelectionHost = null;

function attachLiquid(host, ids, onPick, isActive){
  if (!host || host._liquid) return;
  host._liquid = true;
  var pill = host.querySelector('.pill');
  if (!pill) return;

  var press = 0, lifted = false, startX = 0, startY = 0, lastX = 0;
  var startVisualX = 0, originLeft = 0;
  var pointerId = null;

  let velocity = 0;
  let accel = 0;
  let lastPos = 0;
  let lastVelocity = 0;
  let lastMoveTime = 0;

  let suppressClick = false;
  let dragDistance = 0;
  let activeSpringTask = null;

  let cachedHostRect = null;
  let cachedPillWidth = 0;
  let dropping = false;
  let cachedTargets = [];

  const spring = new Spring(SPRING_PRESETS.pill);

  function btns(){
    return ids.map(id => document.getElementById(id)).filter(Boolean);
  }

  function getActiveIndex(){
    var bList = btns();
    for (var i = 0; i < bList.length; i++){
      if (isActive(i)) return i;
    }
    return 0;
  }

  function refreshTargets(){
    originLeft = pill.offsetLeft || 0;
    const pillWidth = pill.offsetWidth || 1;
    cachedTargets = btns().map(b => {
      const center = b.offsetLeft + b.offsetWidth * 0.5;
      return center - pillWidth * 0.5 - originLeft;
    });
    return cachedTargets;
  }

  function cancelActiveSpring() {
    if (activeSpringTask) {
      MotionLayer.remove(activeSpringTask);
      activeSpringTask = null;
    }
  }

  function movePillToIndex(index, animate) {
    const targets = refreshTargets();
    if (targets[index] === undefined) return;
    const targetX = targets[index];
    cancelActiveSpring();

    if (!animate || prefersReducedMotion) {
      spring.position = targetX;
      spring.target = targetX;
      spring.velocity = 0;
      pill.style.transform = `translate3d(${targetX.toFixed(2)}px, 0, 0)`;
      pill.style.borderRadius = "28px";
      return;
    }

    const visualX = readTranslateX(pill);
    spring.position = Number.isFinite(visualX) ? visualX : targetX;
    spring.target = targetX;
    spring.resetTime();
    const taskStart = performance.now();

    activeSpringTask = (time) => {
      const pos = spring.update(time);
      pill.style.transform = `translate3d(${pos.toFixed(2)}px, 0, 0)`;
      pill.style.borderRadius = "28px";
      if (spring.isResting() || (time - taskStart > 1500)) {
        MotionLayer.remove(activeSpringTask);
        activeSpringTask = null;
        pill.style.transform = `translate3d(${targetX.toFixed(2)}px, 0, 0)`;
      }
    };
    MotionLayer.add(activeSpringTask);
  }

  function scheduleClickSuppressionReset() {
    setTimeout(() => { suppressClick = false; }, 50);
  }

  function lift(){
    lifted = true;
    activeWarpOwner = host;
    cancelActiveSpring();
    host.classList.add('lifted', 'grabbing');
    cachedHostRect = host.getBoundingClientRect();
    cachedPillWidth = pill.offsetWidth || 1;
    refreshTargets();
    var curIdx = getActiveIndex();
    startVisualX = cachedTargets[curIdx] !== undefined ? cachedTargets[curIdx] : 0;
    lastPos = startVisualX;
    lastVelocity = 0;
    lastMoveTime = performance.now();
    haptic(10);
  }

  function renderMove(){
    if (!lifted || !cachedTargets.length) return;
    var minX = cachedTargets[0];
    var maxX = cachedTargets[cachedTargets.length - 1];

    var deltaX = lastX - startX;
    var rawPos = startVisualX + deltaX;
    var curPos = rubberClamp(rawPos, minX, maxX);

    const now = performance.now();
    const dt = Math.max(1, now - lastMoveTime);
    const nextV = (curPos - lastPos) / dt;
    accel = (nextV - lastVelocity) / dt;
    velocity = nextV;
    lastVelocity = nextV;
    lastPos = curPos;
    lastMoveTime = now;

    const speed = Math.abs(velocity);
    const stretch = Math.min(0.32, speed * 0.16);
    const sx = 1 + stretch;
    const sy = 1 - stretch * 0.5;

    if (activeWarpOwner === host) {
      const warp = Math.min(36, 6 + speed * 14 + Math.min(12, Math.abs(accel) * 500) + stretch * 18);
      WarpEngine.set(warp);
    }

    const radius = 24 - stretch * 12;
    pill.style.borderRadius = radius + "px";

    const tilt = prefersReducedMotion ? 0 : Math.max(-1.2, Math.min(1.2, velocity * 0.8));
    pill.style.transform = `translate3d(${curPos.toFixed(2)}px,0,0) rotateZ(${tilt.toFixed(2)}deg) scaleX(${sx.toFixed(3)}) scaleY(${sy.toFixed(3)})`;

    if (cachedHostRect && cachedHostRect.width > 0) {
      const relX = lastX - cachedHostRect.left;
      host.style.setProperty('--hx', Math.max(0, Math.min(100, (relX / cachedHostRect.width) * 100)).toFixed(0) + '%');
    }
  }

  function drop(){
    if (dropping) return;
    dropping = true;
    clearTimeout(press);

    const wasLifted = lifted;
    lifted = false;
    const capturedPointerId = pointerId;
    pointerId = null;

    host.classList.remove('lifted', 'grabbing');
    if (activeWarpOwner === host) {
      activeWarpOwner = null;
      WarpEngine.reset();
    }
    cachedHostRect = null;

    if (capturedPointerId !== null) {
      try { host.releasePointerCapture(capturedPointerId); } catch (e) {}
    }

    if (!wasLifted) {
      scheduleClickSuppressionReset();
      dropping = false;
      return;
    }

    var targets = cachedTargets;
    var rawFinalX = startVisualX + (lastX - startX);
    var best = 0, bestDist = 1e9;
    targets.forEach((tx, i) => {
      var d = Math.abs(tx - rawFinalX);
      if (d < bestDist) { bestDist = d; best = i; }
    });

    liquidSelectionHost = host;
    if (!isActive(best)) onPick(best);
    requestAnimationFrame(() => { liquidSelectionHost = null; });

    movePillToIndex(best, true);
    scheduleClickSuppressionReset();
    dropping = false;
  }

  function onPointerDown(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (pointerId !== null && pointerId !== e.pointerId) return;
    startX = lastX = e.clientX;
    startY = e.clientY;
    pointerId = e.pointerId;
    dragDistance = 0;
    suppressClick = false;
    try { host.setPointerCapture(e.pointerId); } catch (err) {}
    clearTimeout(press);
    press = setTimeout(lift, 200);
  }

  function onPointerMove(e) {
    if (pointerId !== null && e.pointerId !== pointerId) return;
    lastX = e.clientX;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    const horizontalGesture = Math.abs(dx) > Math.abs(dy) * 1.15;
    dragDistance = Math.max(dragDistance, Math.abs(dx));

    if (!lifted) {
      if (Math.abs(dy) > 8 || Math.abs(dx) > 8) clearTimeout(press);
      if (horizontalGesture && Math.abs(dx) > 8) suppressClick = true;
      return;
    }
    suppressClick = true;
    e.preventDefault();
    renderMove();
  }

  function onPointerUp(e) {
    if (pointerId !== null && e.pointerId !== pointerId) return;
    drop();
  }
  function onLostPointerCapture() {
    if (dropping) return;
    clearTimeout(press);
    if (lifted) drop();
  }
  function onClickCapture(e) {
    if (suppressClick) {
      e.preventDefault();
      e.stopImmediatePropagation();
    }
  }
  function onContextMenu(e) { e.preventDefault(); }
  function onSelectStart(e) { e.preventDefault(); }

  host.addEventListener('click', onClickCapture, true);
  host.addEventListener('contextmenu', onContextMenu);
  host.addEventListener('selectstart', onSelectStart);
  host.addEventListener('pointerdown', onPointerDown);
  host.addEventListener('pointermove', onPointerMove, { passive: false });
  host.addEventListener('pointerup', onPointerUp);
  host.addEventListener('pointercancel', onPointerUp);
  host.addEventListener('lostpointercapture', onLostPointerCapture);

  if ('ResizeObserver' in window) {
    const ro = new ResizeObserver(() => movePillToIndex(getActiveIndex(), false));
    ro.observe(host);
    host._liquidResizeObserver = ro;
  }

  host._liquidController = {
    moveTo(idx, anim) { movePillToIndex(idx, anim); },
    cancel() { cancelActiveSpring(); if(lifted) drop(); },
    destroy() {
      cancelActiveSpring();
      clearTimeout(press);
      if (host._liquidResizeObserver) {
        host._liquidResizeObserver.disconnect();
        delete host._liquidResizeObserver;
      }
      host.removeEventListener('pointerdown', onPointerDown);
      host.removeEventListener('pointermove', onPointerMove);
      host.removeEventListener('pointerup', onPointerUp);
      host.removeEventListener('pointercancel', onPointerUp);
      host.removeEventListener('lostpointercapture', onLostPointerCapture);
      host.removeEventListener('click', onClickCapture, true);
      host.removeEventListener('contextmenu', onContextMenu);
      host.removeEventListener('selectstart', onSelectStart);
      host._liquid = false;
      delete host._liquidController;
    }
  };

  requestAnimationFrame(() => {
    refreshTargets();
    const curIdx = getActiveIndex();
    if (cachedTargets[curIdx] !== undefined) movePillToIndex(curIdx, false);
  });
}

function syncLiquidPills(opt = {}) {
  const anim = opt.animate !== false;
  const tabHost = document.getElementById('tabbar');
  if (tabHost && tabHost._liquidController) tabHost._liquidController.moveTo(PAGE === 'list' ? 0 : 1, anim);
  const segHost = document.getElementById('seg');
  if (segHost && segHost._liquidController) segHost._liquidController.moveTo(TERMS.indexOf(TERM), anim);
}

function initLiquid(){
  attachLiquid(document.getElementById('tabbar'), ['tb-list','tb-pass'],
    i => setPage(i===0?'list':'pass'),
    i => (i===0) === (PAGE==='list'));
  attachLiquid(document.getElementById('seg'), ['sg0','sg1'],
    i => setTerm(TERMS[i]),
    i => TERM===TERMS[i]);
}

/* ============ 記録 ============ */
function tally(){
  var t={};
  var bump=function(s,k){if(!t[s])t[s]={p:0,f:0,w:0};t[s][k]++};
  ITEMS().forEach(function(it){
    if(!isCo(it))return;
    var r=routeOf(it),cur=it.lost||it.stage,i=r.indexOf(cur),st=stOf(it);
    if(st==='skip')return;
    if(i<0){bump(cur, st==='fail'?'f':(st==='offer'||st==='fixed')?'p':'w');return}
    for(var k=0;k<i;k++)bump(r[k],'p');
    if(st==='fail')bump(cur,'f');
    else if(st==='offer'||st==='fixed')bump(cur,'p');
    else bump(cur,'w');
  });
  return t;
}
function renderPassport(pageChanged){
  var t=tally();
  var order=DEFAULT_ROUTE.concat(PALETTE.filter(function(p){return DEFAULT_ROUTE.indexOf(p)<0}));
  var rows=order.filter(function(s){return t[s]});
  var max=1; rows.forEach(function(s){max=Math.max(max,t[s].p+t[s].f+t[s].w)});

  var LIST=ITEMS().filter(isCo);
  var live=LIST.filter(function(i){return ['todo','waiting','fixed','offer'].indexOf(stOf(i))>=0});
  var fails=LIST.filter(function(i){return stOf(i)==='fail'});
  var entered=LIST.filter(function(i){return stOf(i)!=='skip'});
  var skipped=LIST.filter(function(i){return stOf(i)==='skip'});
  var passes=0; rows.forEach(function(s){passes+=t[s].p});

  var worst=null;
  rows.forEach(function(s){ if(!worst||t[s].f>t[worst].f) worst=s });

  var waits=LIST.filter(function(i){return stOf(i)==='waiting'})
    .map(function(i){return {c:i.c, d:since(i.since||(i.due?i.due.slice(0,10):null))||0}})
    .sort(function(a,b){return b.d-a.d});
  var avg=waits.length?Math.round(waits.reduce(function(a,b){return a+b.d},0)/waits.length):0;

  var deepest='—';
  LIST.forEach(function(it){
    var r=routeOf(it), i=r.indexOf(it.lost||it.stage);
    if(i<0)return;
    if(order.indexOf(r[i])>order.indexOf(deepest)) deepest=r[i];
  });

  var cA=[], cB=[];

  cA.push('<div class="pcard po1" style="background:linear-gradient(155deg,rgba(20,61,112,.94),rgba(10,44,82,.96) 55%,rgba(5,29,57,.98));color:#EAF0FF">'+
    '<div class="ttl">'+TERM+' パスポート</div>'+
    '<div class="pgrid">'+
      '<div><b>'+entered.length+'</b><span>エントリー社数</span></div>'+
      '<div><b>'+passes+'</b><span>通過した選考</span></div></div>'+
    '<div class="pmini">'+
      '<span>進行中 <b>'+live.length+'</b></span>'+
      '<span>終了 <b>'+fails.length+'</b></span>'+
      '<span>見送り <b>'+skipped.length+'</b></span></div>'+
    '<div class="pfoot">最も進んだ段階 '+esc(deepest)+'</div></div>');

  if(worst&&t[worst].f>0){
    cA.push('<div class="pcard po2" style="background:linear-gradient(155deg,rgba(112,37,42,.92),rgba(65,19,25,.98));color:#FFE9EC">'+
      '<div style="display:flex;align-items:baseline;gap:12px">'+
        '<div class="num">'+t[worst].f+'</div>'+
        '<div style="font-size:15px;font-weight:600">社が'+esc(worst)+'で終了</div></div>'+
      '<div class="pfoot">終了'+fails.length+'社のうち'+
        Math.round(t[worst].f/fails.length*100)+'％がこの段階です</div></div>');
  }

  var rate='<div class="pcard po3 flat"><div class="ttl">段階別の通過率</div><div style="margin-top:14px">';
  rows.forEach(function(sname){
    var o=t[sname],att=o.p+o.f,pc=att?Math.round(o.p/att*100):null;
    rate+='<div class="rateRow"><div class="rateHead">'+
      '<span>'+esc(sname)+'</span>'+
      '<span class="rateNum" style="color:'+(pc===null?'var(--dim)':pc>=50?'var(--go)':'var(--hot)')+'">'+
      (pc===null?'—':pc+'%')+'<i>'+o.p+'/'+att+'</i></span></div>'+
      '<div class="bar" style="width:'+Math.max(18,(o.p+o.f+o.w)/max*100)+'%">'+
      (o.p?'<div style="flex:'+o.p+';background:var(--go)"></div>':'')+
      (o.f?'<div style="flex:'+o.f+';background:var(--fail)"></div>':'')+
      (o.w?'<div style="flex:'+o.w+';background:var(--line)"></div>':'')+'</div></div>';
  });
  rate+='</div><div class="legend">'+
    '<span><i style="background:var(--go)"></i>通過</span>'+
    '<span><i style="background:var(--fail)"></i>終了</span>'+
    '<span><i style="background:var(--line)"></i>進行中</span></div></div>';
  cB.push(rate);

  if(waits.length){
    cB.push('<div class="pcard po4" style="background:linear-gradient(155deg,rgba(20,68,112,.94),rgba(8,38,72,.98));color:#DCE9FF">'+
      '<div class="ttl">結果待ち</div>'+
      '<div class="pgrid">'+
        '<div><b>'+waits.length+'</b><span>社</span></div>'+
        '<div><b>'+avg+'</b><span>平均経過日数</span></div>'+
        '<div><b>'+waits[0].d+'</b><span>最長</span></div></div>'+
      '<div class="pfoot">最も長いのは'+esc(waits[0].c)+'</div></div>');
  }

  var brk='<div class="pcard po5 flat"><div class="ttl">進行中の内訳</div><div style="margin-top:10px">';
  ['todo','waiting','fixed','offer'].forEach(function(k){
    var n=LIST.filter(function(i){return stOf(i)===k}).length;
    var lab={todo:'対応中',waiting:'結果待ち',fixed:'参加決定',offer:'内定'}[k];
    var c2={todo:'var(--blue-500)',waiting:'var(--wait)',fixed:'var(--go)',offer:'var(--go)'}[k];
    brk+='<div class="brkRow"><span>'+lab+'</span>'+
      '<span style="font-family:var(--disp);font-size:21px;font-weight:600;color:'+
      (n?c2:'var(--dim)')+'">'+n+'</span></div>';
  });
  brk+='</div></div>';
  cA.push(brk);

  var h='<div class="ptitle">'+TERM+' 記録</div>'+
    '<div class="pwrap">'+
      '<div class="pcol">'+cA.join('')+'</div>'+
      '<div class="pcol">'+cB.join('')+'</div>'+
    '</div>';

  document.getElementById('view').innerHTML=h;
  if(isWide()&&!openCo)sideEmpty();
}

/* ============ 接続設定 ============ */
function openSetup(msg){
  hideSplash();
  resetModalState();
  var dock=document.getElementById('tabbar');
  if(dock) dock.style.display='none';
  var side=document.getElementById('side');
  if(side) side.innerHTML='';
  document.getElementById('app').innerHTML=
    '<div class="setup">'+
    '<div class="setupBox">'+
    '<div class="setupMark">就活</div>'+
    '<div class="setupLead">Apps Script のウェブアプリURLと鍵を入れてください。<br>'+
    'この端末にだけ保存され、ページのソースには残りません。</div>'+
    (msg?'<div class="setupErr">'+esc(msg)+'</div>':'')+
    '<div class="lab">ウェブアプリURL</div>'+
    '<input class="f" type="url" inputmode="url" autocomplete="url" id="cfgEp" placeholder="https://script.google.com/macros/s/.../exec" value="'+esc(CFG.ep)+'" aria-label="Web App URL">'+
    '<div class="lab">鍵</div>'+
    '<input class="f" id="cfgKey" type="password" autocomplete="current-password" placeholder="WebAppApi.gs の WA_KEY" value="'+esc(CFG.key)+'" aria-label="APIキー">'+
    '<button class="big" type="button" style="background:#fff;color:#000" data-action="do-setup">接続する</button>'+
    '</div></div>';
  var k=document.getElementById('cfgKey');
  if(k)k.addEventListener('keydown',function(e){
    if (e.isComposing || e.keyCode === 229) return;
    if(e.key==='Enter') doSetup();
  });
}
function doSetup(){
  var ep=document.getElementById('cfgEp').value.trim();
  var key=document.getElementById('cfgKey').value.trim();
  if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(ep)){
    openSetup('URLは https://script.google.com/macros/s/.../exec の形式です'); return;
  }
  if(!key){ openSetup('鍵を入れてください'); return; }
  saveCfg(ep,key);
  document.getElementById('app').innerHTML=
    '<div class="setup"><div class="setupBox"><div class="setupMark">就活</div>'+
    '<div class="setupLead">接続しています…</div></div></div>';
  api('apiGetData',[]).then(function(j){
    if(!j||!j.items){ openSetup('応答の形式が違います。WebAppApi.gs のデプロイを確認してください'); return; }
    var dock=document.getElementById('tabbar');
    if(dock)dock.style.display='';
    applyData(j);
  }).catch(function(e){
    openSetup(e&&e.message?e.message:'接続できませんでした');
  });
}
function resetCfg(){
  cancelAllActiveGestures();
  if(!confirm('接続設定を消してやり直しますか。')) {
    requestAnimationFrame(() => syncLiquidPills({ animate: false }));
    return;
  }
  try{localStorage.removeItem('sk_ep');localStorage.removeItem('sk_key');
      localStorage.removeItem('sk_cache');}catch(e){}
  CFG={ep:'',key:''};
  openSetup();
}

/* ==========================================================================
   EVENT DELEGATION (SAFE & COMPATIBLE)
   ========================================================================== */
document.addEventListener('click', function(event) {
  const actionEl = event.target.closest('[data-action]');
  if (!actionEl) return;
  const action = actionEl.dataset.action;

  if (action === 'set-page') {
    setPage(actionEl.dataset.page);
  } else if (action === 'set-term') {
    setTerm(actionEl.dataset.term);
  } else if (action === 'open-search') {
    openSearch();
  } else if (action === 'open-add') {
    openAdd();
  } else if (action === 'open-detail') {
    openDetail(actionEl.dataset.company);
  } else if (action === 'close-detail') {
    closeDetail();
  } else if (action === 'do-done') {
    doDone(actionEl.dataset.company);
  } else if (action === 'do-pass') {
    doPass(actionEl.dataset.company);
  } else if (action === 'confirm-fail') {
    confirmFail(actionEl.dataset.company);
  } else if (action === 'do-status') {
    doStatus(actionEl.dataset.company, actionEl.dataset.status);
  } else if (action === 'do-prev-stage') {
    doPrevStage(actionEl.dataset.company);
  } else if (action === 'carry-over') {
    carryOver(actionEl.dataset.company);
  } else if (action === 'set-due') {
    setDue(actionEl.dataset.company);
  } else if (action === 'set-logo-url') {
    setLogoUrl(actionEl.dataset.company);
  } else if (action === 'refetch-logo') {
    refetchLogo(actionEl.dataset.company);
  } else if (action === 'del-event') {
    delEv(actionEl.dataset.uid);
  } else if (action === 'add-event') {
    addEv();
  } else if (action === 'set-cur-stage') {
    setCur(parseInt(actionEl.dataset.index, 10));
  } else if (action === 'move-stage') {
    mv(parseInt(actionEl.dataset.index, 10), parseInt(actionEl.dataset.dir, 10));
  } else if (action === 'remove-stage') {
    rm(parseInt(actionEl.dataset.index, 10));
  } else if (action === 'add-preset-stage') {
    addStage();
  } else if (action === 'add-custom-stage') {
    addCustomStage();
  } else if (action === 'do-add') {
    doAdd();
  } else if (action === 'pick-company') {
    pick(actionEl.dataset.company, actionEl.dataset.term);
  } else if (action === 'open-setup') {
    openSetup();
  }
});

document.addEventListener('keydown', function(event) {
  if (event.isComposing || event.keyCode === 229) return;
  const active = event.target;
  if (active && active.id === 'newStage' && event.key === 'Enter') {
    event.preventDefault();
    addCustomStage();
    return;
  }
  if (event.key !== 'Enter' && event.key !== ' ') return;
  const actionEl = event.target.closest('[data-action]');
  if (!actionEl || event.target !== actionEl) return;
  if (actionEl.tagName === 'BUTTON' || actionEl.tagName === 'A' || actionEl.tagName === 'INPUT') return;
  event.preventDefault();
  actionEl.click();
});

/* ==========================================================================
   LIFECYCLE & BFCACHE ENGINE
   ========================================================================== */
function cancelAllActiveGestures() {
  document.querySelectorAll('.tabbar,.seg').forEach(host => {
    if (host._liquidController && host._liquidController.cancel) {
      host._liquidController.cancel();
    }
  });
}

function cancelAllMotionControllers() {
  cancelAllActiveGestures();
  const card = document.querySelector('#sheet .card');
  if (card) cancelSheetSpring(card);
}

function destroyLiquidControllers() {
  document.querySelectorAll('.tabbar,.seg').forEach(host => {
    if (host._liquidController && host._liquidController.destroy) {
      host._liquidController.destroy();
    }
  });
}

let hiddenAt = 0;

window.addEventListener('blur', cancelAllActiveGestures);

window.addEventListener('pagehide', event => {
  clearTimeout(heroTimer);
  cancelAllMotionControllers();
  if (resizeFrame) { cancelAnimationFrame(resizeFrame); resizeFrame = 0; }
  WarpEngine.destroy();
  MotionLayer.clear();
  if (!event.persisted) {
    destroyLiquidControllers();
  }
});

window.addEventListener('pageshow', event => {
  initLiquid();
  updateNavigationState();
  updateSeg();
  requestAnimationFrame(() => {
    syncLiquidPills({ animate: false });
  });
  scheduleHeroTick();
  if (event.persisted && hiddenAt && (Date.now() - hiddenAt > 5 * 60 * 1000)) {
    refreshDataSafely().catch(() => {});
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    hiddenAt = Date.now();
    clearTimeout(heroTimer);
    cancelAllMotionControllers();
    MotionLayer.clear();
    WarpEngine.destroy();
  } else {
    scheduleHeroTick();
    syncLiquidPills({ animate: false });
    if (hiddenAt && (Date.now() - hiddenAt > 5 * 60 * 1000)) {
      refreshDataSafely().catch(() => {});
    }
  }
});

let onlineRefreshTimer = 0;
window.addEventListener('online', () => {
  document.documentElement.classList.remove('is-offline');
  toast('オンラインに戻りました', true);
  clearTimeout(onlineRefreshTimer);
  onlineRefreshTimer = setTimeout(() => {
    refreshDataSafely().catch(() => {});
  }, 800);
});

window.addEventListener('offline', () => {
  document.documentElement.classList.add('is-offline');
  toast('オフラインです。前回の内容を表示しています');
});

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => syncLiquidPills({ animate: false }));
}

window.addEventListener('load', function(){
  initLiquid();
  if(loadCfg()) load(); else openSetup();
  requestAnimationFrame(function() {
    updateNavigationState();
    updateSeg();
    syncLiquidPills({ animate: false });
  });
});
</script>
