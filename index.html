<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>就活</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="就活">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --ink:#000000;
  --surface:linear-gradient(180deg,rgba(44,44,50,.72) 0%,rgba(26,26,30,.82) 100%);
  --hi:linear-gradient(180deg,rgba(36,36,40,.96) 0%,rgba(20,20,24,.98) 100%);
  --chrome:rgba(30,30,34,.85);
  --line:rgba(255,255,255,.10);
  --line-soft:rgba(255,255,255,.06);
  --text:#FFFFFF; --muted:#A1A1A6; --dim:#6E6E73;
  --blue:#0A84FF; --go:#30D158; --wait:#FF9F0A; --hot:#FF453A; --fail:#6B4A54;
  --edge:inset 0 .5px 0 0 rgba(255,255,255,.20), inset 0 -.5px 0 0 rgba(0,0,0,.45);
  --sheen:linear-gradient(180deg,rgba(255,255,255,.055) 0%,rgba(255,255,255,0) 42%);
  --drop:0 1px 2px rgba(0,0,0,.28), 0 8px 24px rgba(0,0,0,.42);
  --drop-lg:0 2px 6px rgba(0,0,0,.34), 0 22px 56px rgba(0,0,0,.58);

  /* Apple Fluid Motion */
  --apple-spring:cubic-bezier(.32,.72,0,1);
  --apple-ease:cubic-bezier(.25,.1,.25,1);
  --apple-press:cubic-bezier(.2,0,0,1);
  --apple-pop:cubic-bezier(.34,1.4,.5,1);      /* 少し行き過ぎて戻る */
  --apple-bounce:cubic-bezier(.2,1.5,.4,1);    /* 強めの跳ね返り */
  --apple-bounce:cubic-bezier(.2,1.32,.32,1);   /* 少し行き過ぎて戻る */
  --apple-out:cubic-bezier(.55,0,.85,.35);
  --disp:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent}
*::-webkit-scrollbar{width:6px;height:6px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:999px}
*::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.3)}
html{background:var(--ink);-webkit-text-size-adjust:100%;scroll-padding-bottom:96px}
body{overscroll-behavior-y:none;margin:0;background:var(--ink);color:var(--text);
  font-family:var(--body);font-variant-numeric:tabular-nums;
  padding:calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
          calc(130px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  max-width:480px;margin:0 auto;}
button,select,input{font-family:var(--body)}
.tabbar{-webkit-user-select:none;user-select:none}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:200;background:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  transition:opacity .35s var(--apple-ease),visibility .35s}
#splash.gone{opacity:0;visibility:hidden}
#splash .mark{font-size:28px;font-weight:700;letter-spacing:.26em;color:var(--text);
  padding-left:.26em;animation:popIn .55s var(--apple-pop)}
#splash .rule{width:54px;height:1px;background:var(--line);position:relative;overflow:hidden}
#splash .rule::after{content:'';position:absolute;inset:0;background:var(--text);
  transform:translateX(-100%);animation:sweep 1.1s var(--apple-ease) infinite}
#splash .sub{font-family:var(--mono);font-size:9px;letter-spacing:.3em;color:var(--dim)}

/* ---------- type ---------- */
.lab{margin:24px 0 8px;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.2em}
.hero{padding-bottom:20px;border-bottom:1px solid var(--line-soft);margin-bottom:2px;cursor:pointer;
  transition:transform .28s var(--apple-spring),opacity .2s var(--apple-ease)}
.hero:active{transform:scale(.985);opacity:.8;transition:transform .12s var(--apple-press)}
.hero h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.02em}
.cd{line-height:1;display:flex;align-items:baseline;margin-top:14px}
.cd b{font-family:var(--disp);font-size:52px;font-weight:600;letter-spacing:-.035em}
.cd s{font-family:var(--mono);font-size:12px;color:var(--muted);margin:0 10px 0 3px;text-decoration:none}

/* ---------- strip ---------- */
.strip{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 4px}
.stripitem{display:inline-flex;align-items:center;gap:10px;width:100%;max-width:380px;
  text-align:left;cursor:pointer;background:var(--surface);background-image:var(--sheen);
  border:1px solid var(--line);border-radius:14px;padding:10px 13px;color:var(--text);
  box-shadow:var(--edge);transition:transform .28s var(--apple-spring),opacity .2s var(--apple-ease)}
.stripitem{transition:transform .5s var(--apple-bounce),opacity .2s var(--apple-ease)}
.stripitem:active{transform:scale(.96);transition:transform .14s var(--apple-press)}
.stripitem .k{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--muted);
  border:1px solid var(--line);border-radius:5px;padding:2px 6px;flex:0 0 auto;background:rgba(255,255,255,.04)}
.stripitem .n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stripitem .d{margin-left:auto;font-family:var(--disp);font-size:15px;font-weight:600;flex:0 0 auto}
.stripitem .w{font-family:var(--mono);font-size:10px;color:var(--dim);flex:0 0 auto}

/* ---------- rows ---------- */
.row{background:var(--surface);background-image:var(--sheen);
  border:1px solid var(--line);border-radius:16px;box-shadow:var(--edge),var(--drop);
  margin-bottom:9px;overflow:hidden;cursor:pointer;
  display:flex;flex-direction:column;justify-content:space-between;height:calc(100% - 9px);
  opacity:var(--base-op, 1);
  transition:transform .28s var(--apple-spring),opacity .2s var(--apple-ease)}
.row{transition:transform .5s var(--apple-bounce),opacity .2s var(--apple-ease)}
.row:active{transform:scale(.955);transition:transform .14s var(--apple-press)}
.row.is-fixed{background:linear-gradient(180deg,rgba(24,58,38,.78),rgba(12,30,20,.88));
  border-color:rgba(48,209,88,.34);box-shadow:var(--edge),var(--drop),0 0 0 .5px rgba(48,209,88,.18)}
.row.is-offer{background:linear-gradient(180deg,rgba(26,64,42,.82),rgba(12,32,21,.9));
  border-color:rgba(48,209,88,.5)}
.row.is-muted{--base-op:0.45}

.row .main{padding:14px 15px 12px;display:flex;align-items:center;gap:14px;flex:1 1 auto}
.day{width:60px;flex:0 0 auto;text-align:center}
.day b{font-family:var(--disp);font-size:32px;font-weight:600;letter-spacing:-.035em;
  line-height:1;display:block}
.day s{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.12em;
  margin-top:4px;display:block;text-decoration:none}
.day .tag{font-family:var(--mono);font-size:10px;letter-spacing:.1em;line-height:1.5}
.body1{min-width:0;flex:1}
.meta{display:flex;align-items:center;gap:8px}
.meta em{font-family:var(--mono);font-size:12px;color:var(--muted);font-style:normal;letter-spacing:.04em}
.meta i{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim);font-style:normal}
.name{font-size:16px;font-weight:600;letter-spacing:-.01em;margin-top:5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px}
.acts{display:flex;gap:8px;padding:0 15px 12px 74px;flex:0 0 auto}
.gh{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--muted);
  border-radius:9px;padding:6px 14px;font-size:12px;cursor:pointer;text-decoration:none;
  display:inline-block;transition:transform .24s var(--apple-spring),background .18s var(--apple-ease),color .18s var(--apple-ease)}
.gh:active{transform:scale(.9);transition:transform .14s var(--apple-press)}
.logo{width:28px;height:28px;border-radius:14px;flex:0 0 auto;display:flex;align-items:center;
  justify-content:center;overflow:hidden;background:#fff;
  box-shadow:0 0 0 .5px rgba(0,0,0,.4)}
.logo img{width:78%;height:78%;object-fit:contain}
.logo.mono{background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.14)}
.logo.mono span{color:#C7C7CC;font-weight:600}

/* ---------- sheet / card ---------- */
.sheet{position:fixed;inset:0;height:100dvh;background:rgba(0,0,0,.62);
  display:flex;align-items:flex-end;justify-content:center;z-index:50;
  padding:0 10px calc(10px + env(safe-area-inset-bottom));
  opacity:0;pointer-events:none;
  transition:opacity .26s var(--apple-ease);
  transform:translateZ(0)}
.sheet.is-active{opacity:1;pointer-events:auto}
.card{position:relative;background:var(--hi);
  box-shadow:var(--edge),var(--drop-lg);width:100%;max-width:480px;
  height:85vh;height:85dvh;display:flex;flex-direction:column;overflow:hidden;
  border-radius:24px;border:1px solid var(--line);
  padding:10px 20px calc(14px + env(safe-area-inset-bottom));
  transform:translate3d(0,102%,0) scale(.96);
  transition:transform .58s var(--apple-bounce),opacity .24s var(--apple-ease)}
.sheet.is-active .card{transform:translate3d(0,0,0) scale(1)}

.grab{width:36px;height:5px;background:rgba(255,255,255,.22);border-radius:3px;margin:0 auto 16px;
  transition:background .2s var(--apple-ease);flex:0 0 auto}
.card.drag .grab{background:rgba(255,255,255,.45)}
.sheet.out{opacity:0}
.sheet.out .card{transform:translate3d(0,100%,0) scale(.97);transition:transform .34s var(--apple-out)}
.sheet .card.drag{transition:none}
.sheet .card.spring{transition:transform .5s var(--apple-bounce)}
.sheet .card.fly{transition:transform .26s var(--apple-spring),opacity .2s var(--apple-ease)}
.sideclose{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:15px;
  background:rgba(255,255,255,.12);border:none;color:var(--muted);font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;line-height:1;z-index:5;
  transition:transform .24s var(--apple-spring),background .18s var(--apple-ease),color .18s var(--apple-ease)}
.sideclose:active{transform:scale(.92);transition:transform .12s var(--apple-press)}
.sideclose:hover{background:rgba(255,255,255,.18);color:var(--text)}

/* ---------- detail header & tab content ---------- */
.card-head{flex:0 0 auto;padding-right:40px}
.tabs{display:flex;gap:2px;margin-top:20px;border-bottom:1px solid var(--line-soft);position:relative}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);
  padding:11px 12px;font-size:13px;font-weight:500;cursor:pointer;
  transition:color .2s var(--apple-ease),border-color .2s var(--apple-ease),transform .24s var(--apple-spring)}
.tabs button:active{transform:scale(.96);transition:transform .12s var(--apple-press)}
.tabs button.on{color:var(--text);border-bottom-color:var(--text)}

.tab-pane{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:32px;padding-right:4px;animation:tabPaneIn .4s var(--apple-bounce) both}
@keyframes tabPaneIn{
  from{opacity:0;transform:translate3d(14px,0,0)}
  to{opacity:1;transform:translate3d(0,0,0)}
}
.card-head{animation:rise .42s var(--apple-spring) both}
.sheet .card .tab-pane{animation-delay:.06s}

.kv{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.kv span:first-child{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.kv span:last-child{font-size:13px;text-align:right;word-break:break-all;margin-left:16px}
.f{width:100%;background:rgba(0,0,0,.32);border:1px solid var(--line);border-radius:11px;
  padding:11px 13px;color:var(--text);font-size:14px;outline:none;
  transition:border-color .2s var(--apple-ease),background .2s var(--apple-ease),box-shadow .2s var(--apple-ease)}
.f:focus{border-color:var(--blue);background:rgba(0,0,0,.5);box-shadow:0 0 0 3.5px rgba(10,132,255,.25)}
.lab+.f{margin-top:0}
.f+.f,.f+.gh{margin-top:10px}
.card .f{margin-top:8px}
.card .lab+.f{margin-top:0}
.big{width:100%;padding:13px 0;border-radius:12px;border:none;font-size:14px;font-weight:600;
  cursor:pointer;margin-top:12px;display:block;text-align:center;text-decoration:none;
  transition:transform .28s var(--apple-spring),opacity .2s var(--apple-ease)}
.big{transition:transform .5s var(--apple-bounce),opacity .2s var(--apple-ease)}
.big:active{transform:scale(.935);transition:transform .14s var(--apple-press)}
.big[disabled]{opacity:.4;cursor:default}
.rail{display:flex;align-items:center}
.rail i{flex:0 0 auto;border-radius:9px;display:block;transition:all .32s var(--apple-spring)}
.rail u{height:1px;flex:1;display:block}
.railtxt{display:flex;justify-content:space-between;margin-top:8px}
.railtxt span{font-size:8.5px;color:var(--dim);flex:1;text-align:center}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:6px}

/* ---------- dock ---------- */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom));z-index:45;
  display:inline-flex;align-items:center;justify-content:center;gap:2px;
  white-space:nowrap;max-width:calc(100vw - 24px);background:var(--chrome);
  border:1px solid var(--line);border-radius:30px;padding:5px;
  box-shadow:var(--edge),var(--drop-lg);--pw:88px;--pg:2px}
.tabbar button{background:none;border:none;color:var(--muted);font-size:13px;font-weight:600;
  padding:10px 0;border-radius:24px;cursor:pointer;position:relative;z-index:1;
  white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
  transition:color .24s var(--apple-ease),transform .24s var(--apple-spring)}
.tabbar button:active{transform:scale(.95);transition:transform .12s var(--apple-press)}
.tabbar button:not(.ico){width:var(--pw)}
.tabbar button.on{color:#000}
.tabbar .pill{position:absolute;left:5px;top:5px;width:var(--pw);height:calc(100% - 10px);
  border-radius:24px;background:rgba(255,255,255,.95);z-index:0;pointer-events:none;
  transform:translate3d(0,0,0);transition:transform .52s var(--apple-bounce)}
.tabbar.p1 .pill{transform:translate3d(calc(var(--pw) + var(--pg)),0,0)}

/* 掴んでいる間：指に追従し、半透明のガラスになって伸び縮みする */
.pill{will-change:transform;overflow:hidden}
.pill::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(100deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.75) 50%,rgba(255,255,255,0) 70%);
  transform:translateX(var(--sx,-120%));opacity:0;transition:opacity .25s var(--apple-ease)}
.dragpill .pill{transition:none;
  background:rgba(255,255,255,.42);
  backdrop-filter:blur(14px) saturate(190%);-webkit-backdrop-filter:blur(14px) saturate(190%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(0,0,0,.25),
             0 6px 18px rgba(0,0,0,.35)}
.dragpill .pill::after{opacity:.85}
.dragpill button{color:var(--text) !important;transition:color .2s var(--apple-ease)}
.dragpill.tabbar,.dragpill.seg{transform-origin:center}
.pill.settle{transition:transform .62s var(--apple-bounce),background .3s var(--apple-ease),
             box-shadow .3s var(--apple-ease)}

.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-bottom:16px;max-width:300px;
  background:var(--chrome);border:1px solid var(--line);border-radius:30px;
  padding:5px;box-shadow:var(--edge),var(--drop)}
.seg button{background:none;border:none;color:var(--muted);position:relative;z-index:1;
  border-radius:24px;padding:10px 0;font-size:13px;font-weight:600;cursor:pointer;
  white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;
  transition:color .24s var(--apple-ease),transform .24s var(--apple-spring)}
.seg button:active{transform:scale(.96);transition:transform .12s var(--apple-press)}
.seg button.on{color:#000}
.seg .pill{position:absolute;left:5px;top:5px;height:calc(100% - 10px);
  width:calc((100% - 12px) / 2 - 1px);
  border-radius:24px;background:rgba(255,255,255,.95);
  z-index:0;pointer-events:none;transform:translate3d(0,0,0);
  transition:transform .52s var(--apple-bounce)}
.seg.i1 .pill{transform:translate3d(calc(100% + 2px),0,0)}
.sgn{font-family:var(--mono);font-size:10px;margin-left:7px;opacity:.55}

.tabbar .sep{width:1px;height:20px;background:var(--line);margin:0 4px;flex-shrink:0}
.tabbar .ico{padding:10px 15px;font-size:18px;font-weight:400;color:var(--text);
  line-height:1;white-space:nowrap;flex-shrink:0}

/* Chrome 系だけ、ガラス越しの背景を実際に歪ませる */
html.can-refract .tabbar.lifted,
html.can-refract .seg.lifted{
  backdrop-filter:blur(10px) saturate(210%) brightness(1.12) url(#liquidWarp);
  -webkit-backdrop-filter:blur(10px) saturate(210%) brightness(1.12);
  background:rgba(48,48,56,.42)}   /* 薄くして背景を透かす */

/* ---------- リキッドグラス：長押しでつまんで動かす ---------- */
.tabbar,.seg{touch-action:pan-y;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none}          /* 長押しメニューを出さない */
.tabbar,.seg{position:relative;isolation:isolate}
/* バーの表面を走る反射。指の位置に追従する */
.tabbar::before,.seg::before{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;
  opacity:0;transition:opacity .3s var(--apple-ease);
  background:
    radial-gradient(120% 180% at var(--hx,50%) -30%,
      rgba(255,255,255,.34) 0%,rgba(255,255,255,.08) 34%,rgba(255,255,255,0) 62%),
    linear-gradient(180deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 34%,
      rgba(255,255,255,0) 66%,rgba(255,255,255,.07) 100%)}
.tabbar.lifted::before,.seg.lifted::before{opacity:1}
/* 縁のふち光り */
.tabbar::after,.seg::after{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;
  opacity:0;transition:opacity .3s var(--apple-ease);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),
             inset 0 -1px 0 rgba(255,255,255,.14),
             inset 1px 0 0 rgba(255,255,255,.2),
             inset -1px 0 0 rgba(255,255,255,.2)}
.tabbar.lifted::after,.seg.lifted::after{opacity:1}

.tabbar.lifted,.seg.lifted{
  background:rgba(56,56,64,.72);
  border-color:rgba(255,255,255,.3);
  box-shadow:0 4px 14px rgba(0,0,0,.5),0 30px 70px rgba(0,0,0,.66),
             0 0 26px rgba(255,255,255,.07),
             inset 0 0 22px rgba(255,255,255,.06);
  transition:transform .34s var(--apple-pop),background .3s var(--apple-ease),
             box-shadow .3s var(--apple-ease),border-color .3s var(--apple-ease)}
.tabbar.lifted{transform:translateX(-50%) scale(1.045)}
.seg.lifted{transform:scale(1.03)}
@media (min-width:1000px){ .tabbar.lifted{transform:scale(1.045)} }

/* つまんでいる間のピル：光沢が指を追い、動く向きへ伸びる */
.pill{position:absolute;overflow:hidden}
.pill::before{content:'';position:absolute;left:8%;right:8%;top:2px;height:38%;
  border-radius:999px;pointer-events:none;opacity:0;
  background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0));
  transition:opacity .25s var(--apple-ease)}
.pill::after{content:'';position:absolute;inset:0;border-radius:inherit;opacity:0;
  background:radial-gradient(55% 120% at var(--gx,50%) 35%,
    rgba(255,255,255,1) 0%,rgba(255,255,255,.45) 32%,rgba(255,255,255,0) 68%);
  mix-blend-mode:overlay;transition:opacity .25s var(--apple-ease)}
.grabbing .pill{
  box-shadow:0 8px 22px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.6),
             0 0 18px rgba(255,255,255,.28),
             inset 0 1px 0 rgba(255,255,255,1),
             inset 0 -2px 4px rgba(0,0,0,.18);
  transition:none}
.grabbing .pill::after,.grabbing .pill::before{opacity:1}
.settling .pill{transition:transform .62s var(--apple-bounce)}

/* ---------- passport ---------- */
.ptitle{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.2em;margin-bottom:12px}
