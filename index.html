/* ==========================================================================
   PRIORITY 4 & 5: UNIFIED LIQUID PILL PHYSICS CONTROLLER
   ========================================================================== */
let liquidSelectionHost = null;

function attachLiquid(host, ids, onPick, isActive){
  if (!host || host._liquid) return;
  host._liquid = true;
  var pill = host.querySelector('.pill');
  if (!pill) return;

  var press = 0, lifted = false, startX = 0, startY = 0, lastX = 0;
  var startVisualX = 0, originLeft = 0;
  var pointerId = null;

  let velocity = 0;
  let accel = 0;
  let lastPos = 0;
  let lastVelocity = 0;
  let lastMoveTime = 0;

  let suppressClick = false;
  let dragDistance = 0;
  let activeSpringTask = null;
  const startedAt = performance.now();

  let cachedHostRect = null;
  let cachedPillWidth = 0;
  let dropping = false;

  const spring = new Spring(SPRING_PRESETS.pill);

  function btns(){
    return ids.map(function(id){ return document.getElementById(id); })
              .filter(function(b){ return !!b; });
  }

  function getActiveIndex(){
    var bList = btns();
    for (var i = 0; i < bList.length; i++){
      if (isActive(i)) return i;
    }
    return 0;
  }

  function getButtonTargets(){
    originLeft = pill.offsetLeft || 0;
    const pillWidth = pill.offsetWidth || 1;
    return btns().map(function(button){
      const buttonCenter = button.offsetLeft + button.offsetWidth * 0.5;
      return buttonCenter - pillWidth * 0.5 - originLeft;
    });
  }

  function cancelActiveSpring() {
    if (activeSpringTask) {
      MotionLayer.remove(activeSpringTask);
      activeSpringTask = null;
    }
  }

  function movePillToIndex(index, animate) {
    const targets = getButtonTargets();
    if (targets[index] === undefined) return;
    const targetX = targets[index];
    cancelActiveSpring();

    if (!animate || prefersReducedMotion) {
      spring.position = targetX;
      spring.target = targetX;
      spring.velocity = 0;
      pill.style.transform = `translate3d(${targetX.toFixed(2)}px, 0, 0)`;
      pill.style.borderRadius = "28px";
      return;
    }

    const visualX = readTranslateX(pill);
    spring.position = Number.isFinite(visualX) ? visualX : targetX;
    spring.target = targetX;
    spring.resetTime();
    const taskStart = performance.now();

    activeSpringTask = (time) => {
      const pos = spring.update(time);
      pill.style.transform = `translate3d(${pos.toFixed(2)}px, 0, 0)`;
      pill.style.borderRadius = "28px";
      if (spring.isResting() || (time - taskStart > 1500)) {
        MotionLayer.remove(activeSpringTask);
        activeSpringTask = null;
        pill.style.transform = `translate3d(${targetX.toFixed(2)}px, 0, 0)`;
      }
    };
    MotionLayer.add(activeSpringTask);
  }

  function scheduleClickSuppressionReset() {
    setTimeout(function() {
      suppressClick = false;
    }, 50);
  }

  function lift(){
    lifted = true;
    activeWarpOwner = host;
    cancelActiveSpring();
    host.classList.add('lifted', 'grabbing');
    cachedHostRect = host.getBoundingClientRect();
    cachedPillWidth = pill.offsetWidth || 1;
    var targets = getButtonTargets();
    var curIdx = getActiveIndex();
    startVisualX = targets[curIdx] !== undefined ? targets[curIdx] : 0;
    lastPos = startVisualX;
    lastVelocity = 0;
    lastMoveTime = performance.now();
    haptic(10);
  }

  function renderMove(){
    if (!lifted) return;
    var targets = getButtonTargets();
    if (!targets.length) return;
    var minX = targets[0];
    var maxX = targets[targets.length - 1];

    var deltaX = lastX - startX;
    var rawPos = startVisualX + deltaX;
    var curPos = rubberClamp(rawPos, minX, maxX);

    const now = performance.now();
    const dt = Math.max(1, now - lastMoveTime);
    const nextVelocity = (curPos - lastPos) / dt;
    accel = (nextVelocity - lastVelocity) / dt;
    velocity = nextVelocity;
    lastVelocity = nextVelocity;
    lastPos = curPos;
    lastMoveTime = now;

    const speed = Math.abs(velocity);
    const stretch = Math.min(0.32, speed * 0.16);
    const sx = 1 + stretch;
    const sy = 1 - stretch * 0.5;

    if (activeWarpOwner === host) {
      const warp = Math.min(36, 6 + speed * 14 + Math.min(12, Math.abs(accel) * 500) + stretch * 18);
      WarpEngine.set(warp);
    }

    const radius = 24 - stretch * 12;
    pill.style.borderRadius = radius + "px";

    const tilt = prefersReducedMotion ? 0 : Math.max(-1.2, Math.min(1.2, velocity * 0.8));
    pill.style.transform = `translate3d(${curPos.toFixed(2)}px,0,0) rotateZ(${tilt.toFixed(2)}deg) scaleX(${sx.toFixed(3)}) scaleY(${sy.toFixed(3)})`;

    if (cachedHostRect && cachedHostRect.width > 0) {
      const relX = lastX - cachedHostRect.left;
      const hostRatio = Math.max(0, Math.min(100, (relX / cachedHostRect.width) * 100));
      host.style.setProperty('--hx', hostRatio.toFixed(0) + '%');
    }

    if (cachedPillWidth > 0 && cachedHostRect) {
      const pillLeft = cachedHostRect.left + curPos;
      const relPillX = lastX - pillLeft;
      const pillRatio = Math.max(0, Math.min(100, (relPillX / cachedPillWidth) * 100));
      pill.style.setProperty('--pill-light-x', `${pillRatio.toFixed(1)}%`);
    }
  }

  function drop(){
    if (dropping) return;
    dropping = true;
    clearTimeout(press);

    const wasLifted = lifted;
    lifted = false;
    const capturedPointerId = pointerId;
    pointerId = null;

    host.classList.remove('lifted', 'grabbing');
    if (activeWarpOwner === host) {
      activeWarpOwner = null;
      WarpEngine.reset();
    }
    cachedHostRect = null;

    if (capturedPointerId !== null) {
      try {
        host.releasePointerCapture(capturedPointerId);
      } catch (error) {}
    }

    if (!wasLifted) {
      scheduleClickSuppressionReset();
      dropping = false;
      return;
    }

    var targets = getButtonTargets();
    var rawFinalX = startVisualX + (lastX - startX);
    var best = 0, bestDist = 1e9;
    targets.forEach(function(tx, i){
      var d = Math.abs(tx - rawFinalX);
      if (d < bestDist) { bestDist = d; best = i; }
    });

    liquidSelectionHost = host;
    if (!isActive(best)) onPick(best);
    requestAnimationFrame(() => { liquidSelectionHost = null; });

    movePillToIndex(best, true);
    scheduleClickSuppressionReset();
    dropping = false;
  }

  function onPointerDown(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (pointerId !== null && pointerId !== e.pointerId) return;
    startX = lastX = e.clientX;
    startY = e.clientY;
    pointerId = e.pointerId;
    dragDistance = 0;
    suppressClick = false;
    try { host.setPointerCapture(e.pointerId); } catch (err) {}
    clearTimeout(press);
    press = setTimeout(lift, 200);
  }

  function onPointerMove(e) {
    if (pointerId !== null && e.pointerId !== pointerId) return;
    lastX = e.clientX;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    const horizontalGesture = Math.abs(dx) > Math.abs(dy) * 1.15;
    dragDistance = Math.max(dragDistance, Math.abs(dx));

    if (!lifted) {
      if (Math.abs(dy) > 8 || Math.abs(dx) > 8) {
        clearTimeout(press);
      }
      if (horizontalGesture && Math.abs(dx) > 8) {
        suppressClick = true;
      }
      return;
    }
    suppressClick = true;
    e.preventDefault();
    renderMove();
  }

  function onPointerUp(e) {
    if (pointerId !== null && e.pointerId !== pointerId) return;
    drop();
  }

  function onLostPointerCapture() {
    if (dropping) return;
    clearTimeout(press);
    if (lifted) drop();
  }

  function onClickCapture(event) {
    if (suppressClick) {
      event.preventDefault();
      event.stopImmediatePropagation();
    }
  }

  function onContextMenu(event) { event.preventDefault(); }
  function onSelectStart(event) { event.preventDefault(); }

  host.addEventListener('click', onClickCapture, true);
  host.addEventListener('contextmenu', onContextMenu);
  host.addEventListener('selectstart', onSelectStart);

  host.addEventListener('pointerdown', onPointerDown);
  host.addEventListener('pointermove', onPointerMove, { passive: false });
  host.addEventListener('pointerup', onPointerUp);
  host.addEventListener('pointercancel', onPointerUp);
  host.addEventListener('lostpointercapture', onLostPointerCapture);

  if ('ResizeObserver' in window) {
    const ro = new ResizeObserver(() => {
      movePillToIndex(getActiveIndex(), false);
    });
    ro.observe(host);
    host._liquidResizeObserver = ro;
  }

  host._liquidController = {
    moveTo(idx, anim) { movePillToIndex(idx, anim); },
    cancel() { cancelActiveSpring(); if(lifted) drop(); },
    refresh() { movePillToIndex(getActiveIndex(), false); },
    destroy() {
      cancelActiveSpring();
      clearTimeout(press);
      if (host._liquidResizeObserver) {
        host._liquidResizeObserver.disconnect();
        delete host._liquidResizeObserver;
      }
      host.removeEventListener('pointerdown', onPointerDown);
      host.removeEventListener('pointermove', onPointerMove);
      host.removeEventListener('pointerup', onPointerUp);
      host.removeEventListener('pointercancel', onPointerUp);
      host.removeEventListener('lostpointercapture', onLostPointerCapture);
      host.removeEventListener('click', onClickCapture, true);
      host.removeEventListener('contextmenu', onContextMenu);
      host.removeEventListener('selectstart', onSelectStart);
      host._liquid = false;
      delete host._liquidController;
    }
  };

  requestAnimationFrame(() => {
    const targets = getButtonTargets();
    const curIdx = getActiveIndex();
    if (targets[curIdx] !== undefined) {
      movePillToIndex(curIdx, false);
    }
  });
}

function syncLiquidPills(options = {}) {
  const animate = options.animate !== false;
  const tabHost = document.getElementById('tabbar');
  if (tabHost && tabHost._liquidController) {
    tabHost._liquidController.moveTo(PAGE === 'list' ? 0 : 1, animate);
  }
  const segHost = document.getElementById('seg');
  if (segHost && segHost._liquidController) {
    segHost._liquidController.moveTo(TERMS.indexOf(TERM), animate);
  }
}

function initLiquid(){
  attachLiquid(document.getElementById('tabbar'), ['tb-list','tb-pass'],
    function(i){ setPage(i===0?'list':'pass') },
    function(i){ return (i===0) === (PAGE==='list') });
  attachLiquid(document.getElementById('seg'), ['sg0','sg1'],
    function(i){ setTerm(TERMS[i]) },
    function(i){ return TERM===TERMS[i] });
}

/* ============ 記録 ============ */
function tally(){
  var t={};
  var bump=function(s,k){if(!t[s])t[s]={p:0,f:0,w:0};t[s][k]++};
  ITEMS().forEach(function(it){
    if(!isCo(it))return;
    var r=routeOf(it),cur=it.lost||it.stage,i=r.indexOf(cur),st=stOf(it);
    if(st==='skip')return;
    if(i<0){bump(cur, st==='fail'?'f':(st==='offer'||st==='fixed')?'p':'w');return}
    for(var k=0;k<i;k++)bump(r[k],'p');
    if(st==='fail')bump(cur,'f');
    else if(st==='offer'||st==='fixed')bump(cur,'p');
    else bump(cur,'w');
  });
  return t;
}
function renderPassport(pageChanged){
  var t=tally();
  var order=DEFAULT_ROUTE.concat(PALETTE.filter(function(p){return DEFAULT_ROUTE.indexOf(p)<0}));
  var rows=order.filter(function(s){return t[s]});
  var max=1; rows.forEach(function(s){max=Math.max(max,t[s].p+t[s].f+t[s].w)});

  var LIST=ITEMS().filter(isCo);
  var live=LIST.filter(function(i){return ['todo','waiting','fixed','offer'].indexOf(stOf(i))>=0});
  var fails=LIST.filter(function(i){return stOf(i)==='fail'});
  var entered=LIST.filter(function(i){return stOf(i)!=='skip'});
  var skipped=LIST.filter(function(i){return stOf(i)==='skip'});
  var passes=0; rows.forEach(function(s){passes+=t[s].p});

  var worst=null;
  rows.forEach(function(s){ if(!worst||t[s].f>t[worst].f) worst=s });

  var waits=LIST.filter(function(i){return stOf(i)==='waiting'})
    .map(function(i){return {c:i.c, d:since(i.since||(i.due?i.due.slice(0,10):null))||0}})
    .sort(function(a,b){return b.d-a.d});
  var avg=waits.length?Math.round(waits.reduce(function(a,b){return a+b.d},0)/waits.length):0;

  var deepest='—';
  LIST.forEach(function(it){
    var r=routeOf(it), i=r.indexOf(it.lost||it.stage);
    if(i<0)return;
    if(order.indexOf(r[i])>order.indexOf(deepest)) deepest=r[i];
  });

  var cA=[], cB=[];

  cA.push('<div class="pcard po1" style="background:linear-gradient(155deg,rgba(42,34,102,0.85) 0%,rgba(28,58,120,0.88) 55%,rgba(30,83,138,0.92) 100%);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);color:#EAF0FF">'+
    '<div class="ttl">'+TERM+' パスポート</div>'+
    '<div class="pgrid">'+
      '<div><b>'+entered.length+'</b><span>エントリー社数</span></div>'+
      '<div><b>'+passes+'</b><span>通過した選考</span></div></div>'+
    '<div class="pmini">'+
      '<span>進行中 <b>'+live.length+'</b></span>'+
      '<span>終了 <b>'+fails.length+'</b></span>'+
      '<span>見送り <b>'+skipped.length+'</b></span></div>'+
    '<div class="pfoot">最も進んだ段階 '+esc(deepest)+'</div></div>');

  if(worst&&t[worst].f>0){
    cA.push('<div class="pcard po2" style="background:linear-gradient(155deg,rgba(122,31,43,0.88) 0%,rgba(84,20,31,0.92) 100%);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);color:#FFE9EC">'+
      '<div style="display:flex;align-items:baseline;gap:12px">'+
        '<div class="num">'+t[worst].f+'</div>'+
        '<div style="font-size:15px;font-weight:600">社が'+esc(worst)+'で終了</div></div>'+
      '<div class="pfoot">終了'+fails.length+'社のうち'+
        Math.round(t[worst].f/fails.length*100)+'％がこの段階です</div></div>');
  }

  var rate='<div class="pcard po3 flat"><div class="ttl">段階別の通過率</div><div style="margin-top:14px">';
  rows.forEach(function(sname){
    var o=t[sname],att=o.p+o.f,pc=att?Math.round(o.p/att*100):null;
    rate+='<div class="rateRow"><div class="rateHead">'+
      '<span>'+esc(sname)+'</span>'+
      '<span class="rateNum" style="color:'+(pc===null?'var(--dim)':pc>=50?'var(--go)':'var(--hot)')+'">'+
      (pc===null?'—':pc+'%')+'<i>'+o.p+'/'+att+'</i></span></div>'+
      '<div class="bar" style="width:'+Math.max(18,(o.p+o.f+o.w)/max*100)+'%">'+
      (o.p?'<div style="flex:'+o.p+';background:var(--go)"></div>':'')+
      (o.f?'<div style="flex:'+o.f+';background:var(--fail)"></div>':'')+
      (o.w?'<div style="flex:'+o.w+';background:var(--line)"></div>':'')+'</div></div>';
  });
  rate+='</div><div class="legend">'+
    '<span><i style="background:var(--go)"></i>通過</span>'+
    '<span><i style="background:var(--fail)"></i>終了</span>'+
    '<span><i style="background:var(--line)"></i>進行中</span></div></div>';
  cB.push(rate);

  if(waits.length){
    cB.push('<div class="pcard po4" style="background:linear-gradient(155deg,rgba(22,48,78,0.88) 0%,rgba(16,31,51,0.92) 100%);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);color:#DCE9FF">'+
      '<div class="ttl">結果待ち</div>'+
      '<div class="pgrid">'+
        '<div><b>'+waits.length+'</b><span>社</span></div>'+
        '<div><b>'+avg+'</b><span>平均経過日数</span></div>'+
        '<div><b>'+waits[0].d+'</b><span>最長</span></div></div>'+
      '<div class="pfoot">最も長いのは'+esc(waits[0].c)+'</div></div>');
  }

  var brk='<div class="pcard po5 flat"><div class="ttl">進行中の内訳</div><div style="margin-top:10px">';
  ['todo','waiting','fixed','offer'].forEach(function(k){
    var n=LIST.filter(function(i){return stOf(i)===k}).length;
    var lab={todo:'対応中',waiting:'結果待ち',fixed:'参加決定',offer:'内定'}[k];
    var c2={todo:'var(--blue)',waiting:'var(--wait)',fixed:'var(--go)',offer:'var(--go)'}[k];
    brk+='<div class="brkRow"><span>'+lab+'</span>'+
      '<span style="font-family:var(--disp);font-size:21px;font-weight:600;color:'+
      (n?c2:'var(--dim)')+'">'+n+'</span></div>';
  });
  brk+='</div></div>';
  cA.push(brk);

  var h='<div class="ptitle">'+TERM+' 記録</div>'+
    '<div class="pwrap">'+
      '<div class="pcol">'+cA.join('')+'</div>'+
      '<div class="pcol">'+cB.join('')+'</div>'+
    '</div>';

  document.getElementById('view').innerHTML=h;
  if(isWide()&&!openCo)sideEmpty();
}

/* ============ 接続設定 ============ */
function openSetup(msg){
  hideSplash();
  resetModalState();
  var dock=document.getElementById('tabbar');
  if(dock) dock.style.display='none';
  var side=document.getElementById('side');
  if(side) side.innerHTML='';
  document.getElementById('app').innerHTML=
    '<div class="setup">'+
    '<div class="setupBox">'+
    '<div class="setupMark">就活</div>'+
    '<div class="setupLead">Apps Script のウェブアプリURLと鍵を入れてください。<br>'+
    'この端末にだけ保存され、ページのソースには残りません。</div>'+
    (msg?'<div class="setupErr">'+esc(msg)+'</div>':'')+
    '<div class="lab">ウェブアプリURL</div>'+
    '<input class="f" type="url" inputmode="url" autocomplete="url" id="cfgEp" placeholder="https://script.google.com/macros/s/.../exec" value="'+esc(CFG.ep)+'" aria-label="Web App URL">'+
    '<div class="lab">鍵</div>'+
    '<input class="f" id="cfgKey" type="password" autocomplete="current-password" placeholder="WebAppApi.gs の WA_KEY" value="'+esc(CFG.key)+'" aria-label="APIキー">'+
    '<button class="big" type="button" style="background:#fff;color:#000" data-action="do-setup">接続する</button>'+
    '</div></div>';
  var k=document.getElementById('cfgKey');
  if(k)k.addEventListener('keydown',function(e){
    if (e.isComposing || e.keyCode === 229) return;
    if(e.key==='Enter') doSetup();
  });
}
function doSetup(){
  var ep=document.getElementById('cfgEp').value.trim();
  var key=document.getElementById('cfgKey').value.trim();
  if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(ep)){
    openSetup('URLは https://script.google.com/macros/s/.../exec の形式です'); return;
  }
  if(!key){ openSetup('鍵を入れてください'); return; }
  saveCfg(ep,key);
  document.getElementById('app').innerHTML=
    '<div class="setup"><div class="setupBox"><div class="setupMark">就活</div>'+
    '<div class="setupLead">接続しています…</div></div></div>';
  api('apiGetData',[]).then(function(j){
    if(!j||!j.items){ openSetup('応答の形式が違います。WebAppApi.gs のデプロイを確認してください'); return; }
    var dock=document.getElementById('tabbar');
    if(dock)dock.style.display='';
    applyData(j);
  }).catch(function(e){
    openSetup(e&&e.message?e.message:'接続できませんでした');
  });
}
function resetCfg(){
  cancelAllActiveGestures();
  if(!confirm('接続設定を消してやり直しますか。')) {
    requestAnimationFrame(() => syncLiquidPills({ animate: false }));
    return;
  }
  try{localStorage.removeItem('sk_ep');localStorage.removeItem('sk_key');
      localStorage.removeItem('sk_cache');}catch(e){}
  CFG={ep:'',key:''};
  openSetup();
}

/* ==========================================================================
   PRIORITY 61: EVENT DELEGATION SYSTEM
   ========================================================================== */
document.addEventListener('click', function(event) {
  const actionEl = event.target.closest('[data-action]');
  if (!actionEl) return;
  const action = actionEl.dataset.action;

  if (action === 'set-page') {
    setPage(actionEl.dataset.page);
  } else if (action === 'set-term') {
    setTerm(actionEl.dataset.term);
  } else if (action === 'open-search') {
    openSearch();
  } else if (action === 'open-add') {
    openAdd();
  } else if (action === 'open-detail') {
    openDetail(actionEl.dataset.company);
  } else if (action === 'close-detail') {
    closeDetail();
  } else if (action === 'do-done') {
    doDone(actionEl.dataset.company);
  } else if (action === 'do-pass') {
    doPass(actionEl.dataset.company);
  } else if (action === 'confirm-fail') {
    confirmFail(actionEl.dataset.company);
  } else if (action === 'do-status') {
    doStatus(actionEl.dataset.company, actionEl.dataset.status);
  } else if (action === 'do-prev-stage') {
    doPrevStage(actionEl.dataset.company);
  } else if (action === 'carry-over') {
    carryOver(actionEl.dataset.company);
  } else if (action === 'set-due') {
    setDue(actionEl.dataset.company);
  } else if (action === 'set-logo-url') {
    setLogoUrl(actionEl.dataset.company);
  } else if (action === 'refetch-logo') {
    refetchLogo(actionEl.dataset.company);
  } else if (action === 'del-event') {
    delEv(actionEl.dataset.uid);
  } else if (action === 'add-event') {
    addEv();
  } else if (action === 'set-cur-stage') {
    setCur(parseInt(actionEl.dataset.index, 10));
  } else if (action === 'move-stage') {
    mv(parseInt(actionEl.dataset.index, 10), parseInt(actionEl.dataset.dir, 10));
  } else if (action === 'remove-stage') {
    rm(parseInt(actionEl.dataset.index, 10));
  } else if (action === 'add-preset-stage') {
    addStage();
  } else if (action === 'add-custom-stage') {
    addCustomStage();
  } else if (action === 'do-add') {
    doAdd();
  } else if (action === 'pick-company') {
    pick(actionEl.dataset.company, actionEl.dataset.term);
  } else if (action === 'open-setup') {
    openSetup();
  }
});

document.addEventListener('keydown', function(event) {
  if (event.isComposing || event.keyCode === 229) return;
  const active = event.target;
  if (active && active.id === 'newStage' && event.key === 'Enter') {
    event.preventDefault();
    addCustomStage();
    return;
  }
  if (event.key !== 'Enter' && event.key !== ' ') return;
  const actionEl = event.target.closest('[data-action]');
  if (!actionEl || event.target !== actionEl) return;
  if (actionEl.tagName === 'BUTTON' || actionEl.tagName === 'A' || actionEl.tagName === 'INPUT') return;
  event.preventDefault();
  actionEl.click();
});

/* ==========================================================================
   PRIORITY 14: LIFECYCLE & BFCACHE ENGINE
   ========================================================================== */
function cancelAllActiveGestures() {
  document.querySelectorAll('.tabbar,.seg').forEach(host => {
    if (host._liquidController && host._liquidController.cancel) {
      host._liquidController.cancel();
    }
  });
}

function cancelAllMotionControllers() {
  cancelAllActiveGestures();
  const card = document.querySelector('#sheet .card');
  if (card) {
    cancelSheetSpring(card);
  }
}

function destroyLiquidControllers() {
  document.querySelectorAll('.tabbar,.seg').forEach(host => {
    if (host._liquidController && host._liquidController.destroy) {
      host._liquidController.destroy();
    }
  });
}

function cancelScheduledFrames() {
  if (scrollFrame) { cancelAnimationFrame(scrollFrame); scrollFrame = 0; }
  if (lightFrame) { cancelAnimationFrame(lightFrame); lightFrame = 0; }
  if (localLightFrame) { cancelAnimationFrame(localLightFrame); localLightFrame = 0; }
  if (parallaxFrame) { cancelAnimationFrame(parallaxFrame); parallaxFrame = 0; }
  if (resizeFrame) { cancelAnimationFrame(resizeFrame); resizeFrame = 0; }
}

let hiddenAt = 0;

window.addEventListener('blur', cancelAllActiveGestures);

window.addEventListener('pagehide', (event) => {
  clearTimeout(heroTimer);
  cancelAllMotionControllers();
  cancelScheduledFrames();
  destroyCardObserver();
  WarpEngine.destroy();
  MotionLayer.clear();
  if (!event.persisted) {
    destroyLiquidControllers();
  }
});

window.addEventListener('pageshow', (event) => {
  initLiquid();
  updateNavigationState();
  updateSeg();
  requestAnimationFrame(() => {
    syncLiquidPills({ animate: false });
    requestScrollFrame();
    if (PAGE === 'list') {
      createCardObserver();
      requestParallaxUpdate();
    }
  });
  scheduleHeroTick();
  if (event.persisted && hiddenAt && (Date.now() - hiddenAt > 5 * 60 * 1000)) {
    refreshDataSafely().catch(() => {});
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    hiddenAt = Date.now();
    clearTimeout(heroTimer);
    cancelAllMotionControllers();
    MotionLayer.clear();
    WarpEngine.destroy();
    if (cardObserver) cardObserver.disconnect();
  } else {
    scheduleHeroTick();
    if (PAGE === 'list') {
      createCardObserver();
      requestParallaxUpdate();
    }
    syncLiquidPills({ animate: false });
    if (hiddenAt && (Date.now() - hiddenAt > 5 * 60 * 1000)) {
      refreshDataSafely().catch(() => {});
    }
  }
});

let onlineRefreshTimer = 0;
window.addEventListener('online', () => {
  document.documentElement.classList.remove('is-offline');
  toast('オンラインに戻りました', true);
  clearTimeout(onlineRefreshTimer);
  onlineRefreshTimer = setTimeout(() => {
    refreshDataSafely().catch(() => {});
  }, 800);
});

window.addEventListener('offline', () => {
  document.documentElement.classList.add('is-offline');
  toast('オフラインです。前回の内容を表示しています');
});

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => {
    syncLiquidPills({ animate: false });
  });
}
if (document.fonts && document.fonts.addEventListener) {
  document.fonts.addEventListener('loadingdone', () => {
    syncLiquidPills({ animate: false });
  });
}

window.addEventListener('load', function(){
  initLiquid();
  if(loadCfg()) load(); else openSetup();
  requestAnimationFrame(function() {
    updateNavigationState();
    updateSeg();
    syncLiquidPills({ animate: false });
    requestScrollFrame();
  });
});
</script>
