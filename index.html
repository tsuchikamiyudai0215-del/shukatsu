<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>就活</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="就活">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --ink:#030305;
  --surface:linear-gradient(180deg, rgba(255,255,255,0.09) 0%, rgba(255,255,255,0.02) 100%), rgba(20,20,26,0.58);
  --hi:linear-gradient(180deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.03) 100%), rgba(18,18,24,0.85);
  --chrome:linear-gradient(180deg, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0.03) 100%), rgba(22,22,30,0.62);
  --line:rgba(255,255,255,0.16);
  --line-soft:rgba(255,255,255,0.08);
  --text:#FFFFFF; --muted:#A6A6B2; --dim:#6E6E7A;
  --blue:#0A84FF; --go:#30D158; --wait:#FF9F0A; --hot:#FF453A; --fail:#6B4A54;
  
  /* 超立体ガラスエッジ & 多層スペキュラ光 */
  --glass-border: 1px solid rgba(255,255,255,0.22);
  --glass-edge: 
    inset 0 1.5px 0.5px 0 rgba(255,255,255,0.55),
    inset 0 -1.5px 1px 0 rgba(0,0,0,0.6),
    inset 1px 0 0.5px 0 rgba(255,255,255,0.25),
    inset -1px 0 0.5px 0 rgba(255,255,255,0.25),
    inset 0 0 24px 0 rgba(255,255,255,0.04);
  --glass-drop:
    0 2px 6px rgba(0,0,0,0.35),
    0 14px 34px rgba(0,0,0,0.65),
    0 0 28px rgba(255,255,255,0.05);
  --glass-drop-lg:
    0 4px 14px rgba(0,0,0,0.45),
    0 30px 70px rgba(0,0,0,0.85),
    0 0 45px rgba(255,255,255,0.08);

  --sheen:linear-gradient(135deg, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0.03) 38%, rgba(255,255,255,0) 65%);

  /* Apple Fluid Motion */
  --apple-spring:cubic-bezier(.32,.72,0,1);
  --apple-ease:cubic-bezier(.25,.1,.25,1);
  --apple-press:cubic-bezier(.2,0,0,1);
  --apple-pop:cubic-bezier(.34,1.4,.5,1);
  --apple-bounce:cubic-bezier(.2,1.32,.32,1);
  --apple-out:cubic-bezier(.55,0,.85,.35);
  --disp:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
*::-webkit-scrollbar{width:6px;height:6px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:999px}
*::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.4)}

/* 背景に環境光フレアを配置（ガラスの透け感を最大化） */
html{
  background: var(--ink);
  background-image: 
    radial-gradient(circle at 15% 10%, rgba(10,132,255,0.14) 0%, transparent 40%),
    radial-gradient(circle at 85% 35%, rgba(48,209,88,0.10) 0%, transparent 45%),
    radial-gradient(circle at 50% 85%, rgba(120,60,220,0.12) 0%, transparent 50%);
  background-attachment: fixed;
  -webkit-text-size-adjust:100%;
  scroll-padding-bottom:120px;
}
body{
  overscroll-behavior-y:none;margin:0;background:transparent;color:var(--text);
  font-family:var(--body);font-variant-numeric:tabular-nums;
  padding:calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
          calc(130px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  max-width:480px;margin:0 auto;
}
button,select,input{font-family:var(--body)}
.tabbar{-webkit-user-select:none;user-select:none}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:200;background:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  transition:opacity .35s var(--apple-ease),visibility .35s}
#splash.gone{opacity:0;visibility:hidden;pointer-events:none}
#splash .mark{font-size:28px;font-weight:700;letter-spacing:.26em;color:var(--text);
  padding-left:.26em;animation:popIn .55s var(--apple-pop)}
#splash .rule{width:54px;height:1px;background:var(--line);position:relative;overflow:hidden}
#splash .rule::after{content:'';position:absolute;inset:0;background:var(--text);
  transform:translateX(-100%);animation:sweep 1.1s var(--apple-ease) infinite}
#splash .sub{font-family:var(--mono);font-size:9px;letter-spacing:.3em;color:var(--dim)}

/* ---------- type ---------- */
.lab{margin:24px 0 8px;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.2em}
.hero{padding-bottom:20px;border-bottom:1px solid var(--line-soft);margin-bottom:2px;cursor:pointer;
  transition:transform .28s var(--apple-spring),opacity .2s var(--apple-ease)}
.hero:active{transform:scale(.985);opacity:.8;transition:transform .12s var(--apple-press)}
.hero h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.02em}
.cd{line-height:1;display:flex;align-items:baseline;margin-top:14px}
.cd b{font-family:var(--disp);font-size:52px;font-weight:600;letter-spacing:-.035em}
.cd s{font-family:var(--mono);font-size:12px;color:var(--muted);margin:0 10px 0 3px;text-decoration:none}

/* ---------- strip & cards (ガラス化) ---------- */
.strip{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 4px}
.stripitem{display:inline-flex;align-items:center;gap:10px;width:100%;max-width:380px;
  text-align:left;cursor:pointer;
  background:var(--surface);
  backdrop-filter:blur(24px) saturate(220%) brightness(1.1);
  -webkit-backdrop-filter:blur(24px) saturate(220%) brightness(1.1);
  border:var(--glass-border);border-radius:16px;padding:12px 15px;color:var(--text);
  box-shadow:var(--glass-edge),var(--glass-drop);
  transition:transform .5s var(--apple-bounce),opacity .2s var(--apple-ease)}
.stripitem:active{transform:scale(.96);transition:transform .14s var(--apple-press)}
.stripitem .k{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--muted);
  border:1px solid var(--line);border-radius:5px;padding:2px 6px;flex:0 0 auto;background:rgba(255,255,255,.08)}
.stripitem .n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stripitem .d{margin-left:auto;font-family:var(--disp);font-size:15px;font-weight:600;flex:0 0 auto}
.stripitem .w{font-family:var(--mono);font-size:10px;color:var(--dim);flex:0 0 auto}

/* ---------- rows (ガラスカード) ---------- */
.row{
  background:var(--surface);
  backdrop-filter:blur(28px) saturate(230%) brightness(1.08);
  -webkit-backdrop-filter:blur(28px) saturate(230%) brightness(1.08);
  border:var(--glass-border);border-radius:18px;
  box-shadow:var(--glass-edge),var(--glass-drop);
  margin-bottom:10px;overflow:hidden;cursor:pointer;
  display:flex;flex-direction:column;justify-content:space-between;
  opacity:var(--base-op, 1);
  transition:transform .5s var(--apple-bounce),opacity .2s var(--apple-ease),box-shadow .3s var(--apple-ease)}
.row:active{transform:scale(.955);transition:transform .14s var(--apple-press)}
.row.is-fixed{
  background:linear-gradient(180deg, rgba(48,209,88,0.22) 0%, rgba(12,30,20,0.65) 100%), rgba(20,40,28,0.6);
  border-color:rgba(48,209,88,.45);
  box-shadow:var(--glass-edge),var(--glass-drop),0 0 20px rgba(48,209,88,.22)}
.row.is-offer{
  background:linear-gradient(180deg, rgba(48,209,88,0.28) 0%, rgba(12,32,21,0.72) 100%), rgba(22,48,30,0.65);
  border-color:rgba(48,209,88,.65);
  box-shadow:var(--glass-edge),var(--glass-drop),0 0 28px rgba(48,209,88,.32)}
.row.is-muted{--base-op:0.45}

.row .main{padding:14px 15px 12px;display:flex;align-items:center;gap:14px;flex:1 1 auto}
.day{width:60px;flex:0 0 auto;text-align:center}
.day b{font-family:var(--disp);font-size:32px;font-weight:600;letter-spacing:-.035em;
  line-height:1;display:block}
.day s{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.12em;
  margin-top:4px;display:block;text-decoration:none}
.day .tag{font-family:var(--mono);font-size:10px;letter-spacing:.1em;line-height:1.5}
.body1{min-width:0;flex:1}
.meta{display:flex;align-items:center;gap:8px}
.meta em{font-family:var(--mono);font-size:12px;color:var(--muted);font-style:normal;letter-spacing:.04em}
.meta i{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim);font-style:normal}
.name{font-size:16px;font-weight:600;letter-spacing:-.01em;margin-top:5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px}
.acts{display:flex;gap:8px;padding:0 15px 12px 74px;flex:0 0 auto}
.gh{
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.2);
  color:var(--muted);
  border-radius:10px;padding:6px 14px;font-size:12px;cursor:pointer;text-decoration:none;
  display:inline-block;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 2px 6px rgba(0,0,0,.2);
  transition:transform .24s var(--apple-spring),background .18s var(--apple-ease),color .18s var(--apple-ease)}
.gh:active{transform:scale(.9);transition:transform .14s var(--apple-press)}
.logo{width:28px;height:28px;border-radius:14px;flex:0 0 auto;display:flex;align-items:center;
  justify-content:center;overflow:hidden;background:#fff;
  box-shadow:0 0 0 .5px rgba(0,0,0,.4)}
.logo img{width:78%;height:78%;object-fit:contain}
.logo.mono{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.25)}
.logo.mono span{color:#E5E5EA;font-weight:600}

/* ---------- sheet / card (ガラスモーダル) ---------- */
.sheet{position:fixed;inset:0;height:100dvh;background:rgba(0,0,0,.68);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  display:flex;align-items:flex-end;justify-content:center;z-index:50;
  padding:0 10px calc(10px + env(safe-area-inset-bottom));
  opacity:0;pointer-events:none;
  transition:opacity .26s var(--apple-ease);
  transform:translateZ(0)}
.sheet.is-active{opacity:1;pointer-events:auto}
.card{position:relative;background:var(--hi);
  backdrop-filter:blur(36px) saturate(240%) brightness(1.12);
  -webkit-backdrop-filter:blur(36px) saturate(240%) brightness(1.12);
  box-shadow:var(--glass-edge),var(--glass-drop-lg);
  width:100%;max-width:480px;
  height:85vh;height:85dvh;display:flex;flex-direction:column;overflow:hidden;
  border-radius:28px;border:var(--glass-border);
  padding:10px 20px calc(14px + env(safe-area-inset-bottom));
  transform:translate3d(0,102%,0) scale(.96);
  transition:transform .58s var(--apple-bounce),opacity .24s var(--apple-ease)}
.sheet.is-active .card{transform:translate3d(0,0,0) scale(1)}

.grab{width:38px;height:5px;background:rgba(255,255,255,.3);border-radius:3px;margin:0 auto 16px;
  transition:background .2s var(--apple-ease);flex:0 0 auto}
.card.drag .grab{background:rgba(255,255,255,.6)}
.sheet.out{opacity:0}
.sheet.out .card{transform:translate3d(0,100%,0) scale(.97);transition:transform .34s var(--apple-out)}
.sheet .card.drag{transition:none}
.sheet .card.spring{transition:transform .5s var(--apple-bounce)}
.sheet .card.fly{transition:transform .26s var(--apple-spring),opacity .2s var(--apple-ease)}
.sideclose{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:15px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);color:var(--muted);font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;line-height:1;z-index:5;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .24s var(--apple-spring),background .18s var(--apple-ease),color .18s var(--apple-ease)}
.sideclose:active{transform:scale(.92);transition:transform .12s var(--apple-press)}
.sideclose:hover{background:rgba(255,255,255,.22);color:var(--text)}

/* ---------- detail header & tab content ---------- */
.card-head{flex:0 0 auto;padding-right:40px;animation:rise .42s var(--apple-spring) both}
.tabs{display:flex;gap:2px;margin-top:20px;border-bottom:1px solid var(--line-soft);position:relative}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);
  padding:11px 12px;font-size:13px;font-weight:500;cursor:pointer;
  transition:color .2s var(--apple-ease),border-color .2s var(--apple-ease),transform .24s var(--apple-spring)}
.tabs button:active{transform:scale(.96);transition:transform .12s var(--apple-press)}
.tabs button.on{color:var(--text);border-bottom-color:var(--text)}

.tab-pane{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:32px;padding-right:4px;animation:tabPaneIn .4s var(--apple-bounce) both}
@keyframes tabPaneIn{
  from{opacity:0;transform:translate3d(14px,0,0)}
  to{opacity:1;transform:translate3d(0,0,0)}
}

.kv{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.kv span:first-child{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.kv span:last-child{font-size:13px;text-align:right;word-break:break-all;margin-left:16px}
.f{width:100%;
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.18);border-radius:12px;
  padding:12px 14px;color:var(--text);font-size:14px;outline:none;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.4);
  transition:border-color .2s var(--apple-ease),background .2s var(--apple-ease),box-shadow .2s var(--apple-ease)}
.f:focus{border-color:var(--blue);background:rgba(0,0,0,.55);box-shadow:0 0 0 3.5px rgba(10,132,255,.35), inset 0 1px 2px rgba(0,0,0,.5)}
.card .f{margin-top:8px}
.big{width:100%;padding:14px 0;border-radius:14px;border:none;font-size:14px;font-weight:600;
  cursor:pointer;margin-top:12px;display:block;text-align:center;text-decoration:none;
  box-shadow:0 4px 14px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .5s var(--apple-bounce),opacity .2s var(--apple-ease)}
.big:active{transform:scale(.94);transition:transform .14s var(--apple-press)}
.big[disabled]{opacity:.4;cursor:default}
.rail{display:flex;align-items:center}
.rail i{flex:0 0 auto;border-radius:9px;display:block;transition:all .32s var(--apple-spring)}
.rail u{height:1px;flex:1;display:block}
.railtxt{display:flex;justify-content:space-between;margin-top:8px}
.railtxt span{font-size:8.5px;color:var(--dim);flex:1;text-align:center}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:6px}

/* ---------- 究極リキッドグラス・ドック & セグメント ---------- */
.tabbar, .seg{
  touch-action:none;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  position:relative;isolation:isolate;
  background:var(--chrome);
  backdrop-filter:blur(40px) saturate(240%) brightness(1.15) contrast(1.05);
  -webkit-backdrop-filter:blur(40px) saturate(240%) brightness(1.15) contrast(1.05);
  border:var(--glass-border);
  box-shadow:var(--glass-edge),var(--glass-drop);
  transition:transform .34s var(--apple-pop), background .3s var(--apple-ease),
             border-color .3s var(--apple-ease), box-shadow .3s var(--apple-ease);
}

.tabbar{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom));z-index:45;
  display:inline-flex;align-items:center;justify-content:center;gap:2px;
  white-space:nowrap;max-width:calc(100vw - 24px);
  border-radius:34px;padding:5px;--pw:88px;--pg:2px}
.tabbar button{background:none;border:none;color:var(--muted);font-size:13px;font-weight:600;
  padding:10px 0;border-radius:28px;cursor:pointer;position:relative;z-index:1;
  white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
  transition:color .24s var(--apple-ease),transform .24s var(--apple-spring)}
.tabbar button:active{transform:scale(.95);transition:transform .12s var(--apple-press)}
.tabbar button:not(.ico){width:var(--pw)}
.tabbar button.on{color:#000}

.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:2px;margin:0 auto 16px;max-width:320px;
  border-radius:34px;padding:4px}
.seg button{background:none;border:none;color:var(--muted);position:relative;z-index:1;
  border-radius:28px;padding:10px 0;font-size:13px;font-weight:600;cursor:pointer;
  white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;
  transition:color .24s var(--apple-ease),transform .24s var(--apple-spring)}
.seg button:active{transform:scale(.96);transition:transform .12s var(--apple-press)}
.seg button.on{color:#000}
.sgn{font-family:var(--mono);font-size:10px;margin-left:7px;opacity:.65}

/* ピル（純度100%の厚みあるクリスタルガラス） */
.pill{
  position:absolute;z-index:0;pointer-events:none;
  border-radius:28px;
  background:linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(240,240,248,0.92) 100%);
  box-shadow:
    0 3px 12px rgba(0,0,0,0.32),
    inset 0 1.5px 0.5px #FFFFFF,
    inset 0 -1.5px 1px rgba(0,0,0,0.15);
  transform:translate3d(0,0,0);
  transition:transform .52s var(--apple-bounce);
  will-change:transform;
  overflow:hidden;
}
.tabbar .pill{left:5px;top:5px;width:var(--pw);height:calc(100% - 10px)}
.tabbar.p1 .pill{transform:translate3d(calc(var(--pw) + var(--pg)),0,0)}

.seg .pill{left:4px;top:4px;height:calc(100% - 8px);width:calc((100% - 8px) / 2)}
.seg.i1 .pill{transform:translate3d(100%,0,0)}

/* 表面の鏡面ハイライト追従 */
.tabbar::before,.seg::before{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;
  opacity:0;transition:opacity .3s var(--apple-ease);
  background:
    radial-gradient(120% 180% at var(--hx,50%) -30%,
      rgba(255,255,255,.65) 0%,rgba(255,255,255,.16) 34%,rgba(255,255,255,0) 65%),
    linear-gradient(180deg,rgba(255,255,255,.3) 0%,rgba(255,255,255,0) 36%,rgba(255,255,255,.1) 100%)}
.tabbar.lifted::before,.seg.lifted::before{opacity:1}

.tabbar.lifted, .seg.lifted{
  background:linear-gradient(180deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.06) 100%), rgba(36,36,46,0.72);
  border-color:rgba(255,255,255,.5);
  box-shadow:
    inset 0 2px 1px rgba(255,255,255,.8),
    inset 0 -1.5px 1px rgba(0,0,0,.6),
    0 0 36px rgba(255,255,255,.25),
    0 30px 80px rgba(0,0,0,.9);
}
.tabbar.lifted{transform:translateX(-50%) scale(1.06)}
.seg.lifted{transform:scale(1.05)}
@media (min-width:1000px){ .tabbar.lifted{transform:scale(1.06)} }

/* 掴んでいる間の液状化ピル（透明なプリズムレンズ） */
.grabbing .pill, .dragpill .pill{
  transition:none !important;
  background:linear-gradient(135deg, rgba(255,255,255,0.65) 0%, rgba(255,255,255,0.28) 100%) !important;
  backdrop-filter:blur(24px) saturate(240%) brightness(1.2) !important;
  -webkit-backdrop-filter:blur(24px) saturate(240%) brightness(1.2) !important;
  box-shadow:
    0 16px 36px rgba(0,0,0,.5),
    0 0 26px rgba(255,255,255,.5),
    inset 0 2px 2px rgba(255,255,255,1),
    inset 0 -2px 4px rgba(0,0,0,.35),
    inset 0 0 16px rgba(255,255,255,0.4) !important;
}
.grabbing button, .dragpill button{color:var(--text) !important}
.settling .pill{transition:transform .54s var(--apple-bounce)}

.tabbar .sep{width:1px;height:20px;background:var(--line);margin:0 4px;flex-shrink:0}
.tabbar .ico{padding:10px 15px;font-size:18px;font-weight:400;color:var(--text);line-height:1;white-space:nowrap;flex-shrink:0}

/* ---------- passport ---------- */
.ptitle{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.2em;margin-bottom:12px}
.pwrap{display:flex;flex-direction:column;gap:12px}
.pcol{display:contents}

.chiprow button{flex:0 0 auto;

/* ---------- motion ---------- */

}

@media (prefers-reduced-motion:reduce){

    transition-duration:.01ms !important}
}

<script>
/* ============ 定数 ============ */
var DEFAULT_ROUTE = ['エントリー','ES','適性検査','GD','面接','最終面接','内定'];
var PALETTE = ['エントリー','ES','適性検査','Webテスト','GD','面談','一次面接','二次面接','三次面接','面接','最終面接','インターン','内定'];
try{
  var _cs=JSON.parse(localStorage.getItem('sk_stages')||'[]');
  _cs.forEach(function(x){ if(PALETTE.indexOf(x)<0) PALETTE.push(x) });
}catch(e){}
function rememberStage(name){
  if(!name)return;
  if(PALETTE.indexOf(name)<0) PALETTE.push(name);
  try{
    var a=JSON.parse(localStorage.getItem('sk_stages')||'[]');
    if(a.indexOf(name)<0){ a.push(name); localStorage.setItem('sk_stages',JSON.stringify(a)); }
  }catch(e){}
}
var KINDS = ['面接','説明会','GD','面談','インターン','適性検査'];
var WD = ['日','月','火','水','木','金','土'];
var NONCO = ['テストセンター','テストセンター受験','Webテスト'];
function isCo(it){return NONCO.indexOf(it.c)<0}

var DATA = {items:[],events:[]};
var openCo = null, tab = 'info';
var TERM = '夏インターン';
var TERMS = ['夏インターン','本選考'];
var FILT = 'all', PAGE = 'list';
var VIEWKEY = '';

function ensureShell(){
  var app=document.getElementById('app');
  if(document.getElementById('view')) return;
  app.innerHTML='<div id="segHost"></div><div id="view"></div>';
  var host=document.getElementById('segHost');
  host.innerHTML='<div class="seg" id="seg"><span class="pill"></span>'+
    TERMS.map(function(t,i){
      return '<button id="sg'+i+'" onclick="setTerm(\''+t+'\')">'+
             '<span>'+t+'</span><span class="sgn"></span></button>';
    }).join('')+'</div>';
  initLiquid();
}
function updateSeg(){
  var seg=document.getElementById('seg');
  if(!seg)return;
  TERMS.forEach(function(t,i){
    var b=document.getElementById('sg'+i);
    if(!b)return;
    b.className = (TERM===t)?'on':'';
    b.querySelector('.sgn').textContent =
      DATA.items.filter(function(x){return (x.term||'夏インターン')===t}).length;
  });
  seg.classList.toggle('i1', TERM===TERMS[1]);
}
function markEnter(force){
  var el=document.getElementById('view');
  if(!el)return;
  var key=PAGE+'|'+TERM;
  if(!force && key===VIEWKEY){ el.classList.remove('enter'); return; }
  VIEWKEY=key;
  el.classList.remove('enter');
  void el.offsetWidth;
  el.classList.add('enter');
}

/* ============ ユーティリティ ============ */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function D(s){
  if(!s)return null;
  var d = new Date(String(s).replace(/-/g,'/').replace('T',' '));
  return isNaN(d.getTime()) ? null : d;
}
function fdate(s){var d=D(s);return d?(d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')':''}
function ftime(s){var d=D(s);return d?('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2):''}
function rem(s){
  var d=D(s);if(!d)return null;
  var ms=d-new Date();if(ms<=0)return null;
  var t=Math.floor(ms/1000);
  return {ms:ms,d:Math.floor(t/86400),h:Math.floor(t%86400/3600),m:Math.floor(t%3600/60),s:t%60};
}
function since(s){
  var d=D(s);if(!d)return null;
  var now = new Date();
  var d0 = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  var now0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  var diff = Math.floor((now0 - d0) / 86400000);
  return Math.max(0, diff);
}
function routeOf(it){return (it.route&&it.route.length)?it.route:DEFAULT_ROUTE}
function isWide(){return window.innerWidth>=1000}
function ITEMS(){return DATA.items.filter(function(i){return (i.term||'夏インターン')===TERM})}
function EVENTS(){return DATA.events.filter(function(e){return (e.term||'夏インターン')===TERM})}
function byCo(c){var L=ITEMS();for(var i=0;i<L.length;i++){if(L[i].c===c)return L[i]}return null}
function evOf(c){return EVENTS().filter(function(e){return e.c===c}).sort(function(a,b){return (a.at||'').localeCompare(b.at||'')})}
function nextEv(c){var f=evOf(c).filter(function(e){return rem(e.at)});return f[0]||null}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}

/* ============ ロゴ ============ */
var LOGOS = {}, tried = {};
function logo(it,size){
  var s=size||28;
  var st='width:'+s+'px;height:'+s+'px;border-radius:'+(s/2)+'px';
  var cached=LOGOS[it.c];
  if(cached&&cached!=='none')
    return '<div class="logo" style="'+st+'" data-co="'+esc(it.c)+'" data-sz="'+s+'">'+
      '<img loading="lazy" decoding="async" referrerpolicy="no-referrer" src="'+esc(cached)+'" onerror="logoErr(this)"></div>';
  if(it.dom&&cached!=='none')
    return '<div class="logo" style="'+st+'" data-co="'+esc(it.c)+'" data-sz="'+s+'">'+
      '<img loading="lazy" decoding="async" referrerpolicy="no-referrer" src="https://icons.duckduckgo.com/ip3/'+esc(it.dom)+'.ico" onerror="logoErr(this)"></div>';
  return monoLogo(it.c,s);
}
function monoLogo(name,s){
  return '<div class="logo mono" style="width:'+s+'px;height:'+s+'px;border-radius:'+(s/2)+'px" '+
    'data-co="'+esc(name)+'" data-sz="'+s+'">'+
    '<span style="font-size:'+Math.round(s*0.42)+'px">'+esc(String(name).slice(0,1))+'</span></div>';
}
function logoErr(img){
  var box=img.parentNode;
  if(box && box.dataset){
    box.outerHTML=monoLogo(box.dataset.co, parseFloat(box.dataset.sz)||28);
  }
}
function wdLogo(name){
  var s='https://www.wikidata.org/w/api.php?action=wbsearchentities&search='+
    encodeURIComponent(name)+'&language=ja&uselang=ja&type=item&limit=1&format=json&origin=*';
  return fetch(s).then(function(r){return r.json()}).then(function(j){
    var id=j.search&&j.search[0]&&j.search[0].id;
    if(!id)return null;
    return fetch('https://www.wikidata.org/w/api.php?action=wbgetclaims&entity='+id+
      '&property=P154&format=json&origin=*').then(function(r){return r.json()}).then(function(j2){
      var c=j2.claims&&j2.claims.P154&&j2.claims.P154[0];
      var f=c&&c.mainsnak&&c.mainsnak.datavalue&&c.mainsnak.datavalue.value;
      return f?'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(f)+'?width=240':null;
    });
  }).catch(function(){return null});
}
function wpThumb(name){
  var q='https://ja.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+
    encodeURIComponent(name)+'&gsrlimit=1&prop=pageimages&piprop=thumbnail&pithumbsize=200&format=json&origin=*';
  return fetch(q).then(function(r){return r.json()}).then(function(j){
    var p=j&&j.query&&j.query.pages;
    if(p)for(var k in p){if(p[k].thumbnail&&p[k].thumbnail.source)return p[k].thumbnail.source}
    return null;
  }).catch(function(){return null});
}
function hydrateLogos(){
  DATA.items.forEach(function(it){
    if(!isCo(it)){tried[it.c]=1;return}
    if(LOGOS[it.c]||tried[it.c])return;
    tried[it.c]=1;
    wdLogo(it.c).then(function(u){return u||wpThumb(it.c)}).then(function(u){
      var url=u||'none';
      LOGOS[it.c]=url;
      api('apiSaveLogo',[it.c,url]).catch(function(){});
      if(url!=='none')paintLogo(it.c,url);
    });
  });
}
function refetchLogo(co){
  delete LOGOS[co]; delete tried[co]; tried[co]=1;
  wdLogo(co).then(function(u){return u||wpThumb(co)}).then(function(u){
    var url=u||'none';
    LOGOS[co]=url;
    api('apiSaveLogo',[co,url]).catch(function(){});
    render(false);
    toast(url==='none'?'ロゴが見つかりませんでした':'ロゴを取り直しました',url!=='none');
  });
}
function setLogoUrl(co){
  var el=document.getElementById('logoUrl');
  var v=el?el.value.trim():'';
  if(!v){toast('画像URLを入れてください');return}
  LOGOS[co]=v; tried[co]=1;
  api('apiSaveLogo',[co,v]).catch(function(){});
  render(false);
  toast('ロゴを設定しました',true);
}
function paintLogo(co,url){
  var list=document.querySelectorAll('[data-co]');
  for(var i=0;i<list.length;i++){
    var b=list[i];
    if(b.dataset.co!==co)continue;
    var s=parseFloat(b.dataset.sz)||28;
    b.className='logo';
    b.style.cssText='width:'+s+'px;height:'+s+'px;border-radius:'+(s/2)+'px';
    b.innerHTML='<img loading="lazy" decoding="async" referrerpolicy="no-referrer" src="'+esc(url)+'" onerror="logoErr(this)">';
  }
}

/* ============ 通信 ============ */
var CFG={ep:'',key:''};
function loadCfg(){
  try{
    CFG.ep = localStorage.getItem('sk_ep')||'';
    CFG.key= localStorage.getItem('sk_key')||'';
  }catch(e){}
  return !!(CFG.ep&&CFG.key);
}
function saveCfg(ep,key){
  CFG.ep=ep; CFG.key=key;
  try{ localStorage.setItem('sk_ep',ep); localStorage.setItem('sk_key',key); }catch(e){}
}
function api(action,args){
  return fetch(CFG.ep,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({key:CFG.key,action:action,args:args||[]}),
    redirect:'follow'
  }).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(j){
    if(j&&j.ok===false) throw new Error(j.error==='unauthorized'?'鍵が違います':j.error);
    return j;
  });
}
function busy(on){document.getElementById('busy').style.display=on?'flex':'none'}
function applyData(j,cb){
  DATA=j;
  if(j&&j.items&&j.items.length) cacheSave(j);
  if(DATA.logos)for(var k in DATA.logos)if(!LOGOS[k])LOGOS[k]=DATA.logos[k];
  render(false); hydrateLogos(); if(cb)cb();
}
function call(fn,args,cb){
  busy(true);
  api(fn,args).then(function(j){ busy(false); applyData(j,cb); })
  .catch(function(e){
    busy(false); hideSplash();
    resetUi();
    document.getElementById('app').innerHTML=
      '<div style="color:var(--dim);font-size:13px;line-height:1.9;padding:40px 0">'+
      '読み込めませんでした。<br>'+esc(e&&e.message?e.message:'')+
      '<br><br><button class="gh" onclick="location.reload()">再読み込み</button>'+
      '<button class="gh" style="margin-left:8px" onclick="openSetup()">接続設定</button></div>';
  });
}
function resetUi(){
  var box=document.getElementById('sheet');
  if(box) box.innerHTML='';
  if(typeof bgPush==='function') bgPush(false);
  if(locked){ locked=false; lockScroll(false); }
  pushed=false;
  openCo=null;
  document.body.classList.remove('sheet-open');
  var dock=document.getElementById('tabbar');
  if(dock) dock.style.display='';
  var side=document.getElementById('side');
  if(side){ side.dataset.co=''; side.innerHTML=''; }
}
var booted=false;
function hideSplash(){
  if(booted)return; booted=true;
  var el=document.getElementById('splash');
  if(el){el.classList.add('gone');setTimeout(function(){if(el.parentNode)el.remove()},350)}
}
function cacheSave(j){
  try{ localStorage.setItem('sk_cache', JSON.stringify(
    {items:j.items||[], events:j.events||[], logos:j.logos||{}, at:Date.now()})); }catch(e){}
}
function cacheLoad(){
  try{ return JSON.parse(localStorage.getItem('sk_cache')||'null'); }catch(e){ return null }
}
function load(){
  var c=cacheLoad();
  if(c && c.items && c.items.length){
    applyData(c, hideSplash);
    var st=document.getElementById('stale');
    if(st) st.classList.add('on');
    api('apiGetData',[]).then(function(j){
      if(!j||!j.items) return;
      cacheSave(j);
      applyData(j);
      var e=document.getElementById('stale'); if(e) e.classList.remove('on');
    }).catch(function(){
      var e=document.getElementById('stale');
      if(e){ e.textContent='最新を取得できませんでした'; }
      toast('最新を取得できませんでした。前回の内容を表示しています');
    });
    return;
  }
  call('apiGetData',[],hideSplash);
}

/* ============ 楽観的更新 ============ */
function toast(msg,ok){
  var el=document.getElementById('toast');
  el.textContent=msg;
  el.style.borderColor = ok?'rgba(48,209,88,.6)':'rgba(255,69,58,.6)';
  el.classList.add('on');
  clearTimeout(window._tt);
  window._tt=setTimeout(function(){el.classList.remove('on')},2200);
}
function opt(mutate,fn,args,label){
  var snap=JSON.stringify(DATA.items);
  mutate();
  render(false);
  api(fn,args).then(function(d){
    if(d&&d.items){ DATA.items=d.items; DATA.events=d.events; }
    render(false);
  }).catch(function(){
    DATA.items=JSON.parse(snap);
    render(false);
    toast('保存できませんでした。通信を確認してください');
  });
  if(label)toast(label,true);
}
function find_(co){
  for(var i=0;i<DATA.items.length;i++){
    if(DATA.items[i].c===co&&(DATA.items[i].term||'夏インターン')===TERM)return DATA.items[i];
  }
  return null;
}
function doDone(co){
  opt(function(){var it=find_(co);if(!it)return;it.status='結果待ち';it.since=todayStr();},
      'apiMarkDone',[co,TERM],'結果待ちに移しました');
}
function doPass(co){
  opt(function(){
    var it=find_(co);if(!it)return;
    var r=routeOf(it),i=r.indexOf(it.stage);
    if(i<0||i>=r.length-2){it.status='内定';it.on=todayStr();}
    else{it.stage=r[i+1];it.status='対応中';it.due=null;it.since=null;}
  },'apiMarkPass',[co,TERM],'通過を記録しました');
}
function doPrevStage(co){
  var it=find_(co); if(!it)return;
  var r=routeOf(it), cur=it.lost||it.stage, i=r.indexOf(cur);
  if(i<=0){ toast('これ以上前の選考段階はありません'); return; }
  var prev=r[i-1];
  opt(function(){
    var x=find_(co); if(!x)return;
    x.stage=prev; x.status='対応中';
    x.lost=''; x.on=null; x.due=null; x.since=null;
  },'apiPrevStage',[co,TERM,prev], prev+' に戻しました');
}
function doFail(co){
  opt(function(){var it=find_(co);if(!it)return;it.lost=it.stage;it.status='落選';it.on=todayStr();it.due=null;},
      'apiMarkFail',[co,TERM],'選考終了として記録しました');
}
function doStatus(co,st){
  opt(function(){
    var it=find_(co);if(!it)return;
    it.status=st;
    if(st==='結果待ち'&&!it.since)it.since=todayStr();
    if(st==='対応中'){it.lost='';it.on=null;}
  },'apiSetStatus',[co,TERM,st],st+'にしました');
}
function setDue(co){
  var el=document.getElementById('coDue');
  var v=el?el.value:'';
  call('apiSetDue',[co,TERM,v],function(){toast(v?'締切を更新しました':'締切を未定にしました',true)});
}

/* ============ 状態 ============ */
function stOf(it){
  var s=it.status||'';
  if(s==='見送り') return 'skip';
  if(s==='落選') return 'fail';
  if(s==='内定') return 'offer';
  if(s==='参加決定') return 'fixed';
  if(s==='結果待ち') return 'waiting';
  if(s==='対応中'&&it.due&&!rem(it.due)) return 'waiting';
  return 'todo';
}
function autoSent(it){return it.status==='対応中'&&it.due&&!rem(it.due)}

/* ============ 一覧描画 ============ */
function dayCell(n,color,unit){
  if(n==='TODAY') return '<b style="font-size:21px;color:'+color+'">TODAY</b>';
  return '<b style="color:'+color+'">'+n+'</b><s>'+(unit||'DAYS')+'</s>';
}
function rowHtml(it){
  var st=stOf(it), r=it.due?rem(it.due):null, left='', right='', sub='';
  if(st==='waiting'){
    var d=since(it.since||(it.due?it.due.slice(0,10):null));
    left='<b style="font-size:32px;color:'+(d>=14?'var(--hot)':'var(--wait)')+'">'+(d==null?'—':d)+'</b><s>DAYS 経過</s>';
    right=it.since?fdate(it.since)+' 提出':'';
    if(autoSent(it)) sub='<div class="sub" style="color:var(--wait)">締切経過で自動送り</div>';
  } else if(st==='fixed'){
    var ev=nextEv(it.c), rr=ev?rem(ev.at):null;
    left=rr?dayCell(rr.d===0?'TODAY':rr.d,'var(--go)'):'<span class="tag" style="color:var(--go)">参加<br>決定</span>';
    right=ev?fdate(ev.at)+' 実施':(it.on?fdate(it.on)+' 確定':'');
  } else if(st==='offer'){
    left='<span class="tag" style="color:var(--go)">内定</span>';
    right=it.on?fdate(it.on):'';
  } else if(st==='fail'){
    left='<span class="tag" style="color:var(--dim)">終了</span>';
    right=it.on?fdate(it.on):'';
  } else if(st==='skip'){
    left='<span class="tag" style="color:var(--dim)">見送り</span>';
  } else if(r){
    left=dayCell(r.d===0?'TODAY':r.d, r.d<=2?'var(--hot)':'var(--text)');
    right=fdate(it.due);
    if(!it.timeUnset) sub='<div class="sub">締切 '+ftime(it.due)+'</div>';
  } else {
    left='<span class="tag" style="color:var(--dim)">未定</span>';
  }

  var stop='event.stopPropagation();';
  var acts='';
  if(st==='todo') acts='<div class="acts"><button class="gh" onclick="'+stop+'doDone(\''+esc(it.c)+'\')">完了にする</button></div>';
  if(st==='waiting'){
    var rt=routeOf(it), last=rt.indexOf(it.stage)>=rt.length-2;
    acts='<div class="acts">'+
      '<button class="gh" style="border-color:rgba(48,209,88,.5);color:var(--go)" onclick="'+stop+'doPass(\''+esc(it.c)+'\')">'+(last?'内定':'通過')+'</button>'+
      '<button class="gh" onclick="'+stop+'confirmFail(\''+esc(it.c)+'\')">落選</button></div>';
  }

  var isMuted = (st==='fail'||st==='skip');
  return '<div class="row'+(st==='fixed'?' is-fixed':st==='offer'?' is-offer':'')+(isMuted?' is-muted':'')+
    '" data-cardco="'+esc(it.c)+'" onclick="openDetail(\''+esc(it.c)+'\')">'+
    '<div class="main">'+
      '<div class="day">'+left+'</div>'+
      '<div class="body1"><div class="meta">'+logo(it)+
        '<em>'+esc(it.lost||it.stage)+'</em>'+
        (isCo(it)?'':'<em style="color:var(--dim);font-size:10px">管理用</em>')+
        '<i>'+right+'</i></div>'+
        '<div class="name">'+esc(it.c)+'</div>'+sub+
      '</div></div>'+acts+'</div>';
}
function eventRowHtml(ev){
  var it=byCo(ev.c)||{c:ev.c,dom:''}, r=rem(ev.at);
  return '<div class="row" data-cardco="'+esc(ev.c)+'" onclick="openDetail(\''+esc(ev.c)+'\')"><div class="main">'+
    '<div class="day">'+(r?dayCell(r.d===0?'TODAY':r.d, r.d<=2?'var(--hot)':'var(--text)'):'<span class="tag" style="color:var(--dim)">終了</span>')+'</div>'+
    '<div class="body1"><div class="meta">'+logo(it)+
      '<em style="color:var(--text)">'+esc(ev.kind)+'</em><i>'+fdate(ev.at)+' '+ftime(ev.at)+'</i></div>'+
      '<div class="name">'+esc(ev.c)+'</div>'+
      (ev.place?'<div class="sub" style="font-family:var(--body)">'+esc(ev.place)+'</div>':'')+
    '</div></div></div>';
}

function setTerm(t){TERM=t;window.scrollTo(0,0);render(true)}
function syncPills(){
  var dock=document.getElementById('tabbar');
  if(dock) dock.classList.toggle('p1', PAGE!=='list');
  updateSeg();
}

function replayFilterMotion(){
  var box=document.querySelector('.lanes');
  if(!box)return;
  var vis=box.querySelectorAll('.lane:not(.is-filt-hidden) .row');
  for(var i=0;i<vis.length;i++) vis[i].style.setProperty('--fi', i<12?i:12);
  box.classList.remove('filt-in');
  void box.offsetWidth;
  box.classList.add('filt-in');
}
function setFilt(k){
  FILT = (FILT===k && k!=='all') ? 'all' : k;
  if(FILT==='end' && !window._end){ window._end=true; render(false); replayFilterMotion(); return; }
  if(FILT==='skip' && !window._skip){ window._skip=true; render(false); replayFilterMotion(); return; }

  var btns = document.querySelectorAll('.chiprow button');
  Array.prototype.forEach.call(btns,function(b){
    b.className = (b.getAttribute('data-filt')===FILT) ? 'on' : '';
  });

  var lanesBox = document.querySelector('.lanes');
  if(!lanesBox) return;
  lanesBox.classList.toggle('single', FILT!=='all');

  var lanes = lanesBox.querySelectorAll('.lane');
  Array.prototype.forEach.call(lanes,function(l){
    var lk = l.getAttribute('data-lane');
    if(!lk) return;
    if(FILT==='all'){
      if(lk==='end' || lk==='skip'){ l.classList.remove('is-filt-hidden'); return; }
      l.classList.remove('is-filt-hidden');
    } else {
      l.classList.toggle('is-filt-hidden', lk!==FILT);
    }
  });

  replayFilterMotion();
}

function setPage(p){
  PAGE=p;
  document.getElementById('tb-list').className = p==='list'?'on':'';
  document.getElementById('tb-pass').className = p==='pass'?'on':'';
  window.scrollTo(0,0);
  render(true);
  requestAnimationFrame(syncPills);
}
function toggleEnded(){window._end=!window._end;render(false)}
function toggleSkip(){window._skip=!window._skip;render(false)}

function render(pageChanged){
  ensureShell(); updateSeg();
  if(PAGE==='pass'){renderPassport(pageChanged);return}
  var ALL=ITEMS();
  var MGMT=ALL.filter(function(i){return !isCo(i)});
  var LIST=ALL.filter(isCo);
  var agenda=[];
  LIST.forEach(function(it){
    if(stOf(it)==='todo'&&it.due&&rem(it.due)) agenda.push({c:it.c,kind:'due',at:it.due,it:it});
  });
  EVENTS().forEach(function(ev){ if(rem(ev.at)) agenda.push({c:ev.c,kind:'event',at:ev.at,ev:ev,it:byCo(ev.c)}); });
  agenda.sort(function(a,b){return (D(a.at)||0)-(D(b.at)||0)});
  var hero=agenda[0];

  var h='';

  if(MGMT.length){
    h+='<div class="strip">';
    MGMT.forEach(function(it){
      var r=it.due?rem(it.due):null;
      var lab=r?(r.d===0?'今日':r.d+'日後'):(it.due?'期限切れ':'日程未定');
      h+='<button class="stripitem" onclick="openDetail(\''+esc(it.c)+'\')">'+
        '<span class="k">受験予定</span><span class="n">'+esc(it.c)+'</span>'+
        '<span class="d" style="color:'+(r&&r.d<=2?'var(--hot)':'var(--text)')+'">'+lab+'</span>'+
        (it.due?'<span class="w">'+fdate(it.due)+(it.timeUnset?'':' '+ftime(it.due))+'</span>':'')+
        '</button>';
    });
    h+='</div>';
  }

  if(hero){
    var it=hero.it||{c:hero.c,dom:''};
    var head=hero.kind==='due'?'次の締切':'次の'+hero.ev.kind;
    var stage=hero.kind==='due'?it.stage:hero.ev.kind;
    h+='<div class="hero" onclick="openDetail(\''+esc(hero.c)+'\')">'+
      '<div class="lab" style="margin:0">'+head+'</div>'+
      '<div style="display:flex;align-items:center;gap:10px;margin-top:10px">'+logo(it,36)+'<h1>'+esc(hero.c)+'</h1></div>'+
      '<div style="font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.06em">'+
        esc(stage)+' '+fdate(hero.at)+((hero.kind==='due'&&it.timeUnset)?'':' '+ftime(hero.at))+'</div>'+
      '<div class="cd" id="heroCd" data-at="'+esc(hero.at)+'"></div></div>';
  } else if(!DATA.items.length){
    h+='<div class="emptyNote">シートからデータを取得できていません。<br>'+
       'Sheet1 に行があるか、接続設定が正しいかを確認してください。'+
       '<button class="gh" style="display:block;margin:14px auto 0" onclick="resetCfg()">接続設定をやり直す</button></div>';
  } else {
    h+='<div style="color:var(--dim);font-size:14px;padding:20px 0">予定も締切もありません。</div>';
  }

  var events=agenda.filter(function(a){return a.kind==='event' && a!==hero});
  var todo=LIST.filter(function(x){
      return stOf(x)==='todo' && !(hero && hero.kind==='due' && hero.c===x.c);
    })
    .sort(function(a,b){return (D(a.due)||9e15)-(D(b.due)||9e15)});
  var fixed=LIST.filter(function(x){return stOf(x)==='fixed'});
  var waiting=LIST.filter(function(x){return stOf(x)==='waiting'})
    .sort(function(a,b){return (a.since||'').localeCompare(b.since||'')});
  var offers=LIST.filter(function(x){return stOf(x)==='offer'})
    .sort(function(a,b){return (b.on||'').localeCompare(a.on||'')});
  var ended=LIST.filter(function(x){return stOf(x)==='fail'})
    .sort(function(a,b){return (b.on||'').localeCompare(a.on||'')});
  var skipped=LIST.filter(function(x){return stOf(x)==='skip'});

  var G=[
    {k:'event', lab:'予定',    col:'var(--text)', n:events.length},
    {k:'todo',  lab:'対応中',  col:'var(--blue)', n:todo.length},
    {k:'offer', lab:'内定',    col:'var(--go)',   n:offers.length},
    {k:'fixed', lab:'参加決定',col:'var(--go)',   n:fixed.length},
    {k:'wait',  lab:'結果待ち',col:'var(--wait)', n:waiting.length},
    {k:'end',   lab:'終了',    col:'var(--dim)',  n:ended.length},
    {k:'skip',  lab:'見送り',  col:'var(--dim)',  n:skipped.length}
  ].filter(function(g){return g.n>0});

  h+='<div class="chips"><div class="chiprow">';
  h+='<button data-filt="all" class="'+(FILT==='all'?'on':'')+'" onclick="setFilt(\'all\')">すべて'+
     '<b>'+(events.length+todo.length+offers.length+fixed.length+waiting.length)+'</b></button>';
  G.forEach(function(g){
    h+='<button data-filt="'+g.k+'" class="'+(FILT===g.k?'on':'')+'" onclick="setFilt(\''+g.k+'\')">'+
       g.lab+'<b style="color:'+(FILT===g.k?'':g.col)+'">'+g.n+'</b></button>';
  });
  h+='</div></div>';

  var rows={
    event:function(){return events.map(function(a){return eventRowHtml(a.ev)}).join('')},
    todo :function(){return todo.map(rowHtml).join('')},
    offer:function(){return offers.map(rowHtml).join('')},
    fixed:function(){return fixed.map(rowHtml).join('')},
    wait :function(){return waiting.map(rowHtml).join('')},
    end  :function(){return ended.map(rowHtml).join('')},
    skip :function(){return skipped.map(rowHtml).join('')}
  };

  h+='<div class="lanes'+(FILT==='all'?'':' single')+'">';
  G.forEach(function(g){
    if(g.k==='end'||g.k==='skip')return;
    var isHidden = (FILT!=='all' && FILT!==g.k);
    h+='<section class="lane'+(isHidden?' is-filt-hidden':'')+'" data-lane="'+g.k+'">'+
       '<div class="lab" style="color:'+g.col+'">'+g.lab+'\u3000'+g.n+'件</div>'+
       '<div class="rows">'+rows[g.k]()+'</div></section>';
  });

  if(ended.length){
    var isEndHidden = (FILT!=='all' && FILT!=='end');
    h+='<section class="lane'+(isEndHidden?' is-filt-hidden':'')+'" data-lane="end">'+
       '<button class="lab accord-btn" onclick="toggleEnded()">'+
       '終了 '+ended.length+'件 '+(window._end?'▾':'▸')+'</button>'+
       (window._end?'<div class="rows">'+rows.end()+'</div>':'')+'</section>';
  }
  if(skipped.length){
    var isSkipHidden = (FILT!=='all' && FILT!=='skip');
    h+='<section class="lane'+(isSkipHidden?' is-filt-hidden':'')+'" data-lane="skip">'+
       '<button class="lab accord-btn" onclick="toggleSkip()">'+
       '見送り '+skipped.length+'件 '+(window._skip?'▾':'▸')+'</button>'+
       (window._skip?'<div class="rows">'+rows.skip()+'</div>':'')+'</section>';
  }
  h+='</div>';

  document.getElementById('view').innerHTML=h;
  if(pageChanged) markEnter(true);
  requestAnimationFrame(syncPills);

  var rws=document.querySelectorAll('#view .row');

/* ============ 操作 ============ */
function confirmFail(co){ if(confirm(co+' を選考終了にします。締切とカレンダー予定が消えます。')) doFail(co) }
function carryOver(co){
  if(!confirm(co+' を本選考に引き継ぎます。会社名・URL・ID・ロゴをコピーした行を作ります。'))return;
  call('apiCarryOver',[co,TERM],function(){closeOverlay();setTerm('本選考')});

/* ============ シート制御 ============ */
var lockY=0, pushed=false, locked=false;
function lockScroll(on){
  var de=document.documentElement;
  if(on){
    lockY=window.scrollY;
    de.style.overflow='hidden';
    document.body.style.overflow='hidden';
  }else{
    de.style.overflow='';
    document.body.style.overflow='';
    window.scrollTo(0,lockY);
  }
}
function bgPush(on){
  if(isWide())return;
  document.body.style.setProperty('--bgs','.93');
  document.body.classList.toggle('sheet-open', !!on);
}
function sheetOpened(){
  if(isWide()){bindSheetGesture();return}
  if(!locked){ locked=true; lockScroll(true); }
  requestAnimationFrame(function(){ bgPush(true) });
  if(!pushed){ pushed=true; history.pushState({sheet:1},''); }
  bindSheetGesture();
}
function closeOverlay(){
  var box=document.getElementById('sheet');
  var sh=box.querySelector('.sheet');
  if(!isWide()) openCo=null;
  if(!sh){ if(locked){locked=false;lockScroll(false)} return }
  sh.classList.remove('is-active');
  sh.classList.add('out');
  bgPush(false);
  setTimeout(function(){
    box.innerHTML='';
    if(locked){locked=false;lockScroll(false)}
  },300);
}
function closeSide(){ openCo=null; sideEmpty(); }
function closeDetail(){
  if(isWide()){ closeSide(); return; }
  closeSheet();
}
function closeSheet(e){
  if(e&&e.target!==e.currentTarget)return;
  var box=document.getElementById('sheet');
  if(box.innerHTML){
    if(!isWide()&&pushed){ history.back(); return }
    closeOverlay();
    return;
  }
  if(isWide()) closeSide();
}
window.addEventListener('popstate',function(){
  pushed=false;
  if(document.getElementById('sheet').innerHTML) closeOverlay();
});

function bindSheetGesture(){
  var card=document.querySelector('#sheet .card');
  if(!card||card._bound)return;
  card._bound=true;
  var sheet=card.parentNode;

  var y0=0, x0=0, t0=0, dy=0, active=false, tracking=false, raf=0;

  function getScrollTop(){
    var pane = card.querySelector('.tab-pane');
    return pane ? pane.scrollTop : card.scrollTop;
  }
  function applyTransform(){
    raf=0;
    if(!active)return;
    var d = Math.max(0, dy);
    var sc = Math.max(.90, 1 - d/2400);
    card.style.transform = 'translate3d(0,' + d + 'px,0) scale(' + sc + ')';
    var t = Math.min(1, d/320);
    document.body.style.setProperty('--bgs', (0.93 + t*0.07).toFixed(3));
  }

  card.addEventListener('touchstart',function(e){
    if(e.touches.length!==1) return;
    y0 = e.touches[0].clientY;
    x0 = e.touches[0].clientX;
    t0 = Date.now();
    dy = 0;
    active = false;
    tracking = true;
    card.classList.remove('spring','fly');
  },{passive:true});

  card.addEventListener('touchmove',function(e){
    if(!tracking || e.touches.length!==1) return;
    var cy = e.touches[0].clientY;
    var cx = e.touches[0].clientX;
    var vdy = cy - y0;
    var vdx = cx - x0;

    var st = getScrollTop();
    if(!active){
      if(Math.abs(vdx) > Math.abs(vdy)) { tracking = false; return; }
      if(st > 0){ y0 = cy; t0 = Date.now(); return; }
      if(vdy > 6){ active = true; card.classList.add('drag'); }
      else return;
    }
    if(active){
      dy = vdy;
      if(!raf) raf = requestAnimationFrame(applyTransform);
      if(e.cancelable) e.preventDefault();
    }
  },{passive:false});

  function end(){
    if(!tracking) return;
    tracking = false;
    if(raf){ cancelAnimationFrame(raf); raf=0; }
    if(!active) return;
    active = false;
    var dt = Math.max(1, Date.now() - t0);
    var v = dy / dt;
    var go = dy > 90 || v > 0.45;
    if(go) dismiss(); else bounce();
  }
  card.addEventListener('touchend', end);
  card.addEventListener('touchcancel', end);

  function bounce(){
    card.classList.remove('drag');
    card.classList.add('spring');
    card.style.transform = '';
    document.body.style.setProperty('--bgs','.93');
  }
  function dismiss(){
    card.classList.remove('drag');
    card.classList.add('fly');
    card.style.transform = 'translate3d(0,100%,0) scale(.97)';
    sheet.classList.remove('is-active');
    sheet.classList.add('out');
    bgPush(false);
    setTimeout(function(){
      if(!isWide()&&pushed){ history.back(); }
      else closeOverlay();
    }, 260);
  }
}

  if(!root) return;
  var tabs = root.querySelectorAll('.tabs button');
  Array.prototype.forEach.call(tabs,function(b){
    b.className = (b.getAttribute('data-tab')===k) ? 'on' : '';
  });
  var pane = root.querySelector('.tab-pane');
  if(pane){
    var it = byCo(openCo);
    if(it) pane.innerHTML = renderTabContent(it);
  }
}

function railHtml(it){
  var rt=routeOf(it), cur=it.lost||it.stage, idx=rt.indexOf(cur), dead=stOf(it)==='fail';
  var h='<div class="rail">';
  rt.forEach(function(s,i){
    var passed=idx>=0&&i<idx, here=idx===i;
    var col=dead?'var(--dim)':here?'var(--text)':passed?'var(--muted)':'var(--line)';
    var sz=here?8:5;
    h+='<div style="display:flex;align-items:center;'+(i===rt.length-1?'flex:0 0 auto':'flex:1')+'">'+
      '<i style="width:'+sz+'px;height:'+sz+'px;background:'+col+
      (here&&!dead?';box-shadow:0 0 0 4px rgba(255,255,255,.15)':'')+'"></i>'+
      (i<rt.length-1?'<u style="background:'+((passed&&!dead)?'var(--muted)':'var(--line)')+'"></u>':'')+'</div>';
  });
  h+='</div><div class="railtxt">';
  rt.forEach(function(s){h+='<span style="'+(s===cur?'color:var(--text)':'')+'">'+esc(s)+'</span>'});
  return h+'</div>';
}

function gcalUrl(title,at,details,allDay){
  var d=D(at); if(!d)return '#';
  var p=function(v){return ('0'+v).slice(-2)};
  var day=function(x){return x.getFullYear()+p(x.getMonth()+1)+p(x.getDate())};
  var dates;
  if(allDay){
    dates=day(d)+'/'+day(new Date(d.getTime()+86400000));
  }else{
    var f=function(x){return day(x)+'T'+p(x.getHours())+p(x.getMinutes())+'00'};
    dates=f(d)+'/'+f(new Date(d.getTime()+3600000));
  }
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+
    '&dates='+dates+'&ctz=Asia/Tokyo&details='+encodeURIComponent(details||'');
}

      ['info,概要','events,予定 '+evOf(it.c).length,'route,選考ルート'].map(function(x){

        return '<button data-tab="'+k+'" class="'+(tab===k?'on':'')+'" onclick="switchTab(\''+k+'\')">'+x.split(',')[1]+'</button>';
      }).join('')+'</div>';

  var fullHtml = '<div class="card-head">'+headHtml+'</div><div class="tab-pane">'+renderTabContent(it)+'</div>';

  if(isWide()){
    var side=document.getElementById('side');

  requestAnimationFrame(function(){
    var sh=box.querySelector('.sheet');
    if(sh) sh.classList.add('is-active');
  });

function mv(i,d){var it=byCo(openCo);if(!it)return;var r=routeOf(it).slice(),j=i+d;
  if(j<0||j>=r.length)return; var t=r[i];r[i]=r[j];r[j]=t; saveRoute(r)}
function rm(i){var it=byCo(openCo);if(!it)return;var r=routeOf(it).slice();
  if(r.length<=2)return; r.splice(i,1); saveRoute(r)}
function setCur(i){var it=byCo(openCo);if(!it)return;var r=routeOf(it); saveRoute(r.slice(),r[i])}
function addStage(){
  var it=byCo(openCo); if(!it)return;
  var v=document.getElementById('addStage').value;
  var r=routeOf(it).slice();
  if(r.indexOf(v)>=0){ toast('すでにその段階があります'); return; }
  r.push(v); saveRoute(r);
}
function addCustomStage(){
  var it=byCo(openCo); if(!it)return;
  var el=document.getElementById('newStage');
  var v=el?el.value.trim():'';
  if(!v){ toast('段階の名前を入れてください'); return; }
  if(v.indexOf('>')>=0){ toast('「>」は使えません'); return; }
  var r=routeOf(it).slice();
  if(r.indexOf(v)>=0){ toast('すでにその段階があります'); return; }
  r.push(v);
  if(el) el.value='';
  saveRoute(r);
  toast(v+' を追加しました',true);
}

/* ============ 検索 ============ */
function openSearch(){
  var box=document.getElementById('sheet');
  box.innerHTML='<div class="sheet spot" onclick="closeSheet(event)"><div class="spotbox">'+
    '<input id="q" placeholder="会社名を入力" autocomplete="off">'+
    '<div id="qres"></div></div></div>';
  if(!isWide()) sheetOpened();
  requestAnimationFrame(function(){
    var sh=box.querySelector('.sheet');
    if(sh) sh.classList.add('is-active');
  });
  var q=document.getElementById('q');
  q.addEventListener('input',function(){searchRun(q.value)});
  q.addEventListener('keydown',function(e){
    if(e.key==='Enter'){var f=document.querySelector('#qres button');if(f)f.click()}
    if(e.key==='Escape')closeSheet();
  });
  searchRun('');
  setTimeout(function(){q.focus()},80);
}
function searchRun(v){
  var t=v.trim();
  var L=DATA.items.filter(function(i){return !t||i.c.indexOf(t)>=0}).slice(0,8);
  document.getElementById('qres').innerHTML = L.length? L.map(function(it){
    return '<button onclick="pick(\''+esc(it.c)+'\',\''+esc(it.term||'夏インターン')+'\')">'+
      logo(it,26)+'<span class="qn">'+esc(it.c)+'</span>'+
      '<span class="qs">'+esc(it.status||'')+' '+esc(it.stage||'')+'</span></button>';
  }).join('') : '<div class="qempty">見つかりません</div>';
}
function pick(co,term){
  var jump=function(){ TERM=term; openCo=co; tab='info'; render(true); renderDetail(); };
  if(!isWide()&&pushed){ closeOverlay(); setTimeout(jump,240); }
  else { document.getElementById('sheet').innerHTML=''; jump(); }
}
document.addEventListener('keydown',function(e){
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}
  if(e.key==='Escape'){
    if(document.getElementById('sheet').innerHTML) closeSheet();
    else if(isWide()&&openCo) closeSide();
  }
});
document.addEventListener('click',function(e){
  if(!isWide()||!openCo)return;
  if(document.getElementById('sheet').innerHTML)return;
  var t=e.target;
  if(t.closest('#side')||t.closest('.row')||t.closest('.hero')||
     t.closest('.stripitem')||t.closest('.tabbar')||t.closest('.chips')||t.closest('.seg'))return;
  closeSide();
});

/* ============ 究極リキッドグラス操作 ============ */
var CAN_REFRACT = (function(){
  try{ return window.CSS && CSS.supports &&
    (CSS.supports('backdrop-filter','url(#x)') || CSS.supports('-webkit-backdrop-filter','url(#x)')); }
  catch(e){ return false }
})();
if(CAN_REFRACT) document.documentElement.classList.add('can-refract');
function setWarp(v){
  if(!CAN_REFRACT)return;
  var el=document.getElementById('liquidDisp');
  if(el) el.setAttribute('scale', String(v));
}

function attachLiquid(host, ids, onPick, isActive){
  if(!host || host._liquid) return;
  host._liquid = true;
  var pill = host.querySelector('.pill');
  if(!pill) return;

  var press = 0, lifted = false, startX = 0, lastX = 0, lastT = 0, vx = 0;
  var startVisualX = 0, originLeft = 0;
  var pointerId = null;

  function btns(){
    return ids.map(function(id){ return document.getElementById(id); })
              .filter(function(b){ return !!b; });
  }

  function getActiveIndex(){
    var bList = btns();
    for(var i = 0; i < bList.length; i++){
      if(isActive(i)) return i;
    }
    return 0;
  }

  function getButtonTargets(){
    originLeft = pill.offsetLeft || 4;
    return btns().map(function(b){
      return b.offsetLeft - originLeft;
    });
  }

  function lift(){
    lifted = true;
    host.classList.add('lifted', 'grabbing');
    var targets = getButtonTargets();
    var curIdx = getActiveIndex();
    startVisualX = targets[curIdx] !== undefined ? targets[curIdx] : 0;
    setWarp(12);
    if(navigator.vibrate) try{ navigator.vibrate(12); }catch(e){}
  }

  function move(deltaX){
    var targets = getButtonTargets();
    if(!targets.length) return;
    var minX = targets[0];
    var maxX = targets[targets.length - 1];

    /* 内部に厳格クランプ */
    var curX = Math.max(minX, Math.min(maxX, startVisualX + deltaX));

    var st = Math.max(-0.16, Math.min(0.16, vx * 0.06));
    setWarp(10 + Math.min(26, Math.abs(vx) * 2.2));
    var sx = 1 + Math.abs(st);
    var sy = 1 - Math.abs(st) * 0.55;

    pill.style.transform = 'translate3d(' + curX + 'px,0,0) scaleX(' + sx.toFixed(3) + ') scaleY(' + sy.toFixed(3) + ')';

    var pr = pill.getBoundingClientRect(), hr = host.getBoundingClientRect();
    if(pr.width > 0){
      pill.style.setProperty('--gx', Math.max(0, Math.min(100, ((lastX - pr.left) / pr.width) * 100)).toFixed(0) + '%');
    }
    if(hr.width > 0){
      host.style.setProperty('--hx', Math.max(0, Math.min(100, ((lastX - hr.left) / hr.width) * 100)).toFixed(0) + '%');
    }
  }

  function drop(){
    clearTimeout(press);
    if(pointerId !== null){
      try{ host.releasePointerCapture(pointerId); }catch(e){}
      pointerId = null;
    }
    host.classList.remove('lifted', 'grabbing');
    setWarp(0);
    if(!lifted) return;
    lifted = false;

    var targets = getButtonTargets();
    var curX = startVisualX + (lastX - startX);
    var best = 0, bestDist = 1e9;
    targets.forEach(function(tx, i){
      var d = Math.abs(tx - curX);
      if(d < bestDist){ bestDist = d; best = i; }
    });

    host.classList.add('settling');
    pill.style.transform = '';
    pill.style.removeProperty('--gx');
    host.style.removeProperty('--hx');
    setTimeout(function(){ host.classList.remove('settling'); }, 540);

    if(!isActive(best)) onPick(best);
  }

  host.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  host.addEventListener('selectstart', function(e){ e.preventDefault(); });

  host.addEventListener('pointerdown', function(e){
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    startX = lastX = e.clientX;
    lastT = Date.now();
    vx = 0;
    pointerId = e.pointerId;
    try{ host.setPointerCapture(e.pointerId); }catch(err){}
    clearTimeout(press);
    press = setTimeout(lift, 220);
  });

  host.addEventListener('pointermove', function(e){
    var t = Date.now(), dt = Math.max(1, t - lastT);
    vx = (e.clientX - lastX) / dt * 10;
    lastX = e.clientX;
    lastT = t;

    if(!lifted){
      if(Math.abs(e.clientX - startX) > 10){
        clearTimeout(press);
      }
      return;
    }
    e.preventDefault();
    move(e.clientX - startX);
  });

  host.addEventListener('pointerup', drop);
  host.addEventListener('pointercancel', drop);
}

function initLiquid(){

    function(i){ setPage(i===0?'list':'pass') },
    function(i){ return (i===0) === (PAGE==='list') });

    function(i){ setTerm(TERMS[i]) },
    function(i){ return TERM===TERMS[i] });
}

/* ============ 記録 ============ */
function tally(){
  var t={};
  var bump=function(s,k){if(!t[s])t[s]={p:0,f:0,w:0};t[s][k]++};
  ITEMS().forEach(function(it){
    if(!isCo(it))return;
    var r=routeOf(it),cur=it.lost||it.stage,i=r.indexOf(cur),st=stOf(it);
    if(st==='skip')return;
    if(i<0){bump(cur, st==='fail'?'f':(st==='offer'||st==='fixed')?'p':'w');return}
    for(var k=0;k<i;k++)bump(r[k],'p');
    if(st==='fail')bump(cur,'f');
    else if(st==='offer'||st==='fixed')bump(cur,'p');
    else bump(cur,'w');
  });
  return t;
}
function renderPassport(pageChanged){
  var t=tally();
  var order=DEFAULT_ROUTE.concat(PALETTE.filter(function(p){return DEFAULT_ROUTE.indexOf(p)<0}));
  var rows=order.filter(function(s){return t[s]});
  var max=1; rows.forEach(function(s){max=Math.max(max,t[s].p+t[s].f+t[s].w)});

  var LIST=ITEMS().filter(isCo);
  var live=LIST.filter(function(i){return ['todo','waiting','fixed','offer'].indexOf(stOf(i))>=0});
  var fails=LIST.filter(function(i){return stOf(i)==='fail'});
  var entered=LIST.filter(function(i){return stOf(i)!=='skip'});
  var skipped=LIST.filter(function(i){return stOf(i)==='skip'});
  var passes=0; rows.forEach(function(s){passes+=t[s].p});

  var worst=null;
  rows.forEach(function(s){ if(!worst||t[s].f>t[worst].f) worst=s });

  var waits=LIST.filter(function(i){return stOf(i)==='waiting'})
    .map(function(i){return {c:i.c, d:since(i.since||(i.due?i.due.slice(0,10):null))||0}})
    .sort(function(a,b){return b.d-a.d});
  var avg=waits.length?Math.round(waits.reduce(function(a,b){return a+b.d},0)/waits.length):0;

  var deepest='—';
  LIST.forEach(function(it){
    var r=routeOf(it), i=r.indexOf(it.lost||it.stage);
    if(i<0)return;
    if(order.indexOf(r[i])>order.indexOf(deepest)) deepest=r[i];
  });

  var cA=[], cB=[];

  cA.push('<div class="pcard po1" style="background:linear-gradient(155deg,rgba(42,34,102,0.82) 0%,rgba(28,58,120,0.85) 55%,rgba(30,83,138,0.88) 100%);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);color:#EAF0FF">'+
    '<div class="ttl">'+TERM+' パスポート</div>'+
    '<div class="pgrid">'+
      '<div><b>'+entered.length+'</b><span>エントリー社数</span></div>'+
      '<div><b>'+passes+'</b><span>通過した選考</span></div></div>'+
    '<div class="pmini">'+
      '<span>進行中 <b>'+live.length+'</b></span>'+
      '<span>終了 <b>'+fails.length+'</b></span>'+
      '<span>見送り <b>'+skipped.length+'</b></span></div>'+
    '<div class="pfoot">最も進んだ段階 '+esc(deepest)+'</div></div>');

  if(worst && t[worst].f > 0 && fails.length > 0){
    var failPercent = Math.round((t[worst].f / fails.length) * 100);
    cA.push('<div class="pcard po2" style="background:linear-gradient(155deg,rgba(122,31,43,0.85) 0%,rgba(84,20,31,0.88) 100%);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);color:#FFE9EC">'+
      '<div style="display:flex;align-items:baseline;gap:12px">'+
        '<div class="num">'+t[worst].f+'</div>'+
        '<div style="font-size:15px;font-weight:600">社が'+esc(worst)+'で終了</div></div>'+
      '<div class="pfoot">終了'+fails.length+'社のうち'+failPercent+'％がこの段階です</div></div>');
  }

  var rate='<div class="pcard po3 flat"><div class="ttl">段階別の通過率</div><div style="margin-top:14px">';
  rows.forEach(function(sname){
    var o=t[sname],att=o.p+o.f,pc=att?Math.round(o.p/att*100):null;
    rate+='<div class="rateRow"><div class="rateHead">'+
      '<span>'+esc(sname)+'</span>'+
      '<span class="rateNum" style="color:'+(pc===null?'var(--dim)':pc>=50?'var(--go)':'var(--hot)')+'">'+
      (pc===null?'—':pc+'%')+'<i>'+o.p+'/'+att+'</i></span></div>'+
      '<div class="bar" style="width:'+Math.max(18,(o.p+o.f+o.w)/max*100)+'%">'+
      (o.p?'<div style="flex:'+o.p+';background:var(--go)"></div>':'')+
      (o.f?'<div style="flex:'+o.f+';background:var(--fail)"></div>':'')+
      (o.w?'<div style="flex:'+o.w+';background:var(--line)"></div>':'')+'</div></div>';
  });
  rate+='</div><div class="legend">'+
    '<span><i style="background:var(--go)"></i>通過</span>'+
    '<span><i style="background:var(--fail)"></i>終了</span>'+
    '<span><i style="background:var(--line)"></i>進行中</span></div></div>';
  cB.push(rate);

  if(waits.length){
    cB.push('<div class="pcard po4" style="background:linear-gradient(155deg,rgba(22,48,78,0.85) 0%,rgba(16,31,51,0.88) 100%);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);color:#DCE9FF">'+
      '<div class="ttl">結果待ち</div>'+
      '<div class="pgrid">'+
        '<div><b>'+waits.length+'</b><span>社</span></div>'+
        '<div><b>'+avg+'</b><span>平均経過日数</span></div>'+
        '<div><b>'+waits[0].d+'</b><span>最長</span></div></div>'+
      '<div class="pfoot">最も長いのは'+esc(waits[0].c)+'</div></div>');
  }

  var brk='<div class="pcard po5 flat"><div class="ttl">進行中の内訳</div><div style="margin-top:10px">';
  ['todo','waiting','fixed','offer'].forEach(function(k){
    var n=LIST.filter(function(i){return stOf(i)===k}).length;
    var lab={todo:'対応中',waiting:'結果待ち',fixed:'参加決定',offer:'内定'}[k];
    var c2={todo:'var(--blue)',waiting:'var(--wait)',fixed:'var(--go)',offer:'var(--go)'}[k];
    brk+='<div class="brkRow"><span>'+lab+'</span>'+
      '<span style="font-family:var(--disp);font-size:21px;font-weight:600;color:'+
      (n?c2:'var(--dim)')+'">'+n+'</span></div>';
  });
  brk+='</div></div>';
  cA.push(brk);

  var h='<div class="ptitle">'+TERM+' 記録</div>'+
    '<div class="pwrap">'+
      '<div class="pcol">'+cA.join('')+'</div>'+
      '<div class="pcol">'+cB.join('')+'</div>'+
    '</div>';

  document.getElementById('view').innerHTML=h;
  if(pageChanged) markEnter(true);
  requestAnimationFrame(syncPills);
  if(isWide()&&!openCo)sideEmpty();
}

/* ============ 接続設定 ============ */
function openSetup(msg){
  hideSplash();
  bgPush(false);
  if(locked){ locked=false; lockScroll(false); }
  pushed=false; openCo=null;
  document.getElementById('sheet').innerHTML='';
  var dock=document.getElementById('tabbar');
  if(dock)dock.style.display='none';
  var side=document.getElementById('side');
  if(side)side.innerHTML='';
  document.getElementById('app').innerHTML=
    '<div class="setup">'+
    '<div class="setupBox">'+
    '<div class="setupMark">就活</div>'+
    '<div class="setupLead">Apps Script のウェブアプリURLと鍵を入れてください。<br>'+
    'この端末にだけ保存され、ページのソースには残りません。</div>'+
    (msg?'<div class="setupErr">'+esc(msg)+'</div>':'')+
    '<div class="lab">ウェブアプリURL</div>'+
    '<input class="f" id="cfgEp" placeholder="https://script.google.com/macros/s/.../exec" value="'+esc(CFG.ep)+'">'+
    '<div class="lab">鍵</div>'+
    '<input class="f" id="cfgKey" type="password" placeholder="WebAppApi.gs の WA_KEY" value="'+esc(CFG.key)+'">'+
    '<button class="big" style="background:#fff;color:#000" onclick="doSetup()">接続する</button>'+
    '</div></div>';
  var k=document.getElementById('cfgKey');
  if(k)k.addEventListener('keydown',function(e){if(e.key==='Enter')doSetup()});
}
function doSetup(){
  var ep=document.getElementById('cfgEp').value.trim();
  var key=document.getElementById('cfgKey').value.trim();
  if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(ep)){
    openSetup('URLは https://script.google.com/macros/s/.../exec の形式です'); return;
  }
  if(!key){ openSetup('鍵を入れてください'); return; }
  saveCfg(ep,key);
  document.getElementById('app').innerHTML=
    '<div class="setup"><div class="setupBox"><div class="setupMark">就活</div>'+
    '<div class="setupLead">接続しています…</div></div></div>';
  api('apiGetData',[]).then(function(j){
    if(!j||!j.items){ openSetup('応答の形式が違います。WebAppApi.gs のデプロイを確認してください'); return; }
    var dock=document.getElementById('tabbar');
    if(dock)dock.style.display='';
    applyData(j);
  }).catch(function(e){
    openSetup(e&&e.message?e.message:'接続できませんでした');
  });
}
function resetCfg(){
  if(!confirm('接続設定を消してやり直しますか。'))return;
  try{localStorage.removeItem('sk_ep');localStorage.removeItem('sk_key');
      localStorage.removeItem('sk_cache');}catch(e){}
  CFG={ep:'',key:''};
  openSetup();
}

window.addEventListener('load',function(){ syncPills(); initLiquid();
  setTimeout(syncPills,80); setTimeout(syncPills,300); });
window.addEventListener('resize',function(){ syncPills() });
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){syncPills()});

if(loadCfg()) load(); else openSetup();
