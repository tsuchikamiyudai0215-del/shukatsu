<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!--
  本番に切り替える日に、リポジトリの一番上の index.html をこの中身に差し替える（GAS_SETUP.md の「本番に切り替える」の11）。
  ここ（v2/cutover/）に置いてあるのは下書き。この場所で開いても、行き先がずれるので動かない。

  ホーム画面の旧版のアイコンは /shukatsu/index.html を開く。ここから同じアイコンの中で /v2/ へ移すと、
  旧版と同じ保存領域で新版が開くので、旧版で手で入れたロゴ（sk_manual_logos）を新版がそのまま写せる。
  location.replace を使うのは、戻る操作で旧版のページへ戻って、行ったり来たりしないようにするため。
-->
<title>就活</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020204">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #04040A; color: #A2A2B2; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; font-size: 14px; }
  a { color: #fff; }
</style>
<script>location.replace('v2/' + location.search + location.hash);</script>
</head>
<body>
<p>新しい画面に移りました。<a href="v2/">こちらから開いてください。</a></p>
</body>
</html>
