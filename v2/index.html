<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- 読み込みの制限。どこかに穴があっても、よそのスクリプトを動かしたり、鍵をよそへ送ったりできないようにする。
     ページの中に直接書いたスクリプトも止めるので、スクリプトは必ずファイルにする。
     style の 'unsafe-inline' は、部品が style="…" で大きさや色を決めているため。
     画像はロゴを会社のサイトや Wikimedia から出すので https: を広く通す。送り先（connect-src）は GAS と Wikidata・Wikipedia だけ。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://www.wikidata.org https://ja.wikipedia.org; worker-src 'self'; manifest-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>就活</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="就活">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#020204">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="color-scheme" content="dark">
<!-- CSS がネットから届くまでの間も暗い色で出す（書かないと、開いた直後にブラウザの初めの色の白が一瞬出る） -->
<style>html,body{background:#04040A}</style>
<link rel="stylesheet" href="css/app.css">
<!-- 状態の変わり方。GAS と同じファイルで、グローバルに Domain を置く -->
<script src="shared/domain.js"></script>
<script type="module" src="js/boot.js"></script>
</head>
<body>

<div id="splash">
  <div class="mark">就活</div>
  <div class="rule"></div>
  <div class="sub">LOADING</div>
  <div class="more" id="splashMore"></div>
</div>

<div id="app"></div>

<nav class="tabbar" id="tabbar">
  <span class="pill" id="dockPill"></span>
  <button id="tb-list" class="on" data-act="page" data-v="list">選考</button>
  <button id="tb-pass" data-act="page" data-v="pass">記録</button>
  <span class="sep"></span>
  <!-- アイコンは文字でなく線で描く。文字だと字体ごとに大きさと上下の位置がずれる -->
  <button class="ico" data-act="search" aria-label="検索"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l4.5 4.5"/></svg></button>
  <button class="ico" data-act="add" aria-label="追加"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</nav>

<div id="side"></div>
<div id="sheet"></div>
<div id="ptr"><span class="ptrRing"></span></div>
<div id="stale">更新中…</div>
<div id="toast"></div>
<div id="busy">SAVING…</div>

<script src="js/fallback.js"></script>

</body>
</html>
